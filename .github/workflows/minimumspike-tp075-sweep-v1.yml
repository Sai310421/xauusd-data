name: MinimumSpike TP0.75 Sweep v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/minimumspike_tp075_sweep_v1.py'
      - '.github/workflows/minimumspike-tp075-sweep-v1.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  tp075-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Nautilus runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nautilus_trader==1.230.0'
      - name: Run TP0.75 sweep
        run: python research/minimumspike_tp075_sweep_v1.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimumspike-tp075-sweep-v1
          path: results/minimumspike-tp075-sweep-v1/
          retention-days: 30
