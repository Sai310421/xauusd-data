name: PR122 Math Supervisor Raw BidAsk 21D

on:
  push:
    branches:
      - research/pr122-regression-raw-21d
    paths:
      - 'research/pr122_math_supervisor_nautilus_raw_21d.py'
      - 'research/vendor/pr122/**'
      - '.github/workflows/pr122-math-supervisor-raw-21d.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-07-27'
  RAW_DAYS: '30'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  ROOT_OUT: results/ae-bt/pr122-${{ github.run_id }}

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        lane: [baseline, kelly, recovery, wasserstein, mpc, kelly_recovery, kelly_recovery_mpc, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax preflight
        run: |
          python -m py_compile research/vendor/pr122/ae_math_supervisor_v1.py
          python -m py_compile research/pr122_math_supervisor_nautilus_raw_21d.py
      - name: Install NautilusTrader
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Ensure verified Raw BidAsk catalog
        shell: bash
        run: |
          set -euo pipefail
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Run lane
        run: python -m research.pr122_math_supervisor_nautilus_raw_21d --catalog "$RAW_CATALOG" --out "$ROOT_OUT/${{ matrix.lane }}" --lane "${{ matrix.lane }}"
      - name: Verify lane evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ROOT_OUT/${{ matrix.lane }}/${{ matrix.lane }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr122-lane-${{ matrix.lane }}-${{ github.run_id }}
          path: results/ae-bt/pr122-${{ github.run_id }}/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pr122-lane-*-${{ github.run_id }}
          path: merged
          merge-multiple: true
      - name: Aggregate and enforce event parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,glob,csv,os
          files=glob.glob("merged/*.json")
          rows=[json.load(open(p)) for p in files]
          required={"baseline","kelly","recovery","wasserstein","mpc","kelly_recovery","kelly_recovery_mpc","full"}
          assert {r["lane"] for r in rows}==required, (len(rows), [r["lane"] for r in rows])
          hashes={r["event_hash"] for r in rows}
          assert len(hashes)==1, hashes
          order=["baseline","kelly","recovery","wasserstein","mpc","kelly_recovery","kelly_recovery_mpc","full"]
          rows=sorted(rows,key=lambda r:order.index(r["lane"]))
          out={"verification_level":"PR122_RAW_BIDASK_NAUTILUS_21D_V1","event_sequence_parity":True,"wr5_status":"INVALID","rows":rows}
          os.makedirs("final",exist_ok=True)
          json.dump(out,open("final/summary.json","w"),indent=2)
          with open("final/kpi.csv","w",newline="") as fh:
              w=csv.DictWriter(fh,fieldnames=list(rows[0].keys()));w.writeheader();w.writerows(rows)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-aggregate-${{ github.run_id }}
          path: final/
          if-no-files-found: error
          retention-days: 90
