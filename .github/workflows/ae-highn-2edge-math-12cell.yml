name: AE HighN 2Edge Math 12Cell Raw BT

on:
  push:
    branches: [ae-highn-2edge-math-bt]
    paths:
      - '.github/workflows/ae-highn-2edge-math-12cell.yml'
      - 'research/ae_highn_2edge_math_raw6x3_bt.py'
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2

jobs:
  cell:
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5, M15]
        mode: [A, B, AB, AB100D]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Raw gate
        run: |
          test "${{ steps.raw-cache.outputs.cache-hit }}" = 'true'
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Compatibility, event-ledger fix, and single-mode isolate
        env:
          MODE: ${{ matrix.mode }}
        run: |
          # Nautilus 1.230 catalog/cache API compatibility.
          sed -i 's/cat.query_quote_ticks(identifiers=\[inst.id.value\])/cat.quote_ticks(instrument_ids=[inst.id.value])/g' research/ae_highn_2edge_math_raw6x3_bt.py
          sed -i 's/self.portfolio.is_net_flat(self.config.instrument_id)/self.cache.positions_open_count(instrument_id=self.config.instrument_id) == 0/g' research/ae_highn_2edge_math_raw6x3_bt.py

          # IMPORTANT: use PositionClosed events as the trade ledger. NETTING position
          # reports can be empty/overwritten after repeated close/reopen cycles.
          sed -i 's/self.debt=0\./self.debt=0.; self.closed=[]; self.fills=0; self.rejected=0; self.pending_order=False/g' research/ae_highn_2edge_math_raw6x3_bt.py
          sed -i 's/if self.cache.positions_open_count(instrument_id=self.config.instrument_id) == 0:/if self.cache.positions_open_count(instrument_id=self.config.instrument_id) == 0 and not self.pending_order:/g' research/ae_highn_2edge_math_raw6x3_bt.py
          sed -i 's/self.submit_order(self.order_factory.market(instrument_id=self.config.instrument_id,order_side=side,quantity=q)); self.entries+=1/self.pending_order=True; self.submit_order(self.order_factory.market(instrument_id=self.config.instrument_id,order_side=side,quantity=q)); self.entries+=1/g' research/ae_highn_2edge_math_raw6x3_bt.py
          sed -i 's/def on_position_closed(self,e): self.direction=0/def on_order_filled(self,e): self.fills+=1; self.pending_order=False\n def on_order_rejected(self,e): self.rejected+=1; self.pending_order=False\n def on_order_denied(self,e): self.rejected+=1; self.pending_order=False\n def on_position_closed(self,e): self.closed.append({"pnl": self.f(e.realized_pnl) if e.realized_pnl is not None else 0.0, "ts_closed": int(e.ts_closed)}); self.direction=0; self.pending_order=False/g' research/ae_highn_2edge_math_raw6x3_bt.py

          # Build KPI trades from the immutable close-event ledger, not post-run NETTING report.
          sed -i 's/trades=extract(e.generate_positions_report(),sym,tf)/trades=[{"symbol":sym,"tf":tf,**x} for x in s.closed]/g' research/ae_highn_2edge_math_raw6x3_bt.py
          sed -i 's/m.update({"signals":s.entries,"blocked":s.blocked,"actions":s.actions,"raw_ticks":len(ticks)})/m.update({"signals":s.entries,"fills":s.fills,"rejected":s.rejected,"closed_events":len(s.closed),"blocked":s.blocked,"actions":s.actions,"raw_ticks":len(ticks)})/g' research/ae_highn_2edge_math_raw6x3_bt.py

          # One matrix cell = one mode.
          sed -i "s/for mode in \[\"A\",\"B\",\"AB\",\"AB100D\"\]:/for mode in [\"$MODE\"]:/g" research/ae_highn_2edge_math_raw6x3_bt.py
      - name: Run one Raw cell
        env:
          TF: ${{ matrix.tf }}
          MODE: ${{ matrix.mode }}
          EXP: ae12-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.mode }}
        run: |
          python research/ae_highn_2edge_math_raw6x3_bt.py --catalog "$RAW_CATALOG" --symbols XAUUSD --timeframes "$TF" --experiment-id "$EXP" --raw-bidask-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ae12-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.mode }}
          path: results/ae-bt/ae12-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 90
