name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: paperwatch_none
            dd_mode: none
            dd_max: 45
            gamma: 2
            lam1: 10
            lam2: 5
            p_tail_max: 0.85
          - name: paperwatch_reserve
            dd_mode: reserve
            dd_max: 45
            gamma: 2
            lam1: 10
            lam2: 5
            p_tail_max: 0.85
          - name: paperwatch_velocity
            dd_mode: velocity
            dd_max: 45
            gamma: 2
            lam1: 10
            lam2: 5
            p_tail_max: 0.85
          - name: paperwatch_chance
            dd_mode: chance
            dd_max: 45
            gamma: 2
            lam1: 10
            lam2: 5
            p_tail_max: 0.85
          - name: paperwatch_full
            dd_mode: full
            dd_max: 45
            gamma: 2
            lam1: 10
            lam2: 5
            p_tail_max: 0.85
          - name: paperwatch_full_g3
            dd_mode: full
            dd_max: 45
            gamma: 3
            lam1: 10
            lam2: 5
            p_tail_max: 0.85
          - name: paperwatch_full_tail090
            dd_mode: full
            dd_max: 45
            gamma: 2
            lam1: 10
            lam2: 5
            p_tail_max: 0.90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: PYTHONPATH=. python research/tickscalper_ae_paperwatch_dd_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --dd-mode ${{ matrix.dd_mode }} --dd-max ${{ matrix.dd_max }} --gamma ${{ matrix.gamma }} --lam1 ${{ matrix.lam1 }} --lam2 ${{ matrix.lam2 }} --p-tail-max ${{ matrix.p_tail_max }} --fast-frac 0.06 --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
