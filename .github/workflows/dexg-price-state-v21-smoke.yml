name: DexG Price-State v2.1 RawTick Smoke

on:
  workflow_dispatch:
  push:
    branches: [research/dexg-price-state-lab-v1]
    paths:
      - 'research/dexg_price_state/price_state_v21_smoke.py'
      - '.github/workflows/dexg-price-state-v21-smoke.yml'

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        variant: [BASE, PA_WICK, CISD, FVG_ICT, FULL]
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: dexg-v21-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
      - name: Restore Raw BidAsk catalog cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard Raw XAUUSD catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run Price-State smoke
        run: |
          python research/dexg_price_state/price_state_v21_smoke.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --variant "${{ matrix.variant }}" \
            --max-ticks 3000000
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: dexg-v21-${{ matrix.variant }}-${{ github.run_id }}
          path: results/dexg-price-state/${{ env.EXPERIMENT_ID }}/${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 90
