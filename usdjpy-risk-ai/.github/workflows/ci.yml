name: USDJPY Risk AI Phase 2 CI

on:
  push:
    branches: [main]
    paths:
      - "usdjpy-risk-ai/**"
  pull_request:
    paths:
      - "usdjpy-risk-ai/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usdjpy-risk-ai-phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-pipeline:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: usdjpy-risk-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: usdjpy-risk-ai/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python tests/fixtures/make_fixture.py --output /tmp/raw_fixture.parquet
      - run: python -m src.collect --input /tmp/raw_fixture.parquet --output /tmp/raw
      - run: python -m src.features --input /tmp/raw --output /tmp/features
      - run: pytest -q
      - run: ruff check .
