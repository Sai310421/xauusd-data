name: Elliott ICT M1 Direction A-B Raw BT v14

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/elliott_ict_m1_direction_ab_v14.py'
      - '.github/workflows/elliott-ict-m1-direction-ab-v14.yml'

permissions:
  contents: read

concurrency:
  group: elliott-ict-m1-direction-ab-v14
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'

jobs:
  bt:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, reverse]

    env:
      EXPERIMENT_ID: m1-direction-${{ matrix.mode }}-v14-${{ github.run_id }}
      EVIDENCE: results/elliott-ict-m1-direction-ab-v14/m1-direction-${{ matrix.mode }}-v14-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p1
          key: elliott-duka-xau-2026-02-25-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p2
          key: elliott-duka-xau-2026-03-27-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p3
          key: elliott-duka-xau-2026-04-26-31d-v3
          fail-on-cache-miss: true

      - name: Run direction A-B
        run: |
          python research/elliott_ict_m1_direction_ab_v14.py             --catalog catalog/elliott_duka_p1             --catalog catalog/elliott_duka_p2             --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}"             --body-mult 1.6             --range-atr-mult 0.9             --direction-mode "${{ matrix.mode }}"

      - name: Sanity gate
        run: |
          python - <<'PY'
          import json, os, sys
          p=os.path.join(os.environ['EVIDENCE'],'result.json')
          r=json.load(open(p))
          if r['N'] != 184:
              print('FAIL: expected the exact v13 signal count N=184, got', r['N'])
              sys.exit(1)
          print('PASS mode=',r['direction_mode'],'N=',r['N'],'PF=',r['PF'],'Net=',r['Net_USD'])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-direction-${{ matrix.mode }}-v14-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
