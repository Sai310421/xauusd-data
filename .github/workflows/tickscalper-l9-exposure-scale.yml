name: TickScalper L9 Exposure Scale
on:
  push:
    branches: [research/tickscalper-original-lineage-v1]
    paths: [.github/workflows/tickscalper-l9-exposure-scale.yml]
permissions:
  contents: read
env:
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        scale: [1.0,0.9,0.8,0.7,0.6]
        hard: [5.75,5.80]
        cd: [50,55]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'nautilus_trader==1.230.0' numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: python research/tickscalper_l9_exposure_ablation.py --catalog "$RAW_CATALOG" --experiment-id "L9SCALE-${{ matrix.scale }}-H${{ matrix.hard }}-CD${{ matrix.cd }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 9 --emergency-distance ${{ matrix.hard }} --emergency-cooldown ${{ matrix.cd }} --l9-add-scale ${{ matrix.scale }} --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode none --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
