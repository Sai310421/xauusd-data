name: AE Math Controller v2 Raw AB100D

on:
  workflow_dispatch:
  push:
    branches: [ae-highn-2edge-math-bt]
    paths:
      - '.github/workflows/ae-math-controller-v2-raw.yml'

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  BT_REV: 'math-controller-v2'

jobs:
  ab100d:
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5, M15]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Raw gate
        run: |
          test "${{ steps.raw-cache.outputs.cache-hit }}" = 'true'
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Patch Nautilus 1.230 + Math Controller v2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/ae_highn_2edge_math_raw6x3_bt.py')
          s=p.read_text()
          s=s.replace('from nautilus_trader.model.enums import AccountType,OmsType,OrderSide','from nautilus_trader.model.enums import AccountType,BookType,OmsType,OrderSide')
          s=s.replace('from nautilus_trader.model.identifiers import InstrumentId','from nautilus_trader.model.identifiers import InstrumentId\nfrom nautilus_trader.model.objects import Quantity')
          s=s.replace('cat.query_quote_ticks(identifiers=[inst.id.value])','cat.quote_ticks(instrument_ids=[inst.id.value])')
          s=s.replace('e.add_venue(venue=SIM,oms_type=OmsType.NETTING,account_type=AccountType.MARGIN,base_currency=USD,starting_balances=[Money(1000,USD)],default_leverage=Decimal("2000"))','e.add_venue(venue=SIM,oms_type=OmsType.NETTING,account_type=AccountType.MARGIN,book_type=BookType.L1_MBP,base_currency=USD,starting_balances=[Money(1000,USD)],default_leverage=Decimal("2000"))')
          run_old='def run(inst,ticks,sym,tf,mode,days):\n cfg='
          run_new='def run(inst,ticks,sym,tf,mode,days):\n zb=sum(1 for t in ticks if t.bid_size.as_double()<=0); za=sum(1 for t in ticks if t.ask_size.as_double()<=0)\n if zb or za:\n  one=Quantity.from_int(1)\n  ticks=[QuoteTick(instrument_id=t.instrument_id,bid_price=t.bid_price,ask_price=t.ask_price,bid_size=t.bid_size if t.bid_size.as_double()>0 else one,ask_size=t.ask_size if t.ask_size.as_double()>0 else one,ts_event=t.ts_event,ts_init=t.ts_init) for t in ticks]\n cfg='
          if run_old not in s: raise SystemExit('run patch target missing')
          s=s.replace(run_old,run_new)
          init_old='self.direction=0; self.entries=0; self.blocked=0; self.actions={}; self.debt=0.'
          init_new='self.direction=0; self.entries=0; self.blocked=0; self.actions={}; self.debt=0.; self.trades=[]; self.fills=0; self.rejects=0; self.opened=0; self.closed=0; self.pending=False; self.reject_reasons={}; self.entry_px=None; self.debt_hist=deque(maxlen=128); self.ds_hist=[]; self.pnr_hist=[]; self.interventions=0; self.natural_waits=0'
          if init_old not in s: raise SystemExit('init patch target missing')
          s=s.replace(init_old,init_new)
          gate_old='if self.portfolio.is_net_flat(self.config.instrument_id):'
          gate_new='if self.cache.positions_open_count(instrument_id=self.config.instrument_id) == 0 and not self.pending:'
          s=s.replace(gate_old,gate_new)
          submit_old='self.submit_order(self.order_factory.market(instrument_id=self.config.instrument_id,order_side=side,quantity=q)); self.entries+=1; self.direction=d; return'
          submit_new='self.pending=True; self.submit_order(self.order_factory.market(instrument_id=self.config.instrument_id,order_side=side,quantity=q)); self.entries+=1; self.direction=d; return'
          s=s.replace(submit_old,submit_new)
          quote_old='bid,ask=self.f(t.bid_price),self.f(t.ask_price); A=self.h.on(Tick(float(t.ts_event),bid,ask,self.f(t.bid_size),self.f(t.ask_size))); B=self.B; act,val,ds,p,inter,adv=self.ctl.decide(A,B,self.debt,0,.8,-self.debt); self.actions[act.value]=self.actions.get(act.value,0)+1'
          quote_new='bid,ask=self.f(t.bid_price),self.f(t.ask_price); A=self.h.on(Tick(float(t.ts_event),bid,ask,self.f(t.bid_size),self.f(t.ask_size))); B=self.B; floatp=0. if self.entry_px is None or self.direction==0 else ((bid-self.entry_px) if self.direction>0 else (self.entry_px-ask))*float(self.config.trade_size); self.debt=max(0.,-floatp); self.debt_hist.append(self.debt); dh=np.diff(np.array(self.debt_hist,float)) if len(self.debt_hist)>2 else np.array([0.]); mu=float(dh.mean()) if len(dh) else 0.; sig=max(.05,float(dh.std())*8 if len(dh)>2 else .8); act,val,ds,p,inter,adv=self.ctl.decide(A,B,self.debt,mu,sig,floatp); self.ds_hist.append(ds); self.pnr_hist.append(p); self.actions[act.value]=self.actions.get(act.value,0)+1; self.natural_waits += int(self.debt<ds or (self.debt>=ds and p>=.35))'
          if quote_old not in s: raise SystemExit('quote patch target missing')
          s=s.replace(quote_old,quote_new)
          exit_old='if mode=="AB100D" and act in (Action.EXIT,Action.REDUCE,Action.HEDGE): self.close_all_positions(self.config.instrument_id)'
          exit_new='if mode=="AB100D" and act in (Action.EXIT,Action.REDUCE,Action.HEDGE,Action.RECOVERY): self.interventions+=1; self.close_all_positions(self.config.instrument_id)'
          s=s.replace(exit_old,exit_new)
          ev_old=' def on_position_closed(self,e): self.direction=0'
          ev_new=' def on_order_filled(self,e):\n  self.fills+=1; self.pending=False\n  if self.entry_px is None and self.direction!=0: self.entry_px=self.f(e.last_px)\n def _reject(self,e):\n  self.rejects+=1; self.pending=False; r=str(getattr(e,"reason","UNKNOWN")); self.reject_reasons[r]=self.reject_reasons.get(r,0)+1\n def on_order_rejected(self,e): self._reject(e)\n def on_order_denied(self,e): self._reject(e)\n def on_order_canceled(self,e): self.pending=False\n def on_position_opened(self,e):\n  self.opened+=1; self.pending=False; self.entry_px=self.f(e.avg_px_open)\n def on_position_closed(self,e):\n  self.direction=0; self.closed+=1; self.pending=False; self.entry_px=None; self.debt=0.; self.debt_hist.clear(); self.trades.append({"pnl":parse_money(e.realized_pnl),"ts_closed":int(e.ts_closed or e.ts_event)})'
          if ev_old not in s: raise SystemExit('events patch target missing')
          s=s.replace(ev_old,ev_new)
          tail_old='e.run(); trades=extract(e.generate_positions_report(),sym,tf); m=metr(trades,days=days); m.update({"signals":s.entries,"blocked":s.blocked,"actions":s.actions,"raw_ticks":len(ticks)}); e.dispose(); return trades,m'
          tail_new='e.run(); trades=[{"symbol":sym,"tf":tf,**x} for x in s.trades]; m=metr(trades,days=days); m.update({"signals":s.entries,"blocked":s.blocked,"fills":s.fills,"rejected":s.rejects,"opened":s.opened,"closed":s.closed,"reject_reasons":s.reject_reasons,"interventions":s.interventions,"natural_waits":s.natural_waits,"Dstar_avg":float(np.mean(s.ds_hist)) if s.ds_hist else 0.,"pNR_avg":float(np.mean(s.pnr_hist)) if s.pnr_hist else 0.,"zero_bid_sizes":zb,"zero_ask_sizes":za,"liquidity_size_floor":1,"actions":s.actions,"raw_ticks":len(ticks)}); e.dispose(); return trades,m'
          if tail_old not in s: raise SystemExit('tail patch target missing')
          s=s.replace(tail_old,tail_new)
          s=s.replace('for mode in ["A","B","AB","AB100D"]:', 'for mode in ["AB100D"]:')
          p.write_text(s)
          compile(s,str(p),'exec')
          print('MATH_CONTROLLER_V2_PATCH_OK')
          PY
      - name: Run AB100D Raw cell
        env:
          TF: ${{ matrix.tf }}
          EXP: aemath2-${{ github.run_id }}-${{ matrix.tf }}
        run: |
          python research/ae_highn_2edge_math_raw6x3_bt.py --catalog "$RAW_CATALOG" --symbols XAUUSD --timeframes "$TF" --experiment-id "$EXP" --raw-bidask-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aemath2-${{ github.run_id }}-${{ matrix.tf }}
          path: results/ae-bt/aemath2-${{ github.run_id }}-${{ matrix.tf }}/
          if-no-files-found: warn
          retention-days: 90
