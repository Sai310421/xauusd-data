config_version: "v1.3.4-multiasset-data"
run_mode: fixture
time:
  canonical_timezone: UTC
  bar_interval: 1h
  label_horizon_bars: 24
  zscore_window_bars: 480
  train_embargo_bars: 24
  no_forward_fill_across_market_close: true
databento:
  api_key_env: DATABENTO_API_KEY
  futures_symbol_mode: provider_continuous_front
  datasets: {futures: GLBX.MDP3, volatility: XCBF.PITCH}
  schema: {futures: ohlcv-1h, volatility: ohlcv-1h}
  stype_in: continuous
  continuous_contract:
    roll_rule: v
    rank: 0
    symbols: {six_j: 6J.v.0, es: ES.v.0, nq: NQ.v.0, zn: ZN.v.0, vx: VX.v.0}
oanda:
  token_env: OANDA_API_TOKEN
  environment: practice
  instrument: USD_JPY
  granularity: H1
  price: M
  timezone: UTC
multiasset:
  source_mode: provider_continuous_front
  back_adjusted: false
  roll_protection:
    invalidate_feature_bar: true
    invalidate_label_horizon: true
  assets:
    rty: {dataset: GLBX.MDP3, continuous_symbol: RTY.v.0, schema: ohlcv-1h}
    gc: {dataset: GLBX.MDP3, continuous_symbol: GC.v.0, schema: ohlcv-1h}
    dxy: {dataset: IFUS.IMPACT, continuous_symbol: DX.v.0, schema: ohlcv-1h}
    us10y: {dataset: GLBX.MDP3, continuous_symbol: 10Y.v.0, schema: ohlcv-1h}
oci:
  region: ap-tokyo-1
  bucket_env: OCI_OBJECT_STORAGE_BUCKET
  namespace_env: OCI_OBJECT_STORAGE_NAMESPACE
  config_file: ~/.oci/config
  profile: DEFAULT
  prefix: usdjpy-risk-ai
feature_store:
  raw_directory: data/raw
  features_directory: data/features
quality: {max_missing_required_features: 0.05, min_positive_samples: 50}
lead_lag: {candidate_lags_bars: [0, 1], min_observations: 240, lookback_bars: 240}
model:
  objective: binary
  n_estimators: 1000
  learning_rate: 0.03
  num_leaves: 64
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  class_weight: balanced
  random_state: 42
calibration:
  primary: isotonic
  fallback: sigmoid
  isotonic_min_validation_rows: 1000
  isotonic_min_positive_samples: 100
  ece_bins: 10
