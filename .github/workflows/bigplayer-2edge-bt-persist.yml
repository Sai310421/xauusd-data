name: BigPlayer 2-EDGE XAUUSD M1 BT Persist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/bigplayer_2edge_bt.py'
      - '.github/workflows/bigplayer-2edge-bt-persist.yml'

permissions:
  contents: write

jobs:
  bigplayer-2edge-bt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Run BT
        run: |
          python research/bigplayer_2edge_bt.py \
            --data csv/XAUUSD/XAUUSD_M1_2026Q1Q2.csv \
            --out results/bigplayer_2edge \
            --horizon 5 \
            --initial-balance 1000 \
            --lot 0.01 \
            --contract-size 100 \
            --round-trip-cost-usd 0.0
      - name: Persist result to repository
        run: |
          git config user.name 'bt-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add results/bigplayer_2edge
          git diff --cached --quiet || git commit -m 'bt: update BigPlayer 2-edge result'
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bigplayer-2edge-bt-${{ github.sha }}
          path: results/bigplayer_2edge/
          retention-days: 30
