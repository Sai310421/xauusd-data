name: TickScalper DD-Only Governor Raw BidAsk
on:
  push:
    branches: [research/tickscalper-original-lineage-v1]
    paths: ['research/tickscalper_dd_only_governor_bt.py','.github/workflows/tickscalper-dd-only-governor.yml']
  workflow_dispatch:
permissions: {contents: read}
env:
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {n: gentleA, lo: .70, hi: .90, floor: .90, cv: 4.0, cvfloor: .90}
          - {n: gentleB, lo: .65, hi: .90, floor: .85, cv: 4.0, cvfloor: .90}
          - {n: gentleC, lo: .70, hi: .95, floor: .85, cv: 3.5, cvfloor: .90}
          - {n: midA, lo: .65, hi: .90, floor: .80, cv: 3.5, cvfloor: .85}
          - {n: midB, lo: .60, hi: .90, floor: .80, cv: 3.0, cvfloor: .85}
          - {n: midC, lo: .70, hi: .90, floor: .80, cv: 3.0, cvfloor: .80}
          - {n: tailA, lo: .75, hi: .95, floor: .80, cv: 2.5, cvfloor: .85}
          - {n: tailB, lo: .70, hi: .95, floor: .75, cv: 2.5, cvfloor: .80}
          - {n: tailC, lo: .65, hi: .95, floor: .75, cv: 2.0, cvfloor: .80}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'nautilus_trader==1.230.0' numpy
      - uses: actions/cache/restore@v4
        with: {path: catalog/raw_bidask, key: ${{ env.RAW_CACHE_KEY }}, fail-on-cache-miss: true}
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: >
          PYTHONPATH=. python research/tickscalper_dd_only_governor_bt.py
          --catalog "$RAW_CATALOG" --experiment-id "DDG-${{ matrix.n }}"
          --cap 28 --lam 3
          --fp-lo ${{ matrix.lo }} --fp-hi ${{ matrix.hi }} --fp-floor ${{ matrix.floor }}
          --cvar-budget ${{ matrix.cv }} --cvar-floor ${{ matrix.cvfloor }}
          --raw-bidask-only
      - if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \;
