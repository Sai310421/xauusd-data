name: AMOS Factory Fusion v1.22 60D Regime Bridge

on:
  push:
    branches:
      - 'bt/amos-factory-fusion-v1'
    paths:
      - '.github/workflows/amos-factory-fusion-v1-22-60d-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-06-27-60d-hydra66-v1

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [RECONSTRUCTED_PY, SET_CANDIDATE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - name: Restore 60d Raw BidAsk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run bridge
        run: |
          python research/amos_factory_fusion_v1_1_phase3_source_aligned_raw_bt.py             --catalog "$RAW_CATALOG"             --experiment-id "v122-60d-${{ matrix.mode }}-${GITHUB_RUN_ID}"             --mode "${{ matrix.mode }}"             --raw-bidask-only
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-fusion-v122-60d-${{ matrix.mode }}-${{ github.run_id }}
          path: results/amos_factory_fusion_v1_1/
          if-no-files-found: warn
          retention-days: 90
