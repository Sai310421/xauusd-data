name: AMOS BBEMA Raw BidAsk Nautilus BT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bt_requests/amos_bbema_rawtick_90d.request'

permissions:
  contents: read
  actions: read

jobs:
  raw-bidask-bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nautilus_trader==1.230.0' numpy pyarrow pandas
      - name: Download Raw BidAsk chunk a
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Sai310421/xauusd-data
          run-id: 41971304049
          name: xauusd-raw-bidask-20260225-90d-a
          path: catalog/xauusd-90d-a
      - name: Download Raw BidAsk chunk b
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Sai310421/xauusd-data
          run-id: 41971304049
          name: xauusd-raw-bidask-20260225-90d-b
          path: catalog/xauusd-90d-b
      - name: Download Raw BidAsk chunk c
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Sai310421/xauusd-data
          run-id: 41971304049
          name: xauusd-raw-bidask-20260225-90d-c
          path: catalog/xauusd-90d-c
      - name: Download Raw BidAsk chunk d
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Sai310421/xauusd-data
          run-id: 41971304049
          name: xauusd-raw-bidask-20260225-90d-d
          path: catalog/xauusd-90d-d
      - name: Assert every Raw BidAsk chunk exists
        run: |
          set -euo pipefail
          for c in a b c d; do test -f "catalog/xauusd-90d-$c/catalog_manifest.json"; done
      - name: Run BB-RSI / EMA-compression Raw BidAsk BT
        env:
          EXPERIMENT_ID: bbema-raw90d-${{ github.run_id }}
        run: |
          python research/amos_bbema_rawtick_bt_v1.py \
            --catalog catalog/xauusd-90d-a --catalog catalog/xauusd-90d-b \
            --catalog catalog/xauusd-90d-c --catalog catalog/xauusd-90d-d \
            --experiment-id "$EXPERIMENT_ID" --lot 0.02 --contract-size 100
      - name: Upload Raw BidAsk BT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-bbema-rawtick-bt-${{ github.run_id }}
          path: results/amos-bbema/
          if-no-files-found: warn
          retention-days: 90
