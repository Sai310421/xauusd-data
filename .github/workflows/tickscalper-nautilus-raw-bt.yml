name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - name: refine_c26_l25_m045
            cap: 26
            lam: 2.5
            start_layer: 8
            min_scale: 0.45
          - name: refine_c26_l25_m05
            cap: 26
            lam: 2.5
            start_layer: 8
            min_scale: 0.5
          - name: refine_c26_l3_m045
            cap: 26
            lam: 3
            start_layer: 8
            min_scale: 0.45
          - name: refine_c26_l3_m05
            cap: 26
            lam: 3
            start_layer: 8
            min_scale: 0.5
          - name: refine_c26_l35_m045
            cap: 26
            lam: 3.5
            start_layer: 8
            min_scale: 0.45
          - name: refine_c26_l35_m05
            cap: 26
            lam: 3.5
            start_layer: 8
            min_scale: 0.5
          - name: refine_c26_l4_m045
            cap: 26
            lam: 4
            start_layer: 8
            min_scale: 0.45
          - name: refine_c26_l4_m05
            cap: 26
            lam: 4
            start_layer: 8
            min_scale: 0.5
          - name: refine_c28_l25_m045
            cap: 28
            lam: 2.5
            start_layer: 8
            min_scale: 0.45
          - name: refine_c28_l25_m05
            cap: 28
            lam: 2.5
            start_layer: 8
            min_scale: 0.5
          - name: refine_c28_l3_m045
            cap: 28
            lam: 3
            start_layer: 8
            min_scale: 0.45
          - name: refine_c28_l3_m05
            cap: 28
            lam: 3
            start_layer: 8
            min_scale: 0.5
          - name: refine_c28_l35_m045
            cap: 28
            lam: 3.5
            start_layer: 8
            min_scale: 0.45
          - name: refine_c28_l35_m05
            cap: 28
            lam: 3.5
            start_layer: 8
            min_scale: 0.5
          - name: refine_c28_l4_m045
            cap: 28
            lam: 4
            start_layer: 8
            min_scale: 0.45
          - name: refine_c28_l4_m05
            cap: 28
