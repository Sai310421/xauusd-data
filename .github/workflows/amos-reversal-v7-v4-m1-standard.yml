name: AMOS Reversal V7 V4 M1 Standard Fast Sanity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bt_requests/amos-reversal-v7-v4-m1-standard.trigger'

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy pyarrow
      - name: Reuse validated raw tick artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw /tmp/amos_raw
          gh api repos/${{ github.repository }}/actions/artifacts/10273812066/zip > /tmp/amos_raw/raw.zip
          unzip -o /tmp/amos_raw/raw.zip -d raw
          test -s raw/XAUUSD_dukascopy_ticks.parquet
      - name: Run V7 fast-touch V4 M1 Standard
        env:
          AMOS_RAW_TICK_PATH: raw/XAUUSD_dukascopy_ticks.parquet
        run: |
          python research/amos_reversal_v1_v4_rawtick_bt_v7_fasttouch.py \
            --version V4 --timeframe M1 --mode STANDARD \
            --symbol XAUUSD --dataset dukascopy_raw --seed 42 --rr 2.0 \
            --out results/amos-v7/V4_M1_STANDARD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amos-v7-V4-M1-STANDARD
          path: results/amos-v7/V4_M1_STANDARD/
          if-no-files-found: error
          retention-days: 90
