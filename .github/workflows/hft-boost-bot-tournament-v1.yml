name: HFT Boost BOT Tournament v1

on:
  push:
    branches: ['hft-boost-raw-bt-v04']
    paths:
      - '.github/workflows/hft-boost-bot-tournament-v1.yml'
      - 'research/hft_boost_bot_tournament_v1.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  PROBE_START: '2026-07-27'
  PROBE_DAYS: '2'

jobs:
  tournament:
    strategy:
      fail-fast: false
      matrix:
        bot: [gold, roy, testbot, midas]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BOT: ${{ matrix.bot }}
      PROBE_CATALOG: catalog/bot_tournament_${{ matrix.bot }}
      EXPERIMENT_ID: bot-tournament-${{ matrix.bot }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - name: Build XAU Raw BidAsk v3
        run: |
          set -euo pipefail
          rm -rf "$PROBE_CATALOG"
          python -m research.build_raw_bidask_catalog_duka_v3 --start "$PROBE_START" --days "$PROBE_DAYS" --catalog "$PROBE_CATALOG" --workers 24 --symbols XAUUSD --fresh
      - name: Run source-faithful BOT port
        run: |
          set -euo pipefail
          python -m research.hft_boost_bot_tournament_v1 --catalog "$PROBE_CATALOG" --experiment-id "$EXPERIMENT_ID" --bot "$BOT" --raw-bidask-only --initial 1000 --trade-size 1
      - name: Capture evidence
        if: always()
        run: |
          OUT="results/ae-bt/$EXPERIMENT_ID"
          mkdir -p "$OUT/preflight"
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "git_sha=$GITHUB_SHA" "bot=$BOT" "nautilus=$NAUTILUS_VERSION" > "$OUT/preflight/github_run.txt"
          [ -f "$PROBE_CATALOG/catalog_manifest.json" ] && cp "$PROBE_CATALOG/catalog_manifest.json" "$OUT/preflight/catalog_manifest.json" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-tournament-${{ matrix.bot }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: warn
          retention-days: 30
