name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - name: ddr_c22_l1_s6
            cap: 22
            lam: 1
            start_layer: 6
          - name: ddr_c22_l1_s7
            cap: 22
            lam: 1
            start_layer: 7
          - name: ddr_c22_l1_s8
            cap: 22
            lam: 1
            start_layer: 8
          - name: ddr_c22_l2_s6
            cap: 22
            lam: 2
            start_layer: 6
          - name: ddr_c22_l2_s7
            cap: 22
            lam: 2
            start_layer: 7
          - name: ddr_c22_l2_s8
            cap: 22
            lam: 2
            start_layer: 8
          - name: ddr_c22_l3_s6
            cap: 22
            lam: 3
            start_layer: 6
          - name: ddr_c22_l3_s7
            cap: 22
            lam: 3
            start_layer: 7
          - name: ddr_c22_l3_s8
            cap: 22
            lam: 3
            start_layer: 8
          - name: ddr_c25_l1_s6
            cap: 25
            lam: 1
            start_layer: 6
          - name: ddr_c25_l1_s7
            cap: 25
            lam: 1
            start_layer: 7
          - name: ddr_c25_l1_s8
            cap: 25
            lam: 1
            start_layer: 8
          - name: ddr_c25_l2_s6
            cap: 25
            lam: 2
            start_layer: 6
          - name: ddr_c25_l2_s7
            cap: 25
            lam: 2
            start_layer: 7
          - name: ddr_c25_l2_s8
            cap: 25
            lam: 2
            start_layer: 8
          - name: ddr_c25_l3_s6
            cap: 25
            lam: 3
            start_layer: 6
          - name: ddr_c25_l3_s7
            cap: 25
            lam: 3
            start_layer: 7
          - name: ddr_c25_l3_s8
            cap: 25
            lam: 3
            start_layer: 8
          - name: ddr_c28_l1_s6
            cap: 28
            lam: 1
            start_layer: 6
          - name: ddr_c28_l1_s7
            cap: 28
            lam: 1
            start_layer: 7
          - name: ddr_c28_l1_s8
            cap: 28
            lam: 1
            start_layer: 8
          - name: ddr_c28_l2_s6
            cap: 28
            lam: 2
            start_layer: 6
          - name: ddr_c28_l2_s7
            cap: 28
            lam: 2
            start_layer: 7
          - name: ddr_c28_l2_s8
            cap: 28
            lam: 2
            start_layer: 8
          - name: ddr_c28_l3_s6
            cap: 28
            lam: 3
            start_layer: 6
          - name: ddr_c28_l3_s7
            cap: 28
            lam: 3
            start_layer: 7
          - name: ddr_c28_l3_s8
            cap: 28
            lam: 3
            start_layer: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: PYTHONPATH=. python research/tickscalper_dynamic_ddr_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --ddr-cap ${{ matrix.cap }} --ddr-lambda ${{ matrix.lam }} --ddr-start-layer ${{ matrix.start_layer }} --ddr-min-scale 0.5 --fast-frac 0.06 --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
