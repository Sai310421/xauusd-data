name: A G75 M5 Quick BT v1
on:
  push:
    paths:
      - 'scripts/a_g75_m5_quick_bt_v1.py'
      - '.github/workflows/a-g75-m5-quick-bt-v1.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python scripts/a_g75_m5_quick_bt_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: a-g75-m5-quick-bt-v1
          path: bt_results/a_g75_m5_quick_v1/
