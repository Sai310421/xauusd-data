name: TickScalper G1 Raw BidAsk Measurement

on:
  push:
    branches: [main]
    paths:
      - 'research/tickscalper_g1_behavioral_rawtick_v1.py'
      - '.github/workflows/tickscalper-g1-rawtick-bt.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  raw-bidask-nautilus-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical 90-day Raw Bid Ask catalog
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Sai310421/xauusd-data
          run-id: 41971304049
          pattern: xauusd-raw-bidask-20260225-90d-*
          path: catalog/download
          merge-multiple: false
      - name: Assemble catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog
          for c in a b c d; do
            src="catalog/download/xauusd-raw-bidask-20260225-90d-$c"
            test -d "$src"
            mv "$src" "catalog/xauusd-90d-$c"
          done
          test "$(find catalog -name catalog_manifest.json | wc -l)" -eq 4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nautilus_trader==1.230.0' numpy pyarrow
      - name: Measure supplied TickScalper G1 source behavior
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/tickscalper-g1/_logs
          python research/tickscalper_g1_behavioral_rawtick_v1.py \
            --catalog catalog/xauusd-90d-a \
            --catalog catalog/xauusd-90d-b \
            --catalog catalog/xauusd-90d-c \
            --catalog catalog/xauusd-90d-d \
            --experiment-id "tickscalper-g1-${{ github.run_id }}" 2>&1 | tee results/tickscalper-g1/_logs/runner.log
      - name: Upload result and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickscalper-g1-result-${{ github.run_id }}
          path: results/tickscalper-g1/
          if-no-files-found: error
          retention-days: 90
