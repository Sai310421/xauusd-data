name: NOTE-HFT Nautilus Public Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, feature/vra-bot01-xauusd-prebt-20260926]
    paths:
      - '.github/workflows/note-hft-nautilus-smoke.yml'
      - 'research/note_hft_nautilus_smoke.py'
      - 'research/vra_bot01_xauusd_prebt.py'
      - 'research/vra_bot01_adaptive_ab.py'
      - 'research/vra_bot01_exit_ab.py'
      - 'research/vra_bot01_sizing_stress.py'
      - 'research/main_candidate_sandeep_source_bt.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Sandeep source-faithful main-candidate pre-BT
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        run: python research/main_candidate_sandeep_source_bt.py
      - name: Upload Sandeep main-candidate result
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        uses: actions/upload-artifact@v4
        with:
          name: main-candidate-sandeep-source-bt
          path: results/main-candidate-sandeep/
          if-no-files-found: error
          retention-days: 30
      - name: Install NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nautilus_trader==1.230.0'
      - name: Run Nautilus + XAUUSD dataset smoke test
        run: python research/note_hft_nautilus_smoke.py
      - name: Run VRA BOT-01 XAUUSD pre-BT on feature branch
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        run: python research/vra_bot01_xauusd_prebt.py
      - name: Run VRA BOT-01 Adaptive A/B
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        run: python research/vra_bot01_adaptive_ab.py
      - name: Run VRA BOT-01 Exit A/B
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        run: python research/vra_bot01_exit_ab.py
      - name: Run VRA BOT-01 DD4 sizing stress
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        run: python research/vra_bot01_sizing_stress.py
      - name: Upload VRA BOT-01 DD4 sizing stress
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        uses: actions/upload-artifact@v4
        with:
          name: vra-bot01-sizing-stress
          path: results/vra-bot01-sizing/
          if-no-files-found: error
      - name: Upload VRA BOT-01 Exit A/B
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        uses: actions/upload-artifact@v4
        with:
          name: vra-bot01-exit-ab
          path: results/vra-bot01-exit-ab/
          if-no-files-found: error
          retention-days: 30
      - name: Upload VRA BOT-01 Adaptive A/B
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        uses: actions/upload-artifact@v4
        with:
          name: vra-bot01-adaptive-ab
          path: results/vra-bot01-adaptive/
          if-no-files-found: error
          retention-days: 30
      - name: Upload VRA BOT-01 pre-BT
        if: github.ref == 'refs/heads/feature/vra-bot01-xauusd-prebt-20260926'
        uses: actions/upload-artifact@v4
        with:
          name: vra-bot01-xauusd-prebt
          path: results/vra-bot01-prebt/
          if-no-files-found: error
          retention-days: 30
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-hft-nautilus-public-smoke
          path: results/note-hft/
          if-no-files-found: error
          retention-days: 30
