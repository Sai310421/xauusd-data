name: G75 Expected Entry FirstPass RawTick v8

on:
  push:
    paths:
      - 'research/g75_expected_entry_firstpass_v8.py'
      - '.github/workflows/g75-expected-entry-firstpass-v8.yml'
  workflow_dispatch:

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: g75-expected-entry-v8-${{ github.run_id }}

jobs:
  expected-entry-v8-cell:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5, M15]
        variant: [PURE, EV_ENTRY, EV_ENTRY_SIZER]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - name: Restore Raw BidAsk catalog cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard Raw XAUUSD catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run spread-correct first-passage EV OOS cell
        run: |
          PYTHONPATH=research python research/g75_expected_entry_firstpass_v8.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --tf "${{ matrix.tf }}" \
            --variant "${{ matrix.variant }}" \
            --tp-move 0.20 \
            --sl-move 0.10 \
            --uncertainty-frac 0.05 \
            --alpha 10.0 \
            --margin 0.0 \
            --horizon-mult 8.0 \
            --raw-bidask-only
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: g75-expected-entry-v8-${{ matrix.tf }}-${{ matrix.variant }}-${{ github.run_id }}
          path: results/g75-expected-entry-v8/${{ env.EXPERIMENT_ID }}/${{ matrix.tf }}_${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 90
