name: AE HighN 2Edge Math 12Cell Raw BT

on:
  push:
    branches: [ae-highn-2edge-math-bt]
    paths:
      - '.github/workflows/ae-highn-2edge-math-12cell.yml'
      - 'research/ae_highn_2edge_math_raw6x3_bt.py'
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  BT_REV: 'event-ledger-v3'

jobs:
  cell:
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5, M15]
        mode: [A, B, AB, AB100D]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Raw gate
        run: |
          test "${{ steps.raw-cache.outputs.cache-hit }}" = 'true'
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Patch 1.230 API + event ledger + single mode
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('research/ae_highn_2edge_math_raw6x3_bt.py')
          s=p.read_text()
          s=s.replace('cat.query_quote_ticks(identifiers=[inst.id.value])','cat.quote_ticks(instrument_ids=[inst.id.value])')
          s=s.replace('self.direction=0; self.entries=0; self.blocked=0; self.actions={}; self.debt=0.', 'self.direction=0; self.entries=0; self.blocked=0; self.actions={}; self.debt=0.; self.trades=[]; self.fills=0; self.rejects=0; self.opened=0; self.closed=0; self.pending=False')
          s=s.replace('if self.portfolio.is_net_flat(self.config.instrument_id):', 'if self.cache.positions_open_count(instrument_id=self.config.instrument_id) == 0 and not self.pending:')
          s=s.replace('self.submit_order(self.order_factory.market(instrument_id=self.config.instrument_id,order_side=side,quantity=q)); self.entries+=1; self.direction=d; return', 'self.submit_order(self.order_factory.market(instrument_id=self.config.instrument_id,order_side=side,quantity=q)); self.entries+=1; self.direction=d; self.pending=True; return')
          s=s.replace(' def on_position_closed(self,e): self.direction=0', ''' def on_order_filled(self,e): self.fills+=1; self.pending=False
           def on_order_rejected(self,e): self.rejects+=1; self.pending=False
           def on_order_denied(self,e): self.rejects+=1; self.pending=False
           def on_order_canceled(self,e): self.pending=False
           def on_position_opened(self,e): self.opened+=1; self.pending=False
           def on_position_closed(self,e):
            self.direction=0; self.closed+=1; self.pending=False
            self.trades.append({"pnl":parse_money(e.realized_pnl),"ts_closed":int(e.ts_closed or e.ts_event)})''')
          old='e.run(); trades=extract(e.generate_positions_report(),sym,tf); m=metr(trades,days=days); m.update({"signals":s.entries,"blocked":s.blocked,"actions":s.actions,"raw_ticks":len(ticks)}); e.dispose(); return trades,m'
          new='e.run(); trades=[{"symbol":sym,"tf":tf,**x} for x in s.trades]; m=metr(trades,days=days); m.update({"signals":s.entries,"blocked":s.blocked,"fills":s.fills,"rejected":s.rejects,"opened":s.opened,"closed":s.closed,"actions":s.actions,"raw_ticks":len(ticks)}); e.dispose(); return trades,m'
          if old not in s: raise SystemExit('run patch target missing')
          s=s.replace(old,new)
          mode=os.environ['MODE']
          s=s.replace('for mode in ["A","B","AB","AB100D"]:', f'for mode in ["{mode}"]:')
          p.write_text(s)
          compile(s,str(p),'exec')
          print('PATCH_OK',mode)
          PY
      - name: Run one Raw cell
        env:
          TF: ${{ matrix.tf }}
          MODE: ${{ matrix.mode }}
          EXP: ae12-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.mode }}
        run: |
          python research/ae_highn_2edge_math_raw6x3_bt.py --catalog "$RAW_CATALOG" --symbols XAUUSD --timeframes "$TF" --experiment-id "$EXP" --raw-bidask-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ae12-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.mode }}
          path: results/ae-bt/ae12-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 90
