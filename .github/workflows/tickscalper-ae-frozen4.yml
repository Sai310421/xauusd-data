name: TickScalper AE Frozen4 Source Fidelity Ablation
on:
  workflow_dispatch:
  push:
    branches:
      - research/tickscalper-original-lineage-v1
    paths:
      - .github/workflows/tickscalper-ae-frozen4.yml
      - research/ae_frozen4_controller.py
      - research/tickscalper_frozen4_stack.py
permissions:
  contents: read
env:
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        level: [ddr_fp, v1, v2, v3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "nautilus_trader==1.230.0"
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run Frozen4 level
        run: >
          python research/tickscalper_frozen4_stack.py
          --catalog "$RAW_CATALOG"
          --experiment-id "FROZEN4-${{ matrix.level }}"
          --base-lot 0.29
          --direction-sign 1
          --session-start 7
          --session-end 17
          --basket-offset 0.8575
          --max-layers 9
          --emergency-distance 5.75
          --emergency-cooldown 55
          --entry-mode ticksmoother
          --ts-ticks-per-bar 5
          --ts-fast 3
          --ts-slow 5
          --ts-conf1 8
          --ts-conf2 13
          --ts-cross-only
          --risk-mode full_math_stack
          --math-level ${{ matrix.level }}
          --ddr-dd-cap 18
          --ddr-lambda 2.5
          --ddr-min-scale 0.5
          --ddr-start-layer 8
          --fp-threshold 0.60
          --fp-block-threshold 0.80
          --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
