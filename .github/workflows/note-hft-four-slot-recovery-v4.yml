name: NOTE-HFT Four Slot Recovery v4
on:
  push:
    paths:
      - 'note_hft/recovery_v4/**'
      - '.github/workflows/note-hft-four-slot-recovery-v4.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify four recovered expressions
        working-directory: note_hft/recovery_v4
        run: python test_recovered_four_slots.py
