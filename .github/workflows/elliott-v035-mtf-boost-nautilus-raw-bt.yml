name: Elliott v0.35 MTF Boost Nautilus Raw BT

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/elliott_v035_mtf_boost_nautilus_raw_bt.py'
      - 'bt_requests/elliott_v035_mtf_boost_nautilus_raw.request'
      - '.github/workflows/elliott-v035-mtf-boost-nautilus-raw-bt.yml'

permissions:
  contents: read

concurrency:
  group: elliott-v035-mtf-boost-nautilus-raw
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'
  INPUT_DIR: external_raw/xauusd
  CATALOG: catalog/amos_complete_external_raw
  START: '2026-02-25T00:00:00Z'
  END: '2026-05-26T23:59:59.999Z'
  CACHE_KEY: amos-complete-external-xauusd-20260225-20260526-v1
  EXPERIMENT_ID: ${{ github.run_id }}
  EVIDENCE: results/elliott-v035-raw/${{ github.run_id }}

jobs:
  raw-bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Restore shared XAUUSD Nautilus Raw BidAsk catalog
        id: catalog-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CATALOG }}
          key: ${{ env.CACHE_KEY }}

      - name: Download upstream raw BidAsk parquet if cache miss
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${INPUT_DIR}"
          base='https://raw.githubusercontent.com/simom1/XAUUSD-history/main/2026'
          for f in             xauusd_2026_02.parquet             xauusd_2026_03_early.parquet             xauusd_2026_03_mid.parquet             xauusd_2026_03_late.parquet             xauusd_2026_04.parquet             xauusd_2026_05.parquet
          do
            curl -fL --retry 5 --retry-delay 3 "${base}/${f}" -o "${INPUT_DIR}/${f}"
          done

      - name: Build Nautilus QuoteTick catalog if cache miss
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        run: |
          python research/import_external_xauusd_raw_parquet_to_nautilus.py             --input-dir "${INPUT_DIR}"             --catalog "${CATALOG}"             --start "${START}"             --end "${END}"             --manifest /tmp/elliott_catalog_manifest.json

      - name: Save shared catalog cache
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CATALOG }}
          key: ${{ env.CACHE_KEY }}

      - name: Run Elliott v0.35 M1 M5 M15 + Triple Boost Raw BidAsk BT
        shell: bash
        run: |
          set -euo pipefail
          python research/elliott_v035_mtf_boost_nautilus_raw_bt.py             --catalog "${CATALOG}"             --experiment-id "${EXPERIMENT_ID}"             --start "${START}"             --end "${END}"

      - name: Upload BT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elliott-v035-raw-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
