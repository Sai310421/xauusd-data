name: XAU Hybrid v0.40 EXACT G75 RAW TICK

on:
  push:
    branches:
      - bt/xau-hybrid-v040-exact-g75-rawtick-20261007
    paths:
      - "research/xau_hybrid_v040_exact_g75_rawtick.py"
      - ".github/workflows/xau-hybrid-v040-exact-g75-rawtick.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: "1.230.0"
  RAW_CATALOG: "catalog/raw_bidask"
  RAW_CACHE_KEY: "raw-bidask-duka-6sym-2026-07-27-30d-v2"

jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile research/xau_hybrid_v040_exact_g75_rawtick.py
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - name: Restore canonical Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard canonical Raw XAUUSD
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run exact source-parity Raw Tick BT
        run: |
          python research/xau_hybrid_v040_exact_g75_rawtick.py             --catalog "$RAW_CATALOG"             --out bt_results/xau_hybrid_v040_exact_g75_rawtick             --raw-bidask-only
      - name: Assert raw-tick-only execution
        run: |
          python - <<'PY'
          import json
          p='bt_results/xau_hybrid_v040_exact_g75_rawtick/result.json'
          x=json.load(open(p))
          m=x['meta']
          assert m['verification_level']=='NAUTILUS_RAW_BIDASK_TICK_V040_EXACT_G75'
          assert m['ohlc_execution_used'] is False
          assert m['intrabar_ohlc_path_used'] is False
          assert m['raw_ticks'] > 1000000
          assert m['g75_source_parity']['multi_level_adds_per_tick'] is True
          assert m['g75_source_parity']['first_trigger_returns_before_adds'] is True
          print('RAW TICK + G75 SOURCE PARITY GUARD PASS', m['raw_ticks'])
          PY
      - name: Print report
        run: cat bt_results/xau_hybrid_v040_exact_g75_rawtick/REPORT.md
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-hybrid-v040-exact-g75-rawtick
          path: bt_results/xau_hybrid_v040_exact_g75_rawtick/
          if-no-files-found: error
          retention-days: 90
