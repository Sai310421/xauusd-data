name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline_core
            math_mode: none
            fp_min: 0.55
            fp_max: 1.00
            base_frac: 0.00
            max_frac: 0.00
            cdar_budget: 12
            edar_budget: 12
            regime_arg: ''
          - name: fp_highrisk_003
            math_mode: fp
            fp_min: 0.85
            fp_max: 1.00
            base_frac: 0.03
            max_frac: 0.03
            cdar_budget: 12
            edar_budget: 12
            regime_arg: ''
          - name: fp_highrisk_005
            math_mode: fp
            fp_min: 0.85
            fp_max: 1.00
            base_frac: 0.05
            max_frac: 0.05
            cdar_budget: 12
            edar_budget: 12
            regime_arg: ''
          - name: fp_cdar_005_b10
            math_mode: fp_cdar
            fp_min: 0.85
            fp_max: 1.00
            base_frac: 0.05
            max_frac: 0.05
            cdar_budget: 10
            edar_budget: 12
            regime_arg: ''
          - name: fp_cdar_0075_b12
            math_mode: fp_cdar
            fp_min: 0.85
            fp_max: 1.00
            base_frac: 0.075
            max_frac: 0.075
            cdar_budget: 12
            edar_budget: 12
            regime_arg: ''
          - name: fp_edar_regime_005_b10
            math_mode: fp_edar_regime
            fp_min: 0.85
            fp_max: 1.00
            base_frac: 0.05
            max_frac: 0.05
            cdar_budget: 10
            edar_budget: 10
            regime_arg: --math-rescue-regime-block
          - name: fp_edar_regime_0075_b12
            math_mode: fp_edar_regime
            fp_min: 0.85
            fp_max: 1.00
            base_frac: 0.075
            max_frac: 0.075
            cdar_budget: 12
            edar_budget: 12
            regime_arg: --math-rescue-regime-block
          - name: fp_veryhigh_005
            math_mode: fp
            fp_min: 0.95
            fp_max: 1.00
            base_frac: 0.05
            max_frac: 0.05
            cdar_budget: 12
            edar_budget: 12
            regime_arg: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: python research/tickscalper_nautilus_raw_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 10 --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode none --rescue-mode none --loss-rescue-hard-fdd 45 --math-rescue-mode ${{ matrix.math_mode }} --math-rescue-fp-min ${{ matrix.fp_min }} --math-rescue-fp-max ${{ matrix.fp_max }} --math-rescue-base-fraction ${{ matrix.base_frac }} --math-rescue-max-fraction ${{ matrix.max_frac }} --math-rescue-cdar-budget ${{ matrix.cdar_budget }} --math-rescue-edar-budget ${{ matrix.edar_budget }} ${{ matrix.regime_arg }} --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
