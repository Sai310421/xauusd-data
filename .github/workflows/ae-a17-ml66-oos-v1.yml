name: AE A17 ML66 OOS v1
on:
  push:
    branches: ["amos/a17-ml66-oos-v1"]
    paths:
      - "scripts/ae_a17_ml66_oos_v1.py"
      - ".github/workflows/ae-a17-ml66-oos-v1.yml"
      - "csv/XAUUSD/XAUUSD_M5_2026Q1Q2.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amos/a17-ml66-oos-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas lightgbm scikit-learn joblib
      - name: Train and evaluate OOS
        id: train
        shell: bash
        run: |
          set +e
          mkdir -p bt_results/ae_a17_ml66_oos_v1
          python scripts/ae_a17_ml66_oos_v1.py > bt_results/ae_a17_ml66_oos_v1/run.log 2>&1
          code=$?
          cat bt_results/ae_a17_ml66_oos_v1/run.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show report
        if: always()
        run: |
          if [ -f bt_results/ae_a17_ml66_oos_v1/report.json ]; then cat bt_results/ae_a17_ml66_oos_v1/report.json; fi
      - name: Upload models and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-a17-ml66-oos-v1
          path: bt_results/ae_a17_ml66_oos_v1/
          retention-days: 30
      - name: Commit report to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bt_results/ae_a17_ml66_oos_v1/report.json bt_results/ae_a17_ml66_oos_v1/oos_predictions.csv bt_results/ae_a17_ml66_oos_v1/run.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Add AE A17 ML66 OOS v1 results"
            git push
          fi

      - name: Fail job if training failed
        if: steps.train.outputs.exit_code != '0'
        run: exit 1
