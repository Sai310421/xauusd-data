name: TickScalper Math6 Ablation
on:
  push:
    branches: [research/tickscalper-original-lineage-v1]
    paths: [.github/workflows/tickscalper-math6-ablation.yml]
permissions:
  contents: read
env:
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lane:
          - {name: A_DDR, mode: ddr, level: ddr}
          - {name: B_DDR_FP, mode: ddr_fp_size, level: ddr_fp}
          - {name: C_V2, mode: full_math_stack, level: v2}
          - {name: D_V3, mode: full_math_stack, level: v3}
          - {name: E_FULL6, mode: full_math_stack, level: full}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'nautilus_trader==1.230.0' numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: >
          python research/tickscalper_math6_stack.py
          --catalog "$RAW_CATALOG"
          --experiment-id "MATH6-${{ matrix.lane.name }}"
          --base-lot 0.29
          --direction-sign 1
          --session-start 7 --session-end 17
          --basket-offset 0.8575
          --max-layers 9
          --emergency-distance 5.75
          --emergency-cooldown 55
          --entry-mode ticksmoother
          --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13
          --ts-cross-only
          --risk-mode ${{ matrix.lane.mode }}
          --math-level ${{ matrix.lane.level }}
          --ddr-dd-cap 18 --ddr-lambda 2.5 --ddr-min-scale 0.5 --ddr-start-layer 8
          --fp-threshold 0.60 --fp-block-threshold 0.80
          --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
