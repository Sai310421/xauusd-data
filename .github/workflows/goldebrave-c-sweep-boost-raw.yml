name: GoldeBrave C Sweep Boost Raw
on:
  push:
    paths:
      - 'research/goldebrave_c_sweep_boost_raw.py'
      - '.github/workflows/goldebrave-c-sweep-boost-raw.yml'
  workflow_dispatch:

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: gb-sweep-boost-${{ github.run_id }}

jobs:
  bt:
    strategy:
      matrix:
        mult: [1.25, 1.5, 2.0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run sweep boost comparison
        run: python research/goldebrave_c_sweep_boost_raw.py --catalog "$RAW_CATALOG" --mult "${{ matrix.mult }}" --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: gb-sweep-boost-${{ github.run_id }}-x${{ matrix.mult }}
          path: results/goldebrave-sweep-boost/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
