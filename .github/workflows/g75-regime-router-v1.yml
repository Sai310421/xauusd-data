name: G75 Regime Router v4 GB30 Range RawTick
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/g75_regime_router_v4_gb30_range.py'
      - '.github/workflows/g75-regime-router-v1.yml'
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      NAUTILUS_VERSION: '1.230.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - name: Restore Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Guard Raw BidAsk
        run: |
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Run v4 hybrid
        run: |
          OUT="results/g75-regime-router-v4/${{ github.run_id }}"
          python research/g75_regime_router_v4_gb30_range.py --catalog "$RAW_CATALOG" --events research/goldebrave_tailguard_supervisor_events.csv --out "$OUT"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g75-regime-router-v4-${{ github.run_id }}
          path: results/g75-regime-router-v4/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
