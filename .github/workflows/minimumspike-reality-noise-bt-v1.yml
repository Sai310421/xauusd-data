name: MinimumSpike NOTE-HFT Reality Noise BT v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/minimumspike_reality_noise_bt_v1.py'
      - '.github/workflows/minimumspike-reality-noise-bt-v1.yml'

permissions:
  contents: read

jobs:
  reality-noise-bt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Nautilus runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nautilus_trader==1.230.0'
      - name: Run Ideal Normal Stress Tail BT
        run: python research/minimumspike_reality_noise_bt_v1.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: minimumspike-note-hft-reality-noise-bt-v1
          path: results/note-hft-reality-v1/
          retention-days: 30

