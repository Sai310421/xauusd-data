name: XAU Hybrid v0.32 Nautilus Raw BT

on:
  push:
    branches:
      - bt/xau-hybrid-v032-20261006
    paths:
      - "scripts/xau_hybrid_v032_bar_bt.py"
      - "research/export_xauusd_m1_from_nautilus_raw.py"
      - ".github/workflows/xau-hybrid-v032-nautilus-raw-bt.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: "1.230.0"
  RAW_CATALOG: "catalog/raw_bidask"
  RAW_CACHE_KEY: "raw-bidask-duka-6sym-2026-07-27-30d-v2"
  XAU_HYBRID_DATA: "/tmp/XAUUSD_M1_NAUTILUS_RAW.csv"

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - name: Restore canonical Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard Raw XAUUSD
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Export XAUUSD M1 from Nautilus Raw QuoteTicks
        run: |
          python research/export_xauusd_m1_from_nautilus_raw.py             --catalog "$RAW_CATALOG"             --out "$XAU_HYBRID_DATA"             --limit-days 30
      - name: Run v0.32 exit-engine diagnostic
        run: python scripts/xau_hybrid_v032_bar_bt.py
      - name: Print report
        run: cat bt_results/xau_hybrid_v032/REPORT.md
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-hybrid-v032-nautilus-raw-bt
          path: bt_results/xau_hybrid_v032/
          if-no-files-found: error
          retention-days: 90
