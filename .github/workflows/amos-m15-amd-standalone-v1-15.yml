name: AMOS M15 AMD Standalone Raw BidAsk v1.15
on:
  workflow_dispatch:
  push:
    branches: [feat/amos-checklist-parity-v1-2]
    paths:
      - 'research/amos_m15_amd_standalone_raw_v1_15.py'
      - '.github/workflows/amos-m15-amd-standalone-v1-15.yml'
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  m15-amd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: python research/amos_m15_amd_standalone_raw_v1_15.py --catalog "$RAW_CATALOG" --out results/amos-m15-amd-standalone-v1-15
      - run: cat results/amos-m15-amd-standalone-v1-15/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amos-m15-amd-standalone-v1-15
          path: results/amos-m15-amd-standalone-v1-15/
          retention-days: 90
