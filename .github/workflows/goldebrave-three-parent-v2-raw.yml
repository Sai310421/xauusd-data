name: GoldeBrave Three Parent V2 Raw
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/goldebrave_three_parent_v2_raw.py'
      - '.github/workflows/goldebrave-three-parent-v2-raw.yml'
permissions:
  contents: read
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: gb-three-parent-v2-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run refined three-parent Raw BT
        run: |
          python research/goldebrave_three_parent_v2_raw.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPERIMENT_ID }}
          path: results/goldebrave-three-parent-v2/${{ env.EXPERIMENT_ID }}/parents.json
          retention-days: 90
