name: C0 MultiSymbol M1M5 BT v1
on:
  push:
    paths:
      - 'scripts/c0_multisymbol_m1m5_bt_v1.py'
      - '.github/workflows/c0-multisymbol-m1m5-bt-v1.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow
      - run: python scripts/c0_multisymbol_m1m5_bt_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: c0-multisymbol-m1m5-bt-v1
          path: bt_results/c0_multisymbol_m1m5_v1/
