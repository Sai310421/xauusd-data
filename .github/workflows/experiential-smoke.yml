name: Experiential AMOS Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: Experiential model slug
        required: false
        default: qwen3.8-27b
  push:
    paths:
      - 'agents/ahae/integrations/experiential_client.py'
      - 'agents/ahae/integrations/experiential_routes.json'
      - '.github/workflows/experiential-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPLABS_API_KEY: ${{ secrets.EXPLABS_API_KEY }}
      EXPLABS_BASE_URL: https://api.experientiallabs.ai/v1
      EXPLABS_SMOKE_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate secret
        shell: bash
        run: |
          if [ -z "$EXPLABS_API_KEY" ]; then
            echo "EXPLABS_API_KEY GitHub Actions secret is not configured."
            echo "Add it under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Experiential health check
        run: python agents/ahae/integrations/experiential_client.py
