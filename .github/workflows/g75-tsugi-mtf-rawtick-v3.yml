name: G75 TSUGI MTF Raw BidAsk BT v3
on:
  push:
    branches: [main]
    paths:
      - 'research/g75_tsugi_mtf_rawtick_v3.py'
      - '.github/workflows/g75-tsugi-mtf-rawtick-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: g75-tsugi-mtf-v3-${{ github.run_id }}
jobs:
  bt-cell:
    strategy:
      fail-fast: false
      matrix:
        gate: [G1, G2, G3]
        variant: [B, C]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run v3 MTF Raw BidAsk cell
        run: python research/g75_tsugi_mtf_rawtick_v3.py --catalog "$RAW_CATALOG" --experiment-id "$EXPERIMENT_ID" --gate "${{ matrix.gate }}" --variant "${{ matrix.variant }}" --raw-bidask-only
      - uses: actions/upload-artifact@v4
        with:
          name: g75-tsugi-v3-${{ matrix.gate }}-${{ matrix.variant }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/cells/${{ matrix.gate }}_${{ matrix.variant }}.json
          retention-days: 90
