            min_scale: 0.5
          - name: refine_c32_l35_m045
            cap: 32
            lam: 3.5
            start_layer: 8
            min_scale: 0.45
          - name: refine_c32_l35_m05
            cap: 32
            lam: 3.5
            start_layer: 8
            min_scale: 0.5
          - name: refine_c32_l4_m045
            cap: 32
            lam: 4
            start_layer: 8
            min_scale: 0.45
          - name: refine_c32_l4_m05
            cap: 32
            lam: 4
            start_layer: 8
            min_scale: 0.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: PYTHONPATH=. python research/tickscalper_dynamic_ddr_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --ddr-cap ${{ matrix.cap }} --ddr-lambda ${{ matrix.lam }} --ddr-start-layer ${{ matrix.start_layer }} --ddr-min-scale ${{ matrix.min_scale }} --fast-frac 0.06 --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
