name: NOTE-HFT Dukascopy Reality Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'note_hft/final_v3/dukascopy_reality_probe.py'
      - '.github/workflows/note-hft-dukascopy-reality-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 14-day reality probe
        run: |
          mkdir -p out
          PYTHONPATH=note_hft/final_v3 python note_hft/final_v3/dukascopy_reality_probe.py \
            --start 2026-08-01T00:00:00 --days 14 --window 5 -o out/dukascopy_reality_probe.json
      - name: Print result
        run: cat out/dukascopy_reality_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: NOTE_HFT_DUKASCOPY_REALITY_PROBE
          path: out/dukascopy_reality_probe.json
          retention-days: 90
