name: AMOS MSSPlus All POI Entries v1.18
on:
  workflow_dispatch:
  push:
    branches: [feat/amos-checklist-parity-v1-2]
    paths: ['research/amos_mssplus_all_poi_entries_v1_18.py','.github/workflows/amos-mssplus-all-poi-v1-18.yml']
permissions: {contents: read}
env: {NAUTILUS_VERSION: '1.230.0', RAW_CATALOG: 'catalog/raw_bidask', RAW_CACHE_KEY: 'raw-bidask-duka-6sym-2026-07-27-30d-v2'}
jobs:
  all-poi:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {tf: [1, 15]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - uses: actions/cache/restore@v4
        with: {path: 'catalog/raw_bidask', key: '${{ env.RAW_CACHE_KEY }}', fail-on-cache-miss: true}
      - run: python research/amos_mssplus_all_poi_entries_v1_18.py --catalog "$RAW_CATALOG" --tf ${{ matrix.tf }} --out results/amos-mssplus-all-poi-v1-18/M${{ matrix.tf }}
      - run: cat results/amos-mssplus-all-poi-v1-18/M${{ matrix.tf }}/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'amos-mssplus-all-poi-v1-18-M${{ matrix.tf }}', path: 'results/amos-mssplus-all-poi-v1-18/M${{ matrix.tf }}/'}
