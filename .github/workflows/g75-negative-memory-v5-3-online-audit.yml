name: G75 Negative Memory v5.3 Online Audit

on:
  push:
    paths:
      - 'research/g75_negative_memory_v5_3_online_audit.py'
      - '.github/workflows/g75-negative-memory-v5-3-online-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask_60d
  RAW_START: '2026-06-27'
  RAW_DAYS: '60'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-06-27-60d-hydra66-v1
  EXPERIMENT_ID: g75-negative-memory-v5-3-${{ github.run_id }}

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy scikit-learn
      - uses: actions/cache/restore@v4
        id: raw-cache
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Ensure 60d catalog once
        shell: bash
        run: |
          set -euo pipefail
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
      - name: Save 60d cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Guard Raw BidAsk
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD

  audit:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        gate: [C1, C2, C3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy scikit-learn
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Run true online Hydra66 audit
        run: python research/g75_negative_memory_v5_3_online_audit.py --catalog "$RAW_CATALOG" --experiment-id "$EXPERIMENT_ID/${{ matrix.gate }}" --gate "${{ matrix.gate }}" --raw-bidask-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g75-v5-3-${{ matrix.gate }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/${{ matrix.gate }}/
          if-no-files-found: warn
          retention-days: 90
