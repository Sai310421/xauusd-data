name: AMOS Checklist Walk-Forward v1.7
on:
  workflow_dispatch:
  push:
    branches: [feat/amos-checklist-parity-v1-2]
    paths:
      - 'research/amos_checklist_walkforward_v1_7.py'
      - '.github/workflows/amos-checklist-walkforward-v1-7.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy scikit-learn
      - name: Expanding chronological walk-forward
        run: |
          python research/amos_checklist_walkforward_v1_7.py \
            --data csv/XAUUSD/XAUUSD_M1_2026Q1Q2.csv \
            --out results/amos-checklist-walkforward-v1-7
      - run: cat results/amos-checklist-walkforward-v1-7/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: amos-checklist-walkforward-v1-7
          path: results/amos-checklist-walkforward-v1-7/
          retention-days: 90
