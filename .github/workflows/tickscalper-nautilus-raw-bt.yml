name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline_core
            hazard_arg: ''
            hazard_start: 7
            hazard_threshold: 0.60
            hazard_lambda: 1.0
            rescue_mode: none
            zr_hard_fdd: 45
          - name: hazard_L7_p055_l05
            hazard_arg: --hazard-distance
            hazard_start: 7
            hazard_threshold: 0.55
            hazard_lambda: 0.5
            rescue_mode: none
            zr_hard_fdd: 45
          - name: hazard_L7_p060_l10
            hazard_arg: --hazard-distance
            hazard_start: 7
            hazard_threshold: 0.60
            hazard_lambda: 1.0
            rescue_mode: none
            zr_hard_fdd: 45
          - name: hazard_L8_p060_l10
            hazard_arg: --hazard-distance
            hazard_start: 8
            hazard_threshold: 0.60
            hazard_lambda: 1.0
            rescue_mode: none
            zr_hard_fdd: 45
          - name: zr_rescue_hard45
            hazard_arg: ''
            hazard_start: 7
            hazard_threshold: 0.60
            hazard_lambda: 1.0
            rescue_mode: zr_adaptive
            zr_hard_fdd: 45
          - name: zr_rescue_hard35
            hazard_arg: ''
            hazard_start: 7
            hazard_threshold: 0.60
            hazard_lambda: 1.0
            rescue_mode: zr_adaptive
            zr_hard_fdd: 35
          - name: hazard_zr_hard45
            hazard_arg: --hazard-distance
            hazard_start: 7
            hazard_threshold: 0.60
            hazard_lambda: 0.75
            rescue_mode: zr_adaptive
            zr_hard_fdd: 45
          - name: hazard_zr_hard35
            hazard_arg: --hazard-distance
            hazard_start: 7
            hazard_threshold: 0.60
            hazard_lambda: 0.75
            rescue_mode: zr_adaptive
            zr_hard_fdd: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: python research/tickscalper_nautilus_raw_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 10 --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode none ${{ matrix.hazard_arg }} --hazard-start-layer ${{ matrix.hazard_start }} --hazard-threshold ${{ matrix.hazard_threshold }} --hazard-lambda ${{ matrix.hazard_lambda }} --rescue-mode ${{ matrix.rescue_mode }} --zr-lot-coeff 1.35 --zr-max-turns 4 --zr-zone-width 3.11 --zr-defense-fdd-trigger 30 --zr-target-pnl 0 --zr-hard-fdd-pct ${{ matrix.zr_hard_fdd }} --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
