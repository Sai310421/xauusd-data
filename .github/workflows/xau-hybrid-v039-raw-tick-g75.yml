name: XAU Hybrid v0.39 RAW TICK G75

on:
  push:
    branches:
      - bt/xau-hybrid-v039-raw-tick-g75-20261007
    paths:
      - "research/xau_hybrid_v039_raw_tick_g75.py"
      - ".github/workflows/xau-hybrid-v039-raw-tick-g75.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: "1.230.0"
  RAW_CATALOG: "catalog/raw_bidask"
  RAW_CACHE_KEY: "raw-bidask-duka-6sym-2026-07-27-30d-v2"

jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile research/xau_hybrid_v039_raw_tick_g75.py
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - name: Restore canonical Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard canonical Raw XAUUSD
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run Nautilus RAW BidAsk tick BT
        run: |
          python research/xau_hybrid_v039_raw_tick_g75.py             --catalog "$RAW_CATALOG"             --out bt_results/xau_hybrid_v039_raw_tick_g75             --raw-bidask-only
      - name: Assert no OHLC execution
        run: |
          python - <<'PY'
          import json
          p='bt_results/xau_hybrid_v039_raw_tick_g75/result.json'
          x=json.load(open(p))
          assert x['verification_level']=='NAUTILUS_RAW_BIDASK_TICK_V039'
          assert x['ohlc_execution_used'] is False
          assert x['raw_ticks'] > 1000000
          print('RAW TICK GUARD PASS', x['raw_ticks'])
          PY
      - name: Print report
        run: cat bt_results/xau_hybrid_v039_raw_tick_g75/REPORT.md
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-hybrid-v039-raw-tick-g75
          path: bt_results/xau_hybrid_v039_raw_tick_g75/
          if-no-files-found: error
          retention-days: 90
