name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline_none
            risk_mode: none
            risk_start_layer: 1
            fdd_t1: 15
            fdd_t2: 25
            fdd_t3: 35
            fdd_s1: 1.00
            fdd_s2: 1.00
            fdd_s3: 1.00
          - name: L9_ref_907555
            risk_mode: floating_governor
            risk_start_layer: 9
            fdd_t1: 15
            fdd_t2: 25
            fdd_t3: 35
            fdd_s1: 0.90
            fdd_s2: 0.75
            fdd_s3: 0.55
          - name: L9_927858
            risk_mode: floating_governor
            risk_start_layer: 9
            fdd_t1: 15
            fdd_t2: 25
            fdd_t3: 35
            fdd_s1: 0.92
            fdd_s2: 0.78
            fdd_s3: 0.58
          - name: L9_907860
            risk_mode: floating_governor
            risk_start_layer: 9
            fdd_t1: 15
            fdd_t2: 25
            fdd_t3: 35
            fdd_s1: 0.90
            fdd_s2: 0.78
            fdd_s3: 0.60
          - name: L9_887555
            risk_mode: floating_governor
            risk_start_layer: 9
            fdd_t1: 15
            fdd_t2: 25
            fdd_t3: 35
            fdd_s1: 0.88
            fdd_s2: 0.75
            fdd_s3: 0.55
          - name: L9_907250
            risk_mode: floating_governor
            risk_start_layer: 9
            fdd_t1: 15
            fdd_t2: 25
            fdd_t3: 35
            fdd_s1: 0.90
            fdd_s2: 0.72
            fdd_s3: 0.50
          - name: L9_t172736_907555
            risk_mode: floating_governor
            risk_start_layer: 9
            fdd_t1: 17
            fdd_t2: 27
            fdd_t3: 36
            fdd_s1: 0.90
            fdd_s2: 0.75
            fdd_s3: 0.55
          - name: L9_t122232_927858
            risk_mode: floating_governor
            risk_start_layer: 9
            fdd_t1: 12
            fdd_t2: 22
            fdd_t3: 32
            fdd_s1: 0.92
            fdd_s2: 0.78
            fdd_s3: 0.58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: python research/tickscalper_nautilus_raw_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 10 --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode ${{ matrix.risk_mode }} --risk-start-layer ${{ matrix.risk_start_layer }} --dd-t1 15 --dd-t2 25 --dd-t3 35 --dd-s1 1.00 --dd-s2 1.00 --dd-s3 1.00 --fdd-t1 ${{ matrix.fdd_t1 }} --fdd-t2 ${{ matrix.fdd_t2 }} --fdd-t3 ${{ matrix.fdd_t3 }} --fdd-s1 ${{ matrix.fdd_s1 }} --fdd-s2 ${{ matrix.fdd_s2 }} --fdd-s3 ${{ matrix.fdd_s3 }} --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
