version: 2.1
# BT and evidence publication are independent gates; artifacts survive either failure.
jobs:
  abc-nautilus-rawtick:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Test evidence publisher (mock GitHub API)
          command: python3 -m unittest discover -s ci/nautilus -p 'test_publish_evidence.py' -v
      - run:
          name: Preflight GitHub evidence publisher credentials
          command: |
            # Record auth failure without preventing the independent Raw Tick run.
            python3 ci/nautilus/publish_evidence.py --preflight-only || echo 'EVIDENCE_PREFLIGHT_BLOCKED: see evidence-preflight.json; final publish gate remains required'
      - run:
          name: Build NautilusTrader container
          command: docker build -f ci/nautilus/Dockerfile -t amos-nautilus-abc .
      - run:
          name: Run genuine Bid Ask Raw Tick BT
          no_output_timeout: 30m
          command: |
            mkdir -p results/amos-abc
            if docker run --rm -e BT_MODE=SMOKE_1D -e BT_START=2026-10-19 -e BT_DAYS=1 -v "$PWD/results/amos-abc:/workspace/results/amos-abc" amos-nautilus-abc; then
              echo 'export EVIDENCE_BT_STATUS=PASS' >> "$BASH_ENV"
            else
              echo 'export EVIDENCE_BT_STATUS=FAIL' >> "$BASH_ENV"
              exit 1
            fi
      - run:
          name: Verify exported KPI and print A01 B01 C01 metrics
          when: always
          command: |
            python3 -c 'import json,pathlib; p=pathlib.Path("results/amos-abc/rawtick-kpi.json"); assert p.is_file(), "KPI missing"; d=json.loads(p.read_text()); assert d.get("raw_ticks",0)>=1000; print(json.dumps(d,indent=2))'
      - run:
          name: Publish Native Fill evidence to GitHub PR (separate gate)
          when: always
          command: |
            python3 ci/nautilus/publish_evidence.py
      - store_artifacts:
          path: results/amos-abc
          destination: abc-nautilus-rawtick
workflows:
  abc-nautilus-rawtick:
    jobs:
      - abc-nautilus-rawtick:
          serial-group: << pipeline.project.slug >>/evidence-pr-30
          filters:
            branches:
              only:
                - research/amos-abc-nautilus-rawtick-20261023
                - fix/issue-31-evidence-publisher
