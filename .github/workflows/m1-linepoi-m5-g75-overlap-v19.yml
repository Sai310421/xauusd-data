name: M1 Line-POI + M5 G75 Direction Overlap BT v19

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/m1_linepoi_m5_g75_overlap_v19.py'
      - '.github/workflows/m1-linepoi-m5-g75-overlap-v19.yml'

permissions:
  contents: read

concurrency:
  group: m1-linepoi-m5-g75-overlap-v19
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'
  EXPERIMENT_ID: overlap-v19-${{ github.run_id }}
  EVIDENCE: results/m1-linepoi-m5-g75-overlap-v19/overlap-v19-${{ github.run_id }}

jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Syntax check
        run: python -m py_compile research/m1_linepoi_m5_g75_overlap_v19.py

      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p1
          key: elliott-duka-xau-2026-02-25-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p2
          key: elliott-duka-xau-2026-03-27-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p3
          key: elliott-duka-xau-2026-04-26-31d-v3
          fail-on-cache-miss: true

      - name: Run integrated overlap diagnostic
        run: |
          python research/m1_linepoi_m5_g75_overlap_v19.py             --catalog catalog/elliott_duka_p1             --catalog catalog/elliott_duka_p2             --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}"             --mode g75             --g75-reversal 0.05

      - name: Diagnostic gate
        run: |
          python - <<'PY'
          import json, os, sys
          p=os.path.join(os.environ['EVIDENCE'],'result.json')
          r=json.load(open(p))
          ov=r['direction_overlap']
          print('M1 N=',r['m1_metrics']['N'],'M1 PF=',r['m1_metrics']['PF'])
          print('M5 base N=',r['base_metrics']['N'],'M5 base PF=',r['base_metrics']['PF'])
          print('SAME episodes=',ov['same_direction']['episodes'],
                'seconds=',ov['same_direction']['total_seconds'],
                'max=',ov['same_direction']['max_episode_seconds'])
          print('OPPOSITE episodes=',ov['opposite_direction']['episodes'],
                'seconds=',ov['opposite_direction']['total_seconds'],
                'max=',ov['opposite_direction']['max_episode_seconds'])
          print('Pattern stats=',r['m1_pattern_stats'])
          if r['base_metrics']['N'] != 136:
              print('FAIL: M5 baseline changed')
              sys.exit(1)
          if r['m1_metrics']['N'] <= 0:
              print('FAIL: M1 v1 interpretation produced no entries')
              sys.exit(1)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-m5-overlap-v19-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
