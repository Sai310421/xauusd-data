name: Video Gate Sequence Raw BT v23

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/video_gate_sequence_v23.py'
      - '.github/workflows/video-gate-sequence-v23.yml'

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  EXPERIMENT_ID: video-gate-sequence-v23-${{ github.run_id }}
  EVIDENCE: results/video-gate-sequence-v23/video-gate-sequence-v23-${{ github.run_id }}

jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - name: Syntax check
        run: python -m py_compile research/video_gate_sequence_v23.py
      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p1, key: elliott-duka-xau-2026-02-25-30d-v3, fail-on-cache-miss: true}
      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p2, key: elliott-duka-xau-2026-03-27-30d-v3, fail-on-cache-miss: true}
      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p3, key: elliott-duka-xau-2026-04-26-31d-v3, fail-on-cache-miss: true}
      - name: Run ordered gate BT
        run: |
          python research/video_gate_sequence_v23.py             --catalog catalog/elliott_duka_p1 --catalog catalog/elliott_duka_p2 --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}" --mode g75 --g75-reversal 0.05
      - name: Verify and print
        run: |
          python - <<'PY'
          import json,os,sys
          r=json.load(open(os.path.join(os.environ['EVIDENCE'],'result.json')))
          print('M5 BASE=',r['base_metrics'])
          print('M1=',r['m1_metrics'])
          print('CORE=',json.dumps(r['framework_core_v1'],indent=2))
          print('COMBINED=',r['combined_realized_metrics'])
          print('OVERLAP=',json.dumps(r['direction_overlap'],indent=2))
          if r['base_metrics']['N']!=136: sys.exit('M5 baseline changed')
          if r['direction_overlap']['opposite_direction']['episodes']!=0: sys.exit('Opposite overlap remains')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-gate-sequence-v23-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
