name: USDJPY Risk AI Train

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    if: github.event_name == 'workflow_dispatch' || vars.USDJPY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: usdjpy-risk-ai
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OCI_OBJECT_STORAGE_BUCKET: ${{ secrets.OCI_OBJECT_STORAGE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: usdjpy-risk-ai/requirements.txt
      - name: Validate production secrets
        run: |
          for name in DATABENTO_API_KEY OANDA_API_TOKEN OCI_OBJECT_STORAGE_BUCKET; do
            test -n "${!name}" || { echo "::error title=Missing production secret::$name"; exit 2; }
          done
      - run: python -m pip install -r requirements.txt
      - name: Restore immutable feature state
        run: |
          python -m src.feature_store hydrate --category raw --directory data/raw
          python -m src.feature_store hydrate --category multiasset --directory data/multiasset
          python -m src.feature_store hydrate --category features --directory data/features --allow-empty
          python -m src.feature_store hydrate --category asset_features --directory data/asset_features --allow-empty
      - name: Train candidates only
        run: |
          python -m src.features --input data/raw --output data/features
          python -m src.asset_features --base data/features --multiasset data/multiasset --output data/asset_features
          python -m src.walkforward --input data/features --output reports
          python -m src.train --input data/features --models models/candidate
          python -m src.train_assets --input data/asset_features --models models/asset_candidate
      - name: Persist immutable training state
        run: |
          python -m src.feature_store publish --category features --directory data/features
          python -m src.feature_store publish --category asset_features --directory data/asset_features
          python -m src.feature_store publish --category candidate_models --directory models