name: G75 Expected Entry Adaptive RawTick v10
on:
  push:
    paths:
      - 'research/g75_expected_entry_adaptive_v10.py'
      - '.github/workflows/g75-expected-entry-adaptive-v10.yml'
  workflow_dispatch:

jobs:
  adaptive-v10:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5, M15]
        k: [1.0, 1.5, 2.0, 2.5]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: g75-expected-entry-v10-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - name: Restore Raw BidAsk catalog cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard Raw XAUUSD catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run adaptive spread-relative expected-entry cell
        run: |
          PYTHONPATH=research python research/g75_expected_entry_adaptive_v10.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --tf "${{ matrix.tf }}" \
            --trigger-mult "${{ matrix.k }}" \
            --spread-window 256 \
            --pb-frac 0.25 \
            --reclaim-frac 0.10 \
            --wait-mult 2.0 \
            --tp-mult 2.0 \
            --cost-mult 2.5 \
            --horizon-mult 8.0 \
            --uncertainty-frac 0.05 \
            --alpha 10.0 \
            --margin 0.0 \
            --raw-bidask-only
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: g75-expected-entry-v10-${{ matrix.tf }}-K${{ matrix.k }}-${{ github.run_id }}
          path: results/g75-expected-entry-v10/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
          if-no-files-found: error
