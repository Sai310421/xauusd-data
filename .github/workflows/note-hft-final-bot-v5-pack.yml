name: NOTE-HFT Final BOT v5 Pack

on:
  push:
    paths:
      - 'note_hft/final_bot_v5/**'
      - '.github/workflows/note-hft-final-bot-v5-pack.yml'
  workflow_dispatch:

jobs:
  verify-and-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify four-slot patch behavior
        run: |
          python - <<'PY'
          from decimal import Decimal
          def calc(asks,bids):
              if len(asks) >= 5 and len(bids) >= 5:
                  a=asks[0]-asks[-1]
                  b=bids[-1]-bids[0]
              else:
                  a=b=Decimal('0')
              buy=(b>0 and a<0)
              sell=(a>0 and b<0)
              return a,b,1 if buy else (-1 if sell else 0)
          D=Decimal
          assert calc(list(map(D,['100','101','102','103','104'])),list(map(D,['99','100','101','102','103'])))[2] == 1
          assert calc(list(map(D,['104','103','102','101','100'])),list(map(D,['103','102','101','100','99'])))[2] == -1
          assert calc(list(map(D,['100','100','100','100','101'])),list(map(D,['99','99','99','99','98'])))[2] == 0
          assert calc(list(map(D,['101','101','101','101','100'])),list(map(D,['98','98','98','98','99'])))[2] == 0
          assert calc(list(map(D,['100','101'])),list(map(D,['99','100'])))[2] == 0
          print('FOUR_SLOT_RECOVERY_TESTS=PASS')
          PY
      - name: Compile patcher
        run: python -m py_compile note_hft/final_bot_v5/apply_four_slot_recovery.py
      - name: Build package
        run: |
          mkdir -p dist/NOTE_HFT_FINAL_BOT_v5
          find note_hft/final_bot_v5 -maxdepth 1 -type f -exec cp {} dist/NOTE_HFT_FINAL_BOT_v5/ \;
          cat > dist/NOTE_HFT_FINAL_BOT_v5/BASELINE_FINGERPRINT.json <<'JSON'
          {
            "N": 176483,
            "BUY": 88223,
            "SELL": 88260,
            "WR_pct": 72.71,
            "PF": 1.74,
            "MaxDD_pct": 3.97,
            "rule": "fingerprint only; never hard-code or optimize N alone"
          }
          JSON
          (cd dist && zip -qr NOTE_HFT_FINAL_BOT_v5.zip NOTE_HFT_FINAL_BOT_v5)
          sha256sum dist/NOTE_HFT_FINAL_BOT_v5.zip | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NOTE_HFT_FINAL_BOT_v5
          path: |
            dist/NOTE_HFT_FINAL_BOT_v5.zip
            dist/SHA256SUMS.txt
          retention-days: 90
