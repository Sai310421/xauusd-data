name: GoldeBrave Standalone BOT Raw BT
# parity runner trigger v1

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Raw Bid/Ask catalog cache key
        required: true
        default: raw-bidask-duka-6sym-2026-07-27-30d-v2
  push:
    paths:
      - 'research/goldebrave_v8c_g75_dualmode_standalone_nautilus_raw_bt.py'
      - '.github/workflows/goldebrave-standalone-bot-raw-bt.yml'

jobs:
  bt:
    strategy:
      fail-fast: false
      matrix:
        mode: [HIGH, SAFE, AUTO]
    runs-on: ubuntu-latest
    env:
      RAW_CATALOG: catalog/raw_bidask
      DEFAULT_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install nautilus_trader==1.230.0 pyarrow pandas numpy
      - name: Resolve cache key
        id: key
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.cache_key }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${DEFAULT_CACHE_KEY}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ steps.key.outputs.value }}
          fail-on-cache-miss: true
      - name: Run standalone BOT parity Raw BT
        run: |
          python -m research.goldebrave_v8c_g75_dualmode_standalone_nautilus_raw_bt \
            --catalog "$RAW_CATALOG" \
            --mode "${{ matrix.mode }}" \
            --experiment-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldebrave-standalone-${{ matrix.mode }}-${{ github.run_id }}
          path: results/goldebrave-standalone/${{ github.run_id }}/${{ matrix.mode }}.json
          if-no-files-found: error
