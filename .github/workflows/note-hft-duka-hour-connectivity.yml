name: NOTE-HFT Duka Hour Connectivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/note-hft-duka-hour-connectivity.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test one XAUUSD trading-hour BI5
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, time
          urls=[
            'https://datafeed.dukascopy.com/datafeed/XAUUSD/2026/07/03/12h_ticks.bi5',
            'https://www.dukascopy.com/datafeed/XAUUSD/2026/07/03/12h_ticks.bi5'
          ]
          for url in urls:
            t=time.time()
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) dukasDataDownloader/1.0'})
              with urllib.request.urlopen(req,timeout=5) as r:
                data=r.read(64)
                print('URL',url,'STATUS',r.status,'BYTES_FIRST',len(data),'CTYPE',r.headers.get('content-type'),'ELAPSED',round(time.time()-t,3))
            except Exception as e:
              print('URL',url,'ERROR',repr(e),'ELAPSED',round(time.time()-t,3))
          PY
