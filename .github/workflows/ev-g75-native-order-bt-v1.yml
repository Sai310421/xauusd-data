name: EV-G75 Native Order Raw BidAsk BT v1

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: Trigger distance
        required: true
        default: '0.12'
      add:
        description: Add distance
        required: true
        default: '0.025'
      reversal:
        description: Reversal distance
        required: true
        default: '0.20'
      trade_size:
        description: XAUUSD quantity per layer
        required: true
        default: '1'
  pull_request:
    branches: [main]
    paths:
      - 'research/ev_g75_native_order_bt_v1.py'
      - '.github/workflows/ev-g75-native-order-bt-v1.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2

jobs:
  native-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - name: Restore Raw BidAsk catalog
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Ensure and validate Raw BidAsk catalog
        run: |
          set -euo pipefail
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Run native order BT
        run: |
          set -euo pipefail
          EXP="ev-g75-native-${{ github.run_id }}"
          python -m research.ev_g75_native_order_bt_v1 \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXP" \
            --trigger "${{ github.event_name == 'workflow_dispatch' && inputs.trigger || '0.12' }}" \
            --add "${{ github.event_name == 'workflow_dispatch' && inputs.add || '0.025' }}" \
            --reversal "${{ github.event_name == 'workflow_dispatch' && inputs.reversal || '0.20' }}" \
            --trade-size "${{ github.event_name == 'workflow_dispatch' && inputs.trade_size || '1' }}" \
            --raw-bidask-only
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ev-g75-native-${{ github.run_id }}
          path: results/ae-bt/ev-g75-native-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
