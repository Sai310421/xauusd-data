name: BigPlayer Finish Synergy 21D
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/bigplayer_finish_synergy_21d.py'
      - '.github/workflows/bigplayer-finish-synergy-21d.yml'
permissions:
  contents: write
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python research/bigplayer_finish_synergy_21d.py
      - name: Persist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/bigplayer_finish_synergy_21d
          git diff --cached --quiet || git commit -m 'bt: persist BigPlayer finish synergy 21d'
          git pull --rebase
          git push
