name: GoldeBrave V8C Split G75 FloatDD5 Raw
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/goldebrave_v8c_split_g75_floatdd5_raw.py'
      - '.github/workflows/goldebrave-v8c-split-g75-floatdd5-raw.yml'
permissions:
  contents: read
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        governor: [off, g1, g2, g3]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: gb-v8c-floatdd5-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run floating DD5 Raw BT
        run: |
          cd research
          python goldebrave_v8c_split_g75_floatdd5_raw.py \
            --catalog "../$RAW_CATALOG" \
            --governor "${{ matrix.governor }}" \
            --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPERIMENT_ID }}-${{ matrix.governor }}
          path: research/results/goldebrave-v8c-split-g75-floatdd5/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
