name: GoldeBrave G75 Math Control V2 Raw
on:
  push:
    paths:
      - 'research/goldebrave_c_g75_math_control_v2_raw.py'
      - '.github/workflows/goldebrave-g75-math-control-v2-raw.yml'
  workflow_dispatch:

jobs:
  bt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [off, v2]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: gb-g75-math-v2-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run floating-DD control v2
        run: python research/goldebrave_c_g75_math_control_v2_raw.py --catalog "$RAW_CATALOG" --mode "${{ matrix.mode }}" --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPERIMENT_ID }}-${{ matrix.mode }}
          path: results/goldebrave-g75-math-v2/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
