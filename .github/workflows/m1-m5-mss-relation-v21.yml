name: M1 Direction After M5 MSS Raw BT v21

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/m1_m5_mss_relation_v21.py'
      - '.github/workflows/m1-m5-mss-relation-v21.yml'

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  EXPERIMENT_ID: mss-relation-v21-${{ github.run_id }}
  EVIDENCE: results/m1-m5-mss-relation-v21/mss-relation-v21-${{ github.run_id }}

jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - name: Syntax check
        run: python -m py_compile research/m1_m5_mss_relation_v21.py
      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p1, key: elliott-duka-xau-2026-02-25-30d-v3, fail-on-cache-miss: true}
      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p2, key: elliott-duka-xau-2026-03-27-30d-v3, fail-on-cache-miss: true}
      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p3, key: elliott-duka-xau-2026-04-26-31d-v3, fail-on-cache-miss: true}
      - name: Run MSS relation diagnostic
        run: |
          python research/m1_m5_mss_relation_v21.py             --catalog catalog/elliott_duka_p1 --catalog catalog/elliott_duka_p2 --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}" --mode g75 --g75-reversal 0.05
      - name: Verify and print
        run: |
          python - <<'PY'
          import json, os, sys
          r=json.load(open(os.path.join(os.environ['EVIDENCE'],'result.json')))
          print('M5 BASE=',r['base_metrics'])
          print('M5 MSS COUNT=',r['m5_mss_events_count'])
          print('M1 ALL=',r['m1_metrics'])
          print('M1 AFTER MSS=',json.dumps(r['m1_after_m5_mss'],indent=2))
          if r['base_metrics']['N'] != 136:
              print('FAIL: M5 baseline changed'); sys.exit(1)
          if r['m1_metrics']['N'] != 131:
              print('FAIL: M1 entry logic changed'); sys.exit(1)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-m5-mss-relation-v21-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
