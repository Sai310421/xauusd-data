name: Elliott ICT All-TF One-EA Raw BT v8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/elliott_ict_alltf_oneea_v8.py'
      - '.github/workflows/elliott-ict-alltf-oneea-v8.yml'

permissions:
  contents: read

concurrency:
  group: elliott-ict-alltf-oneea-v8
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'
  EXPERIMENT_ID: elliott-ict-alltf-oneea-v8-${{ github.run_id }}
  EVIDENCE: results/elliott-ict-alltf-oneea-v8/elliott-ict-alltf-oneea-v8-${{ github.run_id }}

jobs:
  alltf:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p1
          key: elliott-duka-xau-2026-02-25-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p2
          key: elliott-duka-xau-2026-03-27-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p3
          key: elliott-duka-xau-2026-04-26-31d-v3
          fail-on-cache-miss: true

      - name: Run all 3 timeframes independently in one EA
        run: |
          python research/elliott_ict_alltf_oneea_v8.py             --catalog catalog/elliott_duka_p1             --catalog catalog/elliott_duka_p2             --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elliott-ict-alltf-oneea-v8-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
