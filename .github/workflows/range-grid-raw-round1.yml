name: Range Grid Raw BidAsk Round1

on:
  push:
    branches: ['range-grid-round1']
    paths:
      - 'research/range_grid_raw_bt.py'
      - 'research/range_grid_aggregate.py'
      - 'research/build_raw_bidask_catalog_duka_v3.py'
      - 'research/raw_bidask_catalog_guard.py'
      - '.github/workflows/range-grid-raw-round1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-07-27'
  RAW_DAYS: '30'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v3-size6
  EXPERIMENT_ID: range-grid-r1-${{ github.run_id }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import date,timedelta
          variants=['equal_grid','linear_nanpin','atr_grid','sqrt_nanpin','protected_recovery']
          start=date.fromisoformat('2026-07-27')
          include=[]
          for i in range(7):
              a=start+timedelta(days=i); b=a+timedelta(days=1)
              for v in variants:
                  include.append({'day':f'{i+1:02d}','start':a.isoformat(),'end':b.isoformat(),'variant':v})
          print('matrix='+json.dumps({'include':include},separators=(',',':')))
          PY

  prepare-raw-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - name: Restore Raw BidAsk cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Validate or self-heal Raw BidAsk catalog
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.raw-cache.outputs.cache-hit }}" = 'true' ]; then
            python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
          else
            ok=0
            for attempt in 1 2 3; do
              rm -rf "$RAW_CATALOG"; mkdir -p "$RAW_CATALOG"
              if python research/build_raw_bidask_catalog_duka_v3.py \
                   --start "$RAW_START" --days "$RAW_DAYS" \
                   --catalog "$RAW_CATALOG" --workers 32 \
                && python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"; then
                ok=1
                break
              fi
              sleep $((attempt*10))
            done
            test "$ok" -eq 1
          fi
      - name: Save Raw BidAsk cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}

  range-grid-shard:
    needs: [matrix, prepare-raw-catalog]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - name: Restore prepared Raw BidAsk cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Raw Catalog Gate
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Run Range Grid variant
        run: |
          python -m research.range_grid_raw_bt \
            --catalog "$RAW_CATALOG" \
            --experiment-id "${EXPERIMENT_ID}-${{ matrix.variant }}-${{ matrix.day }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --variant "${{ matrix.variant }}" \
            --initial 1000 \
            --base-qty 0.01 \
            --max-layers 5
      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: range-grid-${{ matrix.variant }}-${{ matrix.day }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}-${{ matrix.variant }}-${{ matrix.day }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: range-grid-shard
    if: always() && needs.range-grid-shard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: range-grid-*-${{ github.run_id }}
          path: range-grid-artifacts
          merge-multiple: false
      - name: Aggregate Round1
        run: |
          python -m research.range_grid_aggregate \
            --root range-grid-artifacts \
            --experiment-id "$EXPERIMENT_ID" \
            --initial 1000 \
            --days 7
      - uses: actions/upload-artifact@v4
        with:
          name: range-grid-round1-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          retention-days: 90
