name: AMOS Autonomous MultiTF MultiSymbol 91D

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amos-autonomous-multitf-multisymbol-91d.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amos-autonomous-multitf-multisymbol-91d-v1
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/amos_auto_6sym_91d
  RAW_START: '2026-02-25'
  RAW_DAYS: '91'
  RAW_SYMBOLS: 'XAUUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: amos-auto-raw-bidask-6sym-20260225-91d-v1
  EXPERIMENT_ID: amos-auto-6sym-91d-${{ github.run_id }}

jobs:
  build-and-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy

      - name: Restore 91D six-symbol Raw BidAsk cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Build 91D six-symbol Raw BidAsk cache when missing
        if: steps.raw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python research/build_raw_bidask_catalog_duka.py \
            --start "${RAW_START}" \
            --days "${RAW_DAYS}" \
            --catalog "${RAW_CATALOG}" \
            --workers "${RAW_WORKERS}" \
            --symbols ${RAW_SYMBOLS} \
            --fresh

      - name: Validate 91D six-symbol Raw BidAsk evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RAW_CATALOG'])/'catalog_manifest.json'
          m=json.loads(p.read_text())
          expected={'XAUUSD','EURUSD','GBPUSD','USDJPY','AUDUSD','USDCHF'}
          assert m['status']=='COMPLETE', m
          assert m['data_kind']=='RAW_BIDASK', m
          assert m['ohlc_resample_used'] is False, m
          assert set(m['symbols'])==expected, m
          assert int(m['days'])==91, m
          for s in expected:
              assert int(m['stats'][s]['ticks'])>0, (s,m['stats'][s])
          print(json.dumps({'status':'RAW91D_6SYM_PASS','ticks':{s:m['stats'][s]['ticks'] for s in sorted(expected)}},indent=2))
          PY

      - name: Save 91D six-symbol cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Run 6 symbols x 3 TF on 91D Raw BidAsk
        shell: bash
        run: |
          set -euo pipefail
          python -m research.minimumspike_raw6x3_bt_isolated \
            --catalog "${RAW_CATALOG}" \
            --symbols ${RAW_SYMBOLS} \
            --timeframes M1 M5 M15 \
            --experiment-id "${EXPERIMENT_ID}" \
            --raw-bidask-only

      - name: Select robust parent cells
        shell: bash
        run: |
          set -euo pipefail
          python research/select_top_cells.py \
            --summary "results/ae-bt/${EXPERIMENT_ID}/summary.json" \
            --out "results/ae-bt/${EXPERIMENT_ID}/selected_cells.json" \
            --top-k 12 \
            --min-n 30 \
            --min-pf 1.0 \
            --max-dd 30 \
            --max-per-symbol 3
          cat "results/ae-bt/${EXPERIMENT_ID}/selected_cells.json"

      - name: Evidence gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('results/ae-bt')/os.environ['EXPERIMENT_ID']/'summary.json'
          s=json.loads(p.read_text())
          assert s['ohlc_resample_used'] is False, s
          assert s['data_kind']=='RAW_BIDASK QuoteTick', s
          assert s['process_isolation'] is True, s
          assert len(s['symbols'])==6, s
          assert len(s['timeframes'])==3, s
          assert int(s['period']['days'])==91, s
          print('REALITY_91D_GATE_PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amos-auto-6sym-91d-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
