name: Elliott ICT M1 Five-Split Fib Raw BT v16

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/elliott_ict_m1_fib5_v16.py'
      - '.github/workflows/elliott-ict-m1-fib5-v16.yml'

permissions:
  contents: read

concurrency:
  group: elliott-ict-m1-fib5-v16
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'

jobs:
  bt:
    name: ${{ matrix.direction }}-${{ matrix.entry }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        direction: [normal, reverse]
        entry: [single1, single5, fib5]

    env:
      EXPERIMENT_ID: m1-${{ matrix.direction }}-${{ matrix.entry }}-v16-${{ github.run_id }}
      EVIDENCE: results/elliott-ict-m1-fib5-v16/m1-${{ matrix.direction }}-${{ matrix.entry }}-v16-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p1
          key: elliott-duka-xau-2026-02-25-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p2
          key: elliott-duka-xau-2026-03-27-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p3
          key: elliott-duka-xau-2026-04-26-31d-v3
          fail-on-cache-miss: true

      - name: Run M1 entry comparison
        run: |
          python research/elliott_ict_m1_fib5_v16.py             --catalog catalog/elliott_duka_p1             --catalog catalog/elliott_duka_p2             --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}"             --body-mult 1.6             --range-atr-mult 0.9             --direction-mode "${{ matrix.direction }}"             --entry-mode "${{ matrix.entry }}"

      - name: Sanity gate
        run: |
          python - <<'PY'
          import json, os, sys
          p=os.path.join(os.environ['EVIDENCE'],'result.json')
          r=json.load(open(p))
          st=r['setup_stats']['1']
          if st['mss'] != 184:
              print('FAIL MSS count',st['mss'])
              sys.exit(1)
          if r['entry_mode'] in ('single1','single5'):
              if r['N'] != 182:
                  print('FAIL single-entry N',r['N'])
                  sys.exit(1)
          else:
              if r['N'] <= 0 or st['setups_activated'] <= 0:
                  print('FAIL fib5 no fills')
                  sys.exit(1)
          print('PASS',r['direction_mode'],r['entry_mode'],
                'N=',r['N'],'PF=',r['PF'],'Net=',r['Net_USD'],
                'MaxGrossLots=',r['MaxGrossLots_approx'],
                'layer_fills=',r['layer_fills'])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-${{ matrix.direction }}-${{ matrix.entry }}-v16-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
