name: AMOS GOLD 5IN1 v1.01 RawTick BT
on:
  push:
    branches: ['bt/amos-gold-5in1-v101']
    paths:
      - 'research/amos_gold_5in1_v101_rawtick_bt.py'
      - '.github/workflows/amos-gold-5in1-v101-rawtick-bt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && python -m pip install pandas numpy 'nautilus_trader==1.230.0'
      - name: Raw BidAsk 21-business-day discovery
        run: python research/amos_gold_5in1_v101_rawtick_bt.py --start 2026-07-27 --days 21 --workers 48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amos-gold-5in1-v101-rawtick
          path: results/amos_gold_5in1_v101/
          if-no-files-found: warn
          retention-days: 90
