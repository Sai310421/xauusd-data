name: AMOS CISD v1.6 FebMar Raw Shards
on:
  push:
    branches: [feat/amos-checklist-parity-v1-2]
    paths:
      - '.github/workflows/amos-cisd-v1-6-febmar-raw-shards.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  CATALOG: catalog/amos_complete_external_raw
  CACHE_KEY: amos-complete-external-xauusd-20260225-20260526-v2-normalized
jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: feb25_28
            start: '2026-02-25T00:00:00Z'
            end: '2026-02-28T23:59:59.999999999Z'
          - shard: mar01_10
            start: '2026-03-01T00:00:00Z'
            end: '2026-03-10T23:59:59.999999999Z'
          - shard: mar11_20
            start: '2026-03-11T00:00:00Z'
            end: '2026-03-20T23:59:59.999999999Z'
          - shard: mar21_31
            start: '2026-03-21T00:00:00Z'
            end: '2026-03-31T23:59:59.999999999Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CATALOG }}
          key: ${{ env.CACHE_KEY }}
      - name: Require normalized catalog cache
        run: test "${{ steps.cache.outputs.cache-hit }}" = "true"
      - name: Run Raw shard
        run: |
          OUT="results/cisd-v1-6-febmar/${{ matrix.shard }}"
          python research/amos_video_parity_cisd_v1_5/video_cisd_nautilus_raw.py             --catalog "${CATALOG}" --out "$OUT"             --start "${{ matrix.start }}" --end "${{ matrix.end }}"
          cat "$OUT/summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cisd-v1-6-${{ matrix.shard }}
          path: results/cisd-v1-6-febmar/${{ matrix.shard }}/
