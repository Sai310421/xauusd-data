name: Elliott ICT M5 Core Raw EDGE v6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/elliott_ict_m5_core_raw_v6.py'
      - '.github/workflows/elliott-ict-m5-core-raw-v6.yml'

permissions:
  contents: read

concurrency:
  group: elliott-ict-m5-core-raw-v6
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'
  EXPERIMENT_ID: elliott-ict-m5-core-v6-${{ github.run_id }}
  EVIDENCE: results/elliott-ict-m5-core-v6/elliott-ict-m5-core-v6-${{ github.run_id }}

jobs:
  m5-core-raw:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p1
          key: elliott-duka-xau-2026-02-25-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p2
          key: elliott-duka-xau-2026-03-27-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p3
          key: elliott-duka-xau-2026-04-26-31d-v3
          fail-on-cache-miss: true

      - name: Run M5-only market-near raw BT
        run: |
          python research/elliott_ict_m5_core_raw_v6.py             --catalog catalog/elliott_duka_p1             --catalog catalog/elliott_duka_p2             --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}"

      - name: PF gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['EVIDENCE'])/'result.json'
          r=json.loads(p.read_text())
          pf=float(r['PF'])
          r['PF_gate']='PASS' if pf>1.0 else 'FAIL'
          r['PF_1_20_gate']='PASS' if pf>=1.2 else 'FAIL'
          p.write_text(json.dumps(r,indent=2))
          print(json.dumps({'PF':pf,'PF_gate':r['PF_gate'],'PF_1_20_gate':r['PF_1_20_gate']},indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elliott-ict-m5-core-v6-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
