name: GoldeBrave BP-D Pressure Rescue Raw

on:
  push:
    branches: [ main ]
    paths:
      - 'research/goldebrave_bpd_pressure_rescue_raw.py'
      - '.github/workflows/goldebrave-bpd-pressure-rescue-raw.yml'
  workflow_dispatch:

jobs:
  bt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gate: [55, 60, 65]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: gb-bpd-pressure-rescue-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run BP-D Pressure rescue Raw
        run: |
          python research/goldebrave_bpd_pressure_rescue_raw.py \
            --catalog "$RAW_CATALOG" \
            --gate "${{ matrix.gate }}" \
            --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: gb-bpd-pressure-rescue-${{ github.run_id }}-g${{ matrix.gate }}
          path: results/goldebrave-bpd-pressure-rescue/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
