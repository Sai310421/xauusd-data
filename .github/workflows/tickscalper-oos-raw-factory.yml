name: TickScalper OOS Raw BidAsk Factory
on:
  workflow_dispatch:
  push:
    branches: [research/tickscalper-original-lineage-v1]
    paths: [.github/workflows/tickscalper-oos-raw-factory.yml]
permissions:
  contents: read
concurrency:
  group: raw-bidask-duka-6sym-2026-08-25-30d-oos-v1
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-08-25'
  RAW_DAYS: '30'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-08-25-30d-oos-v1
  FACTORY_EVIDENCE: results/raw-factory/${{ github.run_id }}
jobs:
  raw-factory:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --upgrade pip && python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
      - uses: actions/cache/restore@v4
        id: raw-cache
        with: {path: catalog/raw_bidask, key: ${{ env.RAW_CACHE_KEY }}}
      - name: Ensure unseen OOS catalog
        shell: bash
        run: |
          set -euo pipefail
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
      - name: Guard OOS Raw BidAsk
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Save OOS cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: catalog/raw_bidask, key: ${{ env.RAW_CACHE_KEY }}}
