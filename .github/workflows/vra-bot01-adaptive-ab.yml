name: VRA BOT-01 Adaptive AB
on:
  push:
    branches: [feature/vra-bot01-xauusd-prebt-20260926]
    paths: ['research/vra_bot01_adaptive_ab.py','.github/workflows/vra-bot01-adaptive-ab.yml']
permissions: {contents: read}
jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/vra_bot01_adaptive_ab.py
      - uses: actions/upload-artifact@v4
        with:
          name: vra-bot01-adaptive-ab
          path: results/vra-bot01-adaptive/
          if-no-files-found: error
