name: AMOS Reversal V6 True-MTF M1 Sanity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bt_requests/amos-reversal-v6-m1.trigger'

permissions:
  contents: read
  actions: read

env:
  AMOS_SYMBOL: XAUUSD
  AMOS_SEED: '42'

jobs:
  raw-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reuse validated 90-day Dukascopy raw tick artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw /tmp/amos_raw
          gh api repos/${{ github.repository }}/actions/artifacts/10273812066/zip > /tmp/amos_raw/raw.zip
          unzip -o /tmp/amos_raw/raw.zip -d raw
          test -s raw/XAUUSD_dukascopy_ticks.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: amos-reversal-v6-raw-ticks
          path: |
            raw/XAUUSD_dukascopy_ticks.parquet
            raw/XAUUSD_dukascopy_ticks.manifest.json
          if-no-files-found: error
          retention-days: 7

  m1-sanity:
    needs: raw-data
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {version: V1, mode: BASE}
          - {version: V2, mode: AGGRESSIVE}
          - {version: V2, mode: STANDARD}
          - {version: V2, mode: CONSERVATIVE}
          - {version: V3, mode: AGGRESSIVE}
          - {version: V3, mode: STANDARD}
          - {version: V3, mode: CONSERVATIVE}
          - {version: V4, mode: AGGRESSIVE}
          - {version: V4, mode: STANDARD}
          - {version: V4, mode: CONSERVATIVE}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: amos-reversal-v6-raw-ticks
          path: raw
      - name: Run V6 true-MTF M1 cell
        env:
          AMOS_RAW_TICK_PATH: raw/XAUUSD_dukascopy_ticks.parquet
        run: |
          python research/amos_reversal_v1_v4_rawtick_bt_v6_true_mtf.py \
            --version '${{ matrix.version }}' \
            --timeframe M1 \
            --mode '${{ matrix.mode }}' \
            --symbol XAUUSD \
            --dataset dukascopy_raw \
            --seed "$AMOS_SEED" \
            --rr 2.0 \
            --out 'results/amos-v6/${{ matrix.version }}_M1_${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amos-v6-${{ matrix.version }}-M1-${{ matrix.mode }}
          path: results/amos-v6/${{ matrix.version }}_M1_${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 90
