name: G75 Multi-Horizon Fixed Debt Probe v1

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Unique experiment id'
        required: true
        default: 'g75-fixed-debt-24h-manual'
  push:
    branches:
      - nautilus-parallel-lanes-v1
    paths:
      - 'research/g75_multihorizon_fixed_debt_probe.py'
      - 'research/build_raw_bidask_catalog_duka.py'
      - 'research/raw_bidask_catalog_guard.py'
      - '.github/workflows/g75-multihorizon-fixed-debt-probe-v1.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-07-27'
  RAW_DAYS: '30'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v3-testkitfree
  EXPERIMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment_id || 'g75-fixed-debt-24h-30d-v2' }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare immutable evidence directory
        shell: bash
        run: |
          set -euo pipefail
          OUT="results/ae-bt/$EXPERIMENT_ID/preflight"
          mkdir -p "$OUT"
          printf '%s\n' \
            "run_id=${GITHUB_RUN_ID}" \
            "git_sha=${GITHUB_SHA}" \
            "lane_class=MODULE_RECOVERY" \
            "experiment_id=${EXPERIMENT_ID}" \
            "runner=research.g75_multihorizon_fixed_debt_probe" \
            > "$OUT/github_run.txt"

      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
          python - <<'PY'
          import nautilus_trader
          print('nautilus_trader', nautilus_trader.__version__)
          PY

      - name: Restore immutable Raw BidAsk catalog cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Self-healing Raw BidAsk catalog bootstrap
        if: steps.raw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "RAW_CATALOG_BOOTSTRAP_ATTEMPT=$attempt"
            if python research/build_raw_bidask_catalog_duka.py \
              --start "$RAW_START" \
              --days "$RAW_DAYS" \
              --catalog "$RAW_CATALOG" \
              --workers 32; then
              ok=1
              break
            fi
            rm -rf "$RAW_CATALOG"
            mkdir -p "$RAW_CATALOG"
            sleep $((attempt * 10))
          done
          test "$ok" -eq 1

      - name: Save verified Raw BidAsk catalog cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Capture Raw Catalog preflight evidence
        if: always()
        shell: bash
        run: |
          set -u
          OUT="results/ae-bt/$EXPERIMENT_ID/preflight"
          mkdir -p "$OUT"
          if [ -f "$RAW_CATALOG/catalog_manifest.json" ]; then
            cp "$RAW_CATALOG/catalog_manifest.json" "$OUT/catalog_manifest.json"
          else
            printf '%s\n' '{"status":"MISSING","reason":"catalog_manifest.json unavailable","ohlc_resample_used":false}' > "$OUT/catalog_manifest.json"
          fi
          find "$RAW_CATALOG" -maxdepth 4 -type f -printf '%p %s bytes\n' 2>/dev/null | sort > "$OUT/catalog_inventory.txt" || true

      - name: Fail-closed Raw BidAsk quality gate
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"

      - name: Run G75 multi-horizon fixed-debt probe
        shell: bash
        run: |
          set -euo pipefail
          python -m research.g75_multihorizon_fixed_debt_probe \
            --catalog "$RAW_CATALOG" \
            --symbol XAUUSD \
            --experiment-id "$EXPERIMENT_ID" \
            --raw-bidask-only

      - name: Upload immutable probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-MODULE_RECOVERY-${{ env.EXPERIMENT_ID }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
