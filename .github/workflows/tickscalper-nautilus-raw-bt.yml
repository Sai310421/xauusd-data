name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frozen4_f006_t085
            fast_frac: 0.06
            tail_max: 0.85
            ae_k: 0.20
            ae_rho: 0.08
            hard_fdd: 45
          - name: frozen4_f006_t090
            fast_frac: 0.06
            tail_max: 0.90
            ae_k: 0.20
            ae_rho: 0.08
            hard_fdd: 45
          - name: frozen4_f006_t095
            fast_frac: 0.06
            tail_max: 0.95
            ae_k: 0.20
            ae_rho: 0.08
            hard_fdd: 45
          - name: frozen4_f004_t090
            fast_frac: 0.04
            tail_max: 0.90
            ae_k: 0.20
            ae_rho: 0.08
            hard_fdd: 45
          - name: frozen4_f006_k010
            fast_frac: 0.06
            tail_max: 0.90
            ae_k: 0.10
            ae_rho: 0.08
            hard_fdd: 45
          - name: frozen4_f006_rho012
            fast_frac: 0.06
            tail_max: 0.90
            ae_k: 0.20
            ae_rho: 0.12
            hard_fdd: 45
          - name: frozen4_f006_h40
            fast_frac: 0.06
            tail_max: 0.90
            ae_k: 0.20
            ae_rho: 0.08
            hard_fdd: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: PYTHONPATH=. python research/tickscalper_frozen4_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --fast-frac ${{ matrix.fast_frac }} --tail-max ${{ matrix.tail_max }} --ae-k ${{ matrix.ae_k }} --ae-rho ${{ matrix.ae_rho }} --ae-hard-fdd ${{ matrix.hard_fdd }} --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
