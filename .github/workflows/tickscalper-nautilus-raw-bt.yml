name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline_core
            rescue_mode: none
            rescue_frac: 0.00
            rescue_target: 0.00
            hard_fdd: 45
          - name: loss_003_h40
            rescue_mode: loss_side
            rescue_frac: 0.03
            rescue_target: 0.00
            hard_fdd: 40
          - name: loss_005_h35
            rescue_mode: loss_side
            rescue_frac: 0.05
            rescue_target: 0.00
            hard_fdd: 35
          - name: loss_005_h40
            rescue_mode: loss_side
            rescue_frac: 0.05
            rescue_target: 0.00
            hard_fdd: 40
          - name: loss_005_h45
            rescue_mode: loss_side
            rescue_frac: 0.05
            rescue_target: 0.00
            hard_fdd: 45
          - name: loss_0075_h35
            rescue_mode: loss_side
            rescue_frac: 0.075
            rescue_target: 0.00
            hard_fdd: 35
          - name: loss_0075_h40
            rescue_mode: loss_side
            rescue_frac: 0.075
            rescue_target: 0.00
            hard_fdd: 40
          - name: loss_010_h40
            rescue_mode: loss_side
            rescue_frac: 0.10
            rescue_target: 0.00
            hard_fdd: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: python research/tickscalper_nautilus_raw_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 10 --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode none --rescue-mode ${{ matrix.rescue_mode }} --loss-rescue-fraction ${{ matrix.rescue_frac }} --loss-rescue-target ${{ matrix.rescue_target }} --loss-rescue-hard-fdd ${{ matrix.hard_fdd }} --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
