name: BigPlayer BP-A Combo Raw

on:
  push:
    branches: [ main ]
    paths:
      - 'research/bigplayer_bpa_combo_raw.py'
      - '.github/workflows/bigplayer-bpa-combo-raw.yml'
  workflow_dispatch:

jobs:
  bt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tf: [1, 5, 15]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: bigplayer-bpa-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run BigPlayer BP-A Raw
        run: |
          python research/bigplayer_bpa_combo_raw.py \
            --catalog "$RAW_CATALOG" \
            --tf "${{ matrix.tf }}" \
            --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: bigplayer-bpa-${{ github.run_id }}-m${{ matrix.tf }}
          path: results/bigplayer-bpa-combo/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
