name: Elliott ICT MTF One-EA v0.40 Nautilus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/xauusd_elliottict_mtf_oneea_v040_nautilus.py'
      - '.github/workflows/elliott-ict-mtf-oneea-v040-nautilus.yml'

permissions:
  contents: read

concurrency:
  group: elliott-ict-mtf-oneea-v040
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'

jobs:
  bt:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [current, m1-gate, m15-gate, both-gates]
    env:
      EXPERIMENT_ID: oneea-v040-${{ matrix.mode }}-${{ github.run_id }}
      EVIDENCE: results/elliott-ict-oneea-v040/oneea-v040-${{ matrix.mode }}-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p1
          key: elliott-duka-xau-2026-02-25-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p2
          key: elliott-duka-xau-2026-03-27-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p3
          key: elliott-duka-xau-2026-04-26-31d-v3
          fail-on-cache-miss: true

      - name: Run One-EA v0.40 raw parity BT
        run: |
          python research/xauusd_elliottict_mtf_oneea_v040_nautilus.py             --catalog catalog/elliott_duka_p1             --catalog catalog/elliott_duka_p2             --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}"             --gate-mode "${{ matrix.mode }}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneea-v040-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
