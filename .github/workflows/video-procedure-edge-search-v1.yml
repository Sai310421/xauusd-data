name: Video Procedure Statistical EDGE Search v1

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        required: true
        default: video-edge-search-v1-manual
      symbol:
        required: true
        default: XAUUSD
  push:
    branches: ['feature/video-statistical-edge-search-v1.0-20260921']
    paths:
      - research/video_procedure_edge_search_v1.py
      - .github/workflows/video-procedure-edge-search-v1.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-07-27'
  RAW_DAYS: '30'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment_id || format('video-edge-v1-{0}', github.run_id) }}
  SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol || 'XAUUSD' }}

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: python -m pip install "nautilus_trader==1.230.0" numpy
      - name: Restore Raw BidAsk
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Ensure Raw BidAsk
        run: |
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Search statistical EDGE lanes
        run: python -m research.video_procedure_edge_search_v1 --catalog "$RAW_CATALOG" --symbol "$SYMBOL" --experiment-id "$EXPERIMENT_ID"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-edge-search-${{ env.EXPERIMENT_ID }}
          path: results/video-edge-search/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
