name: TickScalper Conditional Stop Gate
on:
  push:
    branches:
      - research/tickscalper-original-lineage-v1
    paths:
      - .github/workflows/tickscalper-conditional-stop-gate.yml
permissions:
  contents: read
env:
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {name: fixed_best, conditional: false, hard: 4.5, win: 24, ratio: 0.62}
          - {name: C55_W16_R55, conditional: true, hard: 5.5, win: 16, ratio: 0.55}
          - {name: C55_W16_R62, conditional: true, hard: 5.5, win: 16, ratio: 0.62}
          - {name: C55_W24_R55, conditional: true, hard: 5.5, win: 24, ratio: 0.55}
          - {name: C55_W24_R62, conditional: true, hard: 5.5, win: 24, ratio: 0.62}
          - {name: C55_W24_R68, conditional: true, hard: 5.5, win: 24, ratio: 0.68}
          - {name: C55_W32_R62, conditional: true, hard: 5.5, win: 32, ratio: 0.62}
          - {name: C60_W24_R55, conditional: true, hard: 6.0, win: 24, ratio: 0.55}
          - {name: C60_W24_R62, conditional: true, hard: 6.0, win: 24, ratio: 0.62}
          - {name: C60_W24_R68, conditional: true, hard: 6.0, win: 24, ratio: 0.68}
          - {name: C65_W24_R62, conditional: true, hard: 6.5, win: 24, ratio: 0.62}
          - {name: C70_W24_R62, conditional: true, hard: 7.0, win: 24, ratio: 0.62}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nautilus_trader==1.230.0' numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run case
        shell: bash
        run: |
          COND=""
          if [ "${{ matrix.conditional }}" = "true" ]; then COND="--conditional-stop"; fi
          python research/tickscalper_conditional_stop.py --catalog "$RAW_CATALOG" --experiment-id "${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 9 --emergency-distance 4.5 --emergency-cooldown 50 $COND --stop-gate-distance 4.5 --hard-stop-distance ${{ matrix.hard }} --stop-vel-window ${{ matrix.win }} --stop-adverse-ratio ${{ matrix.ratio }} --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode none --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
