name: G75 Negative Memory v5.3b Online Audit Fast

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/g75-negative-memory-v5-3b-online-audit-fast.yml'
      - 'research/g75_negative_memory_v5_3_online_audit.py'
      - 'research/g75_negative_memory_v5_2_hydra66.py'
      - 'research/build_raw_bidask_catalog_duka.py'
      - 'research/raw_bidask_catalog_guard.py'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask_xau_60d_hydra66
  RAW_START: '2026-06-27'
  RAW_DAYS: '60'
  RAW_WORKERS: '24'
  RAW_CACHE_KEY: raw-bidask-duka-xauusd-2026-06-27-60d-hydra66-v2
  EXPERIMENT_ID: g75-negative-memory-v5-3b-${{ github.run_id }}

jobs:
  raw-factory:
    name: XAUUSD 60d Raw Factory
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Nautilus dependencies
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas
      - name: Restore immutable XAUUSD 60d cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Build XAUUSD-only 60d Raw BidAsk catalog once
        if: steps.raw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python research/build_raw_bidask_catalog_duka.py \
            --start "$RAW_START" \
            --days "$RAW_DAYS" \
            --catalog "$RAW_CATALOG" \
            --workers "$RAW_WORKERS" \
            --symbols XAUUSD
      - name: Guard XAUUSD Raw BidAsk catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Save immutable XAUUSD 60d cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}

  online-audit:
    name: online-audit (${{ matrix.gate }})
    needs: raw-factory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gate: [C1, C2, C3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy scikit-learn
      - name: Restore shared XAUUSD 60d Raw catalog
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard Raw BidAsk catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run true online Hydra66 audit
        run: |
          python research/g75_negative_memory_v5_3_online_audit.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID/${{ matrix.gate }}" \
            --gate "${{ matrix.gate }}" \
            --raw-bidask-only
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g75-v5-3b-${{ matrix.gate }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/${{ matrix.gate }}/
          if-no-files-found: warn
          retention-days: 90
