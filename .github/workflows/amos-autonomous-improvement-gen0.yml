name: AMOS Autonomous Improvement Loop Gen0 RawTick

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amos-autonomous-improvement-gen0.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2

jobs:
  raw-generation-0:
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5, M15]
        family: [R1, R2, R3, R4]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Nautilus
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - name: Restore canonical Raw BidAsk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard Raw XAUUSD only
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Nautilus Raw Generation 0
        run: |
          EXPERIMENT_ID="amos-auto-gen0-${GITHUB_RUN_ID}"
          PYTHONPATH=research python research/armada_nautilus_raw_cell_compat.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --tf "${{ matrix.tf }}" \
            --family "${{ matrix.family }}" \
            --raw-bidask-only
      - name: Hard evidence gate
        run: |
          P="results/armada-nautilus/amos-auto-gen0-${GITHUB_RUN_ID}/cells/${{ matrix.tf }}_${{ matrix.family }}.json"
          python - "$P" <<'PY'
          import json,sys
          p=sys.argv[1]; k=json.load(open(p))
          assert k["ohlc_resample_used"] is False
          assert k["raw_ticks"] > 0
          assert k["native_fill_gate_pass"] is True
          assert k["verification_level"].startswith("NAUTILUS_BT_RAW_BIDASK")
          print("REALITY_GATE_PASS", k["tf"], k["family"], "N",k["N"],"PF",k["PF"],"DD",k["max_DD_pct"],"EV",k["expectancy"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amos-auto-gen0-${{ matrix.tf }}-${{ matrix.family }}-${{ github.run_id }}
          path: results/armada-nautilus/amos-auto-gen0-${{ github.run_id }}/cells/${{ matrix.tf }}_${{ matrix.family }}.json
          if-no-files-found: error
          retention-days: 90
