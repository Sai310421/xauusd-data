name: AMOS Video Parity CISD Nautilus Raw v1.5
on:
  workflow_dispatch:
  push:
    branches: [feat/amos-checklist-parity-v1-2]
    paths:
      - 'research/amos_video_parity_cisd_v1_5/video_cisd_nautilus_raw.py'
      - '.github/workflows/amos-video-parity-cisd-nautilus-raw-v1-5.yml'
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  CATALOG: catalog/elliott_duka_xau_90d
  CACHE_KEY: elliott-duka-xau-20260225-91d-v2
jobs:
  raw:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CATALOG }}
          key: ${{ env.CACHE_KEY }}
      - if: steps.raw-cache.outputs.cache-hit != 'true'
        run: python research/build_raw_bidask_catalog_duka.py --start 2026-02-25 --days 91 --catalog "${CATALOG}" --workers 12 --symbols XAUUSD --fresh
      - if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CATALOG }}
          key: ${{ env.CACHE_KEY }}
      - run: python research/amos_video_parity_cisd_v1_5/video_cisd_nautilus_raw.py --catalog "${CATALOG}" --out results/amos-video-parity-cisd-raw-v1-5
      - run: cat results/amos-video-parity-cisd-raw-v1-5/summary.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-video-parity-cisd-nautilus-raw-v1-5
          path: results/amos-video-parity-cisd-raw-v1-5/
