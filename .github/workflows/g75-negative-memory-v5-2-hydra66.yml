name: G75 Negative Memory v5.2 Hydra66 Raw BidAsk

on:
  push:
    paths:
      - 'research/g75_negative_memory_v5_2_hydra66.py'
      - '.github/workflows/g75-negative-memory-v5-2-hydra66.yml'
  workflow_dispatch:

jobs:
  hydra66:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gate: [C1, C2, C3]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: g75-negative-memory-v5-2-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy scikit-learn
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Guard Raw BidAsk catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run Hydra66 v5.2 walk-forward
        run: python research/g75_negative_memory_v5_2_hydra66.py --catalog "$RAW_CATALOG" --experiment-id "$EXPERIMENT_ID/${{ matrix.gate }}" --gate "${{ matrix.gate }}" --raw-bidask-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g75-v5-2-${{ matrix.gate }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/${{ matrix.gate }}/
          retention-days: 90
