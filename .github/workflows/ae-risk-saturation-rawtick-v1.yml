name: AE Risk Saturation Raw BidAsk v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/ae_risk_saturation_rawtick_v1.py'
      - '.github/workflows/ae-risk-saturation-rawtick-v1.yml'

permissions:
  contents: read

concurrency:
  group: ae-risk-saturation-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: ae-risk-saturation-v1-${{ github.run_id }}

jobs:
  bt-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dd_limit: [2.0, 3.0, 4.5]
        saturation: [0.50, 0.80, 0.95]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Nautilus runtime
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy

      - name: Restore canonical Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Guard Raw BidAsk only
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD

      - name: Run Risk Saturation cell
        run: >-
          python research/ae_risk_saturation_rawtick_v1.py
          --catalog "$RAW_CATALOG"
          --experiment-id "$EXPERIMENT_ID"
          --gate G1
          --dd-limit "${{ matrix.dd_limit }}"
          --saturation "${{ matrix.saturation }}"
          --raw-bidask-only

      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-risk-saturation-DD${{ matrix.dd_limit }}-S${{ matrix.saturation }}-${{ github.run_id }}
          path: results/ae-risk-saturation/${{ env.EXPERIMENT_ID }}/cells/
          if-no-files-found: warn
          retention-days: 90
