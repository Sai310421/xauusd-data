name: AMOS Checklist Sequence v1.3

on:
  push:
    branches:
      - feat/amos-checklist-parity-v1-2
    paths:
      - 'research/amos_checklist_sequence_v1_3/**'
      - '.github/workflows/amos-checklist-sequence-v1-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sequence-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run ordered MSS EQ Rebalance state machine grid
        run: |
          python research/amos_checklist_sequence_v1_3/sequence_bt.py \
            --data csv/XAUUSD/XAUUSD_M1_2026Q1Q2.csv \
            --out results/amos-checklist-sequence-v1-3
      - uses: actions/upload-artifact@v4
        with:
          name: amos-checklist-sequence-v1-3
          path: results/amos-checklist-sequence-v1-3/
          retention-days: 90
