name: AE Original vs Mirror Raw BidAsk

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ae-original-vs-mirror-raw.yml'
      - 'research/ae_original_mirror_patch.py'

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  ORIGINAL_BASE_SHA: '069bb651bb8c3e7fb93f882d0247bc93eaaebd9e'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5, M15]
        direction: [ORIGINAL, MIRROR]
        mode: [A, B, AB]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Raw gate
        run: |
          test -d "$RAW_CATALOG"
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Restore exact original strategy source
        run: |
          git show "${ORIGINAL_BASE_SHA}:research/ae_highn_2edge_math_raw6x3_bt.py" > research/ae_original_mirror_runner.py
      - name: Apply execution compatibility and optional mirror only
        run: python research/ae_original_mirror_patch.py
      - name: Run exact original or mirror
        env:
          ORIGINAL_DIRECTION: ${{ matrix.direction }}
          TF: ${{ matrix.tf }}
          MODE: ${{ matrix.mode }}
          EXP: ae-original-mirror-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.direction }}-${{ matrix.mode }}
        run: |
          python research/ae_original_mirror_runner.py \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD \
            --timeframes "$TF" \
            --mode "$MODE" \
            --experiment-id "$EXP" \
            --raw-bidask-only
      - uses: actions/upload-artifact@v4
        with:
          name: ae-original-mirror-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.direction }}-${{ matrix.mode }}
          path: results/ae-bt/ae-original-mirror-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.direction }}-${{ matrix.mode }}/
          retention-days: 90
