name: Adaptive v2.1 Nautilus Raw Tick BT

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/adaptive_v21_nautilus_bt.py'
      - '.github/workflows/adaptive-v21-nautilus-rawtick-bt.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  rawtick-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'nautilus_trader==1.230.0' requests

      - name: Download and decode genuine Dukascopy XAUUSD ticks
        run: |
          python - <<'PY'
          import datetime as dt, json, lzma, struct, time
          from pathlib import Path
          import requests

          # Dukascopy hourly tick record: ms, ask, bid, askVol, bidVol (20 bytes, big endian).
          REC=struct.Struct('>IIIff')
          SCALE=1000.0  # XAUUSD Dukascopy convention
          HOST='https://datafeed.dukascopy.com/datafeed'
          out=Path('data/xauusd_quotes.jsonl'); out.parent.mkdir(parents=True,exist_ok=True)
          # Fast first-pass sample: five recent complete trading days. No OHLC/candles/resampling.
          days=[dt.date(2026,8,24),dt.date(2026,8,25),dt.date(2026,8,26),dt.date(2026,8,27),dt.date(2026,8,28)]
          rows=[]; ok_hours=0; bad=0
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          for day in days:
            for hour in range(24):
              url=f'{HOST}/XAUUSD/{day.year}/{day.month-1:02d}/{day.day:02d}/{hour:02d}h_ticks.bi5'
              try:
                r=s.get(url,timeout=20)
                if r.status_code!=200 or len(r.content)<20:
                  continue
                try: blob=lzma.decompress(r.content)
                except Exception:
                  bad+=1; continue
                base=dt.datetime(day.year,day.month,day.day,hour,tzinfo=dt.timezone.utc)
                local=[]
                for i in range(0,len(blob)-REC.size+1,REC.size):
                  ms,ask_raw,bid_raw,ask_vol,bid_vol=REC.unpack_from(blob,i)
                  ask=ask_raw/SCALE; bid=bid_raw/SCALE
                  if ms>=3600000 or bid<=0 or ask<bid: continue
                  ts=base+dt.timedelta(milliseconds=int(ms))
                  local.append({'ts':ts.isoformat().replace('+00:00','Z'),'bid':bid,'ask':ask,'bid_size':float(bid_vol),'ask_size':float(ask_vol)})
                if local:
                  rows.extend(local); ok_hours+=1
              except Exception:
                bad+=1
              time.sleep(0.02)
          rows.sort(key=lambda x:x['ts'])
          # Deduplicate exact quote events only; preserve genuine tick sequence.
          seen=set(); clean=[]
          for z in rows:
            k=(z['ts'],z['bid'],z['ask'],z['bid_size'],z['ask_size'])
            if k in seen: continue
            seen.add(k); clean.append(z)
          with out.open('w',encoding='utf-8') as f:
            for z in clean: f.write(json.dumps(z,separators=(',',':'))+'\n')
          print('RAW_TICK_HOURS',ok_hours,'RAW_TICK_ROWS',len(clean),'DECODE_ERRORS',bad)
          if len(clean)<10000: raise SystemExit('INSUFFICIENT_GENUINE_RAW_TICKS')
          PY

      - name: Run v2.1 raw Bid Ask BT
        env:
          RESULT_DIR: results/adaptive-v21
        run: python research/adaptive_v21_nautilus_bt.py

      - name: Print KPI
        if: always()
        run: |
          echo '=== KPI ==='
          cat results/adaptive-v21/summary.json 2>/dev/null || true
          find results/adaptive-v21 -maxdepth 1 -type f -print || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-v21-nautilus-rawtick
          path: results/adaptive-v21/
          if-no-files-found: warn
          retention-days: 90
