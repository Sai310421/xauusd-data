name: AE Harmonic Sequence v1 Raw BidAsk

on:
  push:
    branches: [ae-harmonic-sequence-v1]
    paths:
      - 'research/ae_harmonic_sequence_patch.py'
      - 'research/ae_harmonic_sequence_hotfix.py'
      - '.github/workflows/ae-harmonic-sequence-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5, M15]
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      ORIGINAL_BASE_SHA: 069bb651bb8c3e7fb93f882d0247bc93eaaebd9e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Raw gate
        run: |
          test -d "$RAW_CATALOG"
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Restore exact original strategy source
        run: git show "${ORIGINAL_BASE_SHA}:research/ae_highn_2edge_math_raw6x3_bt.py" > research/ae_harmonic_sequence_runner.py
      - name: Apply ordered harmonic sequence patch
        run: python research/ae_harmonic_sequence_patch.py
      - name: Restore controller initialization
        run: python research/ae_harmonic_sequence_hotfix.py
      - name: Run B sequence validation
        env:
          TF: ${{ matrix.tf }}
          EXP: ae-harmonic-sequence-${{ github.run_id }}-${{ matrix.tf }}
        run: |
          python research/ae_harmonic_sequence_runner.py \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD \
            --timeframes "$TF" \
            --mode B \
            --experiment-id "$EXP" \
            --raw-bidask-only
      - uses: actions/upload-artifact@v4
        with:
          name: ae-harmonic-sequence-${{ github.run_id }}-${{ matrix.tf }}
          path: results/ae-bt/ae-harmonic-sequence-${{ github.run_id }}-${{ matrix.tf }}/
          retention-days: 90
