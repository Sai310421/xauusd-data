name: AE ML66 Singleton Potential v1
on:
  push:
    branches: ["amos/universal-ea-potential-maximizer-v1"]
    paths:
      - "scripts/ae_a17_ml66_singletons_v1.py"
      - ".github/workflows/ae-ml66-singleton-potential-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  singleton:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amos/universal-ea-potential-maximizer-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pandas lightgbm scikit-learn joblib
      - name: Run singleton potential screen
        run: python scripts/ae_a17_ml66_singletons_v1.py
      - name: Show report
        run: cat bt_results/ae_a17_ml66_singletons_v1/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ae-ml66-singleton-potential-v1
          path: bt_results/ae_a17_ml66_singletons_v1/
          retention-days: 30
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bt_results/ae_a17_ml66_singletons_v1/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Add ML66 singleton potential report"
            git push
          fi
