name: GoldeBrave Layer Matrix Raw
on:
  push:
    paths:
      - 'research/goldebrave_layer_matrix_raw.py'
      - '.github/workflows/goldebrave-layer-matrix-raw.yml'
  workflow_dispatch:
jobs:
  bt:
    strategy:
      fail-fast: false
      matrix:
        mode: [c, ac, ab5c, ab15c, ab5b15c]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: gb-layer-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run layer mode
        run: python research/goldebrave_layer_matrix_raw.py --catalog "$RAW_CATALOG" --mode "${{ matrix.mode }}" --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: gb-layer-${{ github.run_id }}-${{ matrix.mode }}
          path: results/goldebrave-layer-matrix/${{ env.EXPERIMENT_ID }}/${{ matrix.mode }}.json
          retention-days: 90
