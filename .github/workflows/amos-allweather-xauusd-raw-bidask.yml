name: AMOS AllWeather XAUUSD Raw BidAsk BT

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Unique experiment id'
        required: true
        default: 'amos-allweather-manual'
  push:
    paths:
      - 'research/amos_allweather_raw_bidask_bt.py'
      - 'research/amos_allweather_raw_bidask_bt_compat.py'
      - 'research/amos_allweather_l1_runner.py'
      - 'research/amos_allweather_merge_tf_results.py'
      - '.github/workflows/amos-allweather-xauusd-raw-bidask.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment_id || format('amos-allweather-{0}', github.run_id) }}

jobs:
  allweather-xauusd:
    name: allweather-xauusd-${{ matrix.tf }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        tf: [M1, M5, M15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          TF_EXPERIMENT_ID="${EXPERIMENT_ID}-${{ matrix.tf }}"
          mkdir -p "results/ae-bt/$TF_EXPERIMENT_ID/preflight"
          printf '%s\n' \
            "run_id=${GITHUB_RUN_ID}" \
            "git_sha=${GITHUB_SHA}" \
            "experiment_id=${TF_EXPERIMENT_ID}" \
            "timeframe=${{ matrix.tf }}" \
            "raw_cache_key=${RAW_CACHE_KEY}" \
            > "results/ae-bt/$TF_EXPERIMENT_ID/preflight/github_run.txt"
          sha256sum \
            research/amos_allweather_raw_bidask_bt.py \
            research/amos_allweather_raw_bidask_bt_compat.py \
            research/amos_allweather_l1_runner.py \
            research/amos_allweather_merge_tf_results.py \
            > "results/ae-bt/$TF_EXPERIMENT_ID/preflight/strategy_sha256.txt"
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
      - name: Restore shared immutable Raw BidAsk catalog cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Raw Catalog Gate
        shell: bash
        run: |
          set -euo pipefail
          TF_EXPERIMENT_ID="${EXPERIMENT_ID}-${{ matrix.tf }}"
          if [ "${{ steps.raw-cache.outputs.cache-hit }}" != 'true' ]; then
            echo 'RAW_FACTORY_CACHE_MISS: run Raw BidAsk Catalog Factory first'
            exit 22
          fi
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
          cp "$RAW_CATALOG/catalog_manifest.json" "results/ae-bt/$TF_EXPERIMENT_ID/preflight/catalog_manifest.json"
          find "$RAW_CATALOG" -type f -printf '%P %s bytes\n' | sort > "results/ae-bt/$TF_EXPERIMENT_ID/preflight/catalog_inventory.txt"
      - name: Run AMOS AllWeather XAUUSD ${{ matrix.tf }}
        shell: bash
        run: |
          set -euo pipefail
          TF_EXPERIMENT_ID="${EXPERIMENT_ID}-${{ matrix.tf }}"
          python -m research.amos_allweather_l1_runner \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD \
            --timeframes ${{ matrix.tf }} \
            --experiment-id "$TF_EXPERIMENT_ID" \
            --raw-bidask-only
      - name: Upload timeframe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-allweather-${{ env.EXPERIMENT_ID }}-${{ matrix.tf }}
          path: results/ae-bt/
          if-no-files-found: error
          retention-days: 90

  merge-portfolio:
    name: merge-allweather-portfolio
    needs: allweather-xauusd
    if: always() && needs.allweather-xauusd.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install merge dependencies
        run: python -m pip install numpy pandas
      - name: Download all timeframe artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: amos-allweather-${{ env.EXPERIMENT_ID }}-*
          path: downloaded
          merge-multiple: true
      - name: Merge synchronized realized-close portfolio KPI
        shell: bash
        run: |
          set -euo pipefail
          python research/amos_allweather_merge_tf_results.py \
            --input-root downloaded \
            --output "results/ae-bt/${EXPERIMENT_ID}-PORTFOLIO" \
            --base-experiment-id "$EXPERIMENT_ID"
      - name: Upload combined portfolio evidence
        uses: actions/upload-artifact@v4
        with:
          name: amos-allweather-${{ env.EXPERIMENT_ID }}-PORTFOLIO
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}-PORTFOLIO/
          if-no-files-found: error
          retention-days: 90
