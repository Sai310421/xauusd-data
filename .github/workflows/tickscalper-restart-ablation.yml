name: TickScalper Restart Ablation
on:
  push:
    branches:
      - research/tickscalper-original-lineage-v1
    paths:
      - .github/workflows/tickscalper-restart-ablation.yml
permissions:
  contents: read
env:
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: L9S45_cd0, layers: 9, stop: 4.5, cd: 0, reset: false}
          - {name: L9S45_cd15, layers: 9, stop: 4.5, cd: 15, reset: false}
          - {name: L9S45_cd45, layers: 9, stop: 4.5, cd: 45, reset: false}
          - {name: L9S45_cd120, layers: 9, stop: 4.5, cd: 120, reset: false}
          - {name: L9S45_cd300, layers: 9, stop: 4.5, cd: 300, reset: false}
          - {name: L9S45_reset_cd0, layers: 9, stop: 4.5, cd: 0, reset: true}
          - {name: L9S45_reset_cd45, layers: 9, stop: 4.5, cd: 45, reset: true}
          - {name: L10S30_cd0, layers: 10, stop: 3.0, cd: 0, reset: false}
          - {name: L10S30_cd15, layers: 10, stop: 3.0, cd: 15, reset: false}
          - {name: L10S30_cd45, layers: 10, stop: 3.0, cd: 45, reset: false}
          - {name: L10S30_cd120, layers: 10, stop: 3.0, cd: 120, reset: false}
          - {name: L10S30_cd300, layers: 10, stop: 3.0, cd: 300, reset: false}
          - {name: L10S30_reset_cd0, layers: 10, stop: 3.0, cd: 0, reset: true}
          - {name: L10S30_reset_cd45, layers: 10, stop: 3.0, cd: 45, reset: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nautilus_trader==1.230.0' numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run restart case
        shell: bash
        run: |
          RESET=""
          if [ "${{ matrix.reset }}" = "true" ]; then RESET="--reset-signal-on-emergency"; fi
          python research/tickscalper_restart_ablation.py --catalog "$RAW_CATALOG" --experiment-id "${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers ${{ matrix.layers }} --emergency-distance ${{ matrix.stop }} --emergency-cooldown ${{ matrix.cd }} $RESET --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode none --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
