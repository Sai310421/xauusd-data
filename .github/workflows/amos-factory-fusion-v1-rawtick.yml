name: AMOS Factory Fusion v1 RawTick BT

on:
  push:
    branches:
      - 'bt/amos-factory-fusion-v1'
    paths:
      - 'research/amos_factory_fusion_v1_raw_bt.py'
      - '.github/workflows/amos-factory-fusion-v1-rawtick.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2

jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Nautilus runtime
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy

      - name: Restore canonical 30d Raw BidAsk catalog
        id: cache-raw
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Build 30d XAUUSD Raw BidAsk if cache missing
        if: steps.cache-raw.outputs.cache-hit != 'true'
        run: |
          python research/build_raw_bidask_catalog_duka.py \
            --start 2026-07-27 \
            --days 30 \
            --catalog "$RAW_CATALOG" \
            --workers 24 \
            --symbols XAUUSD \
            --fresh

      - name: Guard Raw BidAsk only
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD

      - name: Run AMOS Factory Fusion v1
        run: |
          EXPERIMENT_ID="amos-factory-fusion-v1-${GITHUB_RUN_ID}"
          python research/amos_factory_fusion_v1_raw_bt.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --raw-bidask-only

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-factory-fusion-v1-${{ github.run_id }}
          path: results/amos_factory_fusion_v1/
          if-no-files-found: warn
          retention-days: 90
