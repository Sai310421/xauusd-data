name: AMOS OneEA Fusion RawTick BT v1
on:
  push:
    paths:
      - 'research/amos_oneea_fusion_rawtick_bt_v1.py'
      - '.github/workflows/amos-oneea-fusion-rawtick-bt-v1.yml'
  workflow_dispatch:
jobs:
  bt:
    runs-on: ubuntu-24.04
    env:
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nautilus_trader==1.230.0'
      - name: Restore Raw BidAsk catalog cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard XAUUSD raw BidAsk
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run OneEA Fusion BT
        run: python research/amos_oneea_fusion_rawtick_bt_v1.py --catalog "$RAW_CATALOG" --out results/amos_oneea_fusion_rawtick_v1/result.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-oneea-fusion-rawtick-v1-${{ github.run_id }}
          path: results/amos_oneea_fusion_rawtick_v1/result.json
          if-no-files-found: error
          retention-days: 90
