name: USDJPY Risk AI Production Collect

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start, e.g. 2026-01-01T00:00:00Z"
        required: true
        type: string
      end:
        description: "UTC end, exclusive, e.g. 2026-01-02T00:00:00Z"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: usdjpy-risk-ai-production-collect
  cancel-in-progress: false

jobs:
  collect:
    # Scheduled runs remain inert until an administrator explicitly enables them.
    if: github.event_name == 'workflow_dispatch' || vars.USDJPY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: usdjpy-risk-ai
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OCI_OBJECT_STORAGE_BUCKET: ${{ secrets.OCI_OBJECT_STORAGE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: usdjpy-risk-ai/requirements.txt
      - name: Validate production secrets
        run: |
          missing=0
          for secret_name in DATABENTO_API_KEY OANDA_API_TOKEN OCI_OBJECT_STORAGE_BUCKET; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing production secret::${secret_name} is required"
              missing=1
            fi
          done
          exit "$missing"
      - run: python -m pip install -r requirements.txt
      - name: Restore immutable market-data state
        run: |
          python -m src.feature_store hydrate --category raw --directory data/raw --allow-empty
          python -m src.feature_store hydrate --category multiasset --directory data/multiasset --allow-empty
      - name: Collect explicit historical range
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m src.collect --mode production --start "${{ inputs.start }}" --end "${{ inputs.end }}" --output data/raw
          python -m src.collect_multiasset --mode production --start "${{ inputs.start }}" --end "${{ inputs.end }}" --output data/multiasset
      - name: Collect latest completed H1 bar window
        if: github.event_name == 'schedule'
        run: |
          end=$(date -u +%Y-%m-%dT%H:00:00Z)
          start=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:00:00Z)
          python -m src.collect --mode production --start "$start" --end "$end" --output data/raw
          python -m src.collect_multiasset --start "$start" --end "$end" --output data/multiasset
      - name: Persist immutable market-data state
        run: |
          python -m src.feature_store publish --category raw --directory data/raw
          python -m src.feature_store publish --category multiasset --directory data/multiasset
