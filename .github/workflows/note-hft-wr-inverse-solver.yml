name: NOTE-HFT WR Inverse Solver
on:
  push:
    paths:
      - 'note_hft/final_bot_v5/inverse_wr_solver.py'
      - '.github/workflows/note-hft-wr-inverse-solver.yml'
  workflow_dispatch:
jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: pip install -q numpy
      - name: Clone downloader
        run: git clone --depth 1 https://github.com/Mind2Money/dukasDataDownloader.git /tmp/duka
      - name: Download XAUUSD discovery-validation ticks
        run: |
          python /tmp/duka/dukas_downloader.py --instrument XAUUSD --from 2026-08-10 --to 2026-08-14 --output-dir /tmp/duka_data --download-only --download-workers 8 --retries 6 --retry-sleep 1
      - name: Solve SLOT3 SLOT4 from WR first
        run: |
          mkdir -p out
          python note_hft/final_bot_v5/inverse_wr_solver.py /tmp/duka_data -o out/wr_inverse.json
      - uses: actions/upload-artifact@v4
        with:
          name: NOTE_HFT_WR_INVERSE_SOLVER
          path: out/wr_inverse.json
          retention-days: 90
