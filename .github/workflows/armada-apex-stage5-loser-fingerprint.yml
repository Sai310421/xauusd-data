name: Armada APEX Stage5 Loser Fingerprint

on:
  push:
    branches: [main]
    paths:
      - 'research/armada_apex_stage5_loser_fingerprint.py'
      - '.github/workflows/armada-apex-stage5-loser-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: armada-apex-stage5-${{ github.run_id }}

jobs:
  loser-fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - name: Restore Raw BidAsk catalog cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard Raw XAUUSD catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run loser fingerprint diagnostic
        run: |
          PYTHONPATH=research python research/armada_apex_stage5_loser_fingerprint.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --raw-bidask-only
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armada-apex-stage5-${{ github.run_id }}
          path: results/armada-apex/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
