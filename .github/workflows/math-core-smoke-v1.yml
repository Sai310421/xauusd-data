name: Mathematical Core Smoke v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/math_core/**'
      - 'research/math_core_smoke.py'
      - '.github/workflows/math-core-smoke-v1.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install -q numpy
      - name: Run Mathematical Core smoke
        run: PYTHONPATH=. python research/math_core_smoke.py
