name: TickScalper Sub10s Raw BidAsk Clock Lab
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Dukascopy XAUUSD UTC trading date'
        required: true
        default: '2026-08-27'
  push:
    branches: ['feature/tickscalper-sub10s-clock-lab-v1']
    paths:
      - 'research/dukascopy_xau_quote_tick_gate.py'
      - 'research/tickscalper_sub10s_clock_lab.py'
      - '.github/workflows/tickscalper-sub10s-clock-lab.yml'
permissions:
  contents: read
jobs:
  clock-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate Dukascopy XAUUSD QuoteTicks
        run: python research/dukascopy_xau_quote_tick_gate.py --date "${{ inputs.date || '2026-08-27' }}" --out raw/XAUUSD_ticks.csv
      - name: Run clock ablation
        run: python research/tickscalper_sub10s_clock_lab.py --ticks raw/XAUUSD_ticks.csv
      - name: Preserve provenance
        run: cp raw/XAUUSD_ticks.meta.txt results/tickscalper-sub10s-clock-lab/
      - name: Upload KPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickscalper-sub10s-clock-lab
          path: results/tickscalper-sub10s-clock-lab/
          if-no-files-found: error
          retention-days: 30
