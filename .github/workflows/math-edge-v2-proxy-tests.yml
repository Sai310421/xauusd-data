name: Math EDGE v2 Proxy Tests

on:
  push:
    paths:
      - 'research/ae_multifiltration_eprocess.py'
      - 'research/ae_dr_mpc_recovery.py'
      - 'research/test_math_edge_v2_candidates.py'
      - '.github/workflows/math-edge-v2-proxy-tests.yml'
  pull_request:
    paths:
      - 'research/ae_multifiltration_eprocess.py'
      - 'research/ae_dr_mpc_recovery.py'
      - 'research/test_math_edge_v2_candidates.py'
      - '.github/workflows/math-edge-v2-proxy-tests.yml'
  workflow_dispatch:

jobs:
  proxy-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Math EDGE v2 deterministic tests
        run: python -m pytest -q research/test_math_edge_v2_candidates.py
