name: AMOS BBEMA MTF Trend Raw BidAsk BT

on:
  push:
    branches: [main]
    paths:
      - 'bt_requests/amos_bbema_mtf_trend_90d.request'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  raw-bidask-nautilus-bt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download four 90-day Raw Bid Ask catalog chunks
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Sai310421/xauusd-data
          run-id: 41971304049
          pattern: xauusd-raw-bidask-20260225-90d-*
          path: catalog/download
          merge-multiple: false

      - name: Assemble catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog
          for c in a b c d; do
            src="catalog/download/xauusd-raw-bidask-20260225-90d-$c"
            test -d "$src"
            mv "$src" "catalog/xauusd-90d-$c"
          done
          find catalog -name catalog_manifest.json -print | sort
          test "$(find catalog -name catalog_manifest.json | wc -l)" -eq 4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Nautilus and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nautilus_trader==1.230.0' numpy pandas pyarrow

      - name: Run positive-direction MTF trend-gated Raw Bid Ask backtest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/amos-bbema-mtf/_logs
          python research/amos_bbema_mtf_trend_rawtick_bt_v1.py \
            --catalog catalog/xauusd-90d-a \
            --catalog catalog/xauusd-90d-b \
            --catalog catalog/xauusd-90d-c \
            --catalog catalog/xauusd-90d-d \
            --experiment-id "bbema-mtf-trend-${{ github.run_id }}" 2>&1 | tee results/amos-bbema-mtf/_logs/runner.log

      - name: Upload result and runner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-bbema-mtf-trend-result-${{ github.run_id }}
          path: results/amos-bbema-mtf/
          if-no-files-found: error
          retention-days: 90
