name: GoldeBrave G75 Selective Boost V5 Raw

on:
  push:
    paths:
      - 'research/goldebrave_c_g75_selective_boost_v5_raw.py'
      - '.github/workflows/goldebrave-g75-selective-boost-v5-raw.yml'
  workflow_dispatch:

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: gb-g75-selective-boost-v5-${{ github.run_id }}

jobs:
  bt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        boost: [1.25, 1.5, 1.75]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run V5 selective boost matrix
        run: |
          python research/goldebrave_c_g75_selective_boost_v5_raw.py \
            --catalog "$RAW_CATALOG" \
            --boost-mult "${{ matrix.boost }}" \
            --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: gb-g75-selective-v5-${{ github.run_id }}-b${{ matrix.boost }}
          path: results/goldebrave-g75-selective-boost-v5/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
