name: TEST-BOT Native Bridge 21D

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/testbot_native_bridge_21d.py'
      - '.github/workflows/testbot-native-bridge-21d.yml'

permissions:
  contents: write

jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python research/testbot_native_bridge_21d.py --start 2026-07-27 --days 21
      - name: Persist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/testbot_native_bridge_21d
          git diff --cached --quiet || git commit -m 'bt: persist TEST-BOT native bridge 21d'
          git status --porcelain
          git push
