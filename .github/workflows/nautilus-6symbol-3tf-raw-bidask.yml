name: Nautilus 6Symbol x 3TF Raw BidAsk BT

on:
  workflow_run:
    workflows: ['Raw BidAsk Catalog Factory']
    types: [completed]
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Unique experiment id'
        required: true
        default: 'raw6x3-manual'
      runner:
        description: 'Strategy runner module'
        required: true
        default: 'research.minimumspike_raw6x3_bt'
      top_k:
        description: 'Number of symbol/TF cells selected for downstream validation'
        required: true
        default: '6'
  push:
    paths:
      - 'research/minimumspike_raw6x3_bt.py'
      - 'research/select_top_cells.py'
      - '.github/workflows/nautilus-6symbol-3tf-raw-bidask.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-07-27'
  RAW_DAYS: '30'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment_id || format('raw6x3-{0}', github.run_id) }}
  RUNNER_MODULE: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'research.minimumspike_raw6x3_bt' }}
  TOP_K: ${{ github.event_name == 'workflow_dispatch' && inputs.top_k || '6' }}

jobs:
  raw-6x3-bt:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare immutable evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "results/ae-bt/$EXPERIMENT_ID/preflight"
          printf '%s\n' \
            "run_id=${GITHUB_RUN_ID}" \
            "git_sha=${GITHUB_SHA}" \
            "source_sha=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" \
            "experiment_id=${EXPERIMENT_ID}" \
            "raw_cache_key=${RAW_CACHE_KEY}" > "results/ae-bt/$EXPERIMENT_ID/preflight/github_run.txt"
          sha256sum research/minimumspike_raw6x3_bt.py research/select_top_cells.py > "results/ae-bt/$EXPERIMENT_ID/preflight/strategy_and_selector_sha256.txt"

      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
          python - <<'PY'
          import nautilus_trader
          print('nautilus_trader', nautilus_trader.__version__)
          PY

      - name: Restore shared immutable Raw BidAsk catalog cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Require factory-produced Raw BidAsk catalog
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.raw-cache.outputs.cache-hit }}" != 'true' ]; then
            echo 'RAW_FACTORY_CACHE_MISS: run Raw BidAsk Catalog Factory first'
            exit 22
          fi
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
          cp "$RAW_CATALOG/catalog_manifest.json" "results/ae-bt/$EXPERIMENT_ID/preflight/catalog_manifest.json"
          find "$RAW_CATALOG" -type f -printf '%P %s bytes\n' | sort > "results/ae-bt/$EXPERIMENT_ID/preflight/catalog_inventory.txt"

      - name: Run 6 symbols x 3 TF screening with Nautilus BacktestEngine
        shell: bash
        run: |
          set -euo pipefail
          python -m "$RUNNER_MODULE" \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF \
            --timeframes M1 M5 M15 \
            --experiment-id "$EXPERIMENT_ID" \
            --raw-bidask-only

      - name: Rank 18 cells and select downstream candidates
        shell: bash
        run: |
          set -euo pipefail
          python research/select_top_cells.py \
            --summary "results/ae-bt/$EXPERIMENT_ID/summary.json" \
            --out "results/ae-bt/$EXPERIMENT_ID/selected_cells.json" \
            --top-k "$TOP_K" \
            --min-n 10 \
            --min-pf 1.0 \
            --max-dd 20 \
            --max-per-symbol 2
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('results/ae-bt') / os.environ['EXPERIMENT_ID']
          x = json.loads((root / 'selected_cells.json').read_text())
          cells = x.get('selected_cells', [])
          if not cells:
              raise SystemExit('CELL_SELECTION_FAIL_CLOSED: no eligible cells')
          (root / 'selected_cells.txt').write_text('\n'.join(cells) + '\n')
          print('SELECTED_CELLS=' + ','.join(cells))
          PY

      - name: Upload immutable BT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-raw6x3-${{ env.EXPERIMENT_ID }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
