name: ARCANA x GORIRIN Fusion Raw BidAsk BT

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Unique experiment id'
        required: true
        default: 'arcana-goririn-fusion-manual'
      raw_start:
        description: 'Raw catalog start YYYY-MM-DD'
        required: true
        default: '2026-07-27'
      raw_days:
        description: 'Raw days'
        required: true
        default: '30'
      symbols:
        description: 'Space separated symbols; Fusion currently uses USDJPY'
        required: true
        default: 'USDJPY'
  push:
    paths:
      - 'bt_requests/arcana-goririn-fusion.request'
      - 'research/arcana_goririn_fusion_raw_bt.py'
      - 'research/build_raw_bidask_catalog_duka.py'
      - 'research/raw_bidask_catalog_guard.py'
      - 'research/nautilus_bt_standard_config.json'
      - 'research/aggregate_nautilus_matrix.py'
      - '.github/workflows/arcana-goririn-fusion-raw-bt.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask_usdjpy
  RAW_START: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_start || '2026-07-27' }}
  RAW_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_days || '30' }}
  SYMBOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.symbols || 'USDJPY' }}
  EXPERIMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment_id || 'arcana-goririn-fusion-standard-push' }}
  RAW_CACHE_KEY: raw-bidask-duka-usdjpy-${{ github.event_name == 'workflow_dispatch' && inputs.raw_start || '2026-07-27' }}-${{ github.event_name == 'workflow_dispatch' && inputs.raw_days || '30' }}-v2

jobs:
  prepare-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-nautilus-${{ env.NAUTILUS_VERSION }}

      - name: Install pinned NautilusTrader
        run: |
          python -m pip install -q "nautilus_trader==${NAUTILUS_VERSION}"
          python - <<'PY'
          import nautilus_trader
          print('nautilus_trader', nautilus_trader.__version__)
          PY

      - name: Restore selected-symbol Raw BidAsk catalog cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask_usdjpy
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Build selected-symbol Raw BidAsk catalog only when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RAW_CATALOG/catalog_manifest.json" ]; then
            echo 'CATALOG_CACHE_HIT'
          else
            python research/build_raw_bidask_catalog_duka.py \
              --start "$RAW_START" \
              --days "$RAW_DAYS" \
              --catalog "$RAW_CATALOG" \
              --symbols $SYMBOLS \
              --workers 32
          fi

      - name: Fail-closed Raw BidAsk quality gate
        shell: bash
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols $SYMBOLS

      - name: Save verified Raw BidAsk catalog cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: catalog/raw_bidask_usdjpy
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Upload catalog manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: catalog-manifest-${{ env.EXPERIMENT_ID }}
          path: ${{ env.RAW_CATALOG }}/catalog_manifest.json
          if-no-files-found: error
          retention-days: 90

  strategy-matrix:
    needs: prepare-catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode:
          - PASS_THROUGH
          - FILTER
          - TIMING
          - TIMING_APEX_EXIT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-nautilus-${{ env.NAUTILUS_VERSION }}

      - name: Install pinned NautilusTrader
        run: python -m pip install -q "nautilus_trader==${NAUTILUS_VERSION}"

      - name: Restore verified Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask_usdjpy
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Re-run fail-closed catalog gate in each lane
        shell: bash
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols $SYMBOLS

      - name: Run one Nautilus strategy lane
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          LANE_ID="${EXPERIMENT_ID}-${MODE}"
          python research/arcana_goririn_fusion_raw_bt.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$LANE_ID" \
            --symbol USDJPY \
            --modes "$MODE" \
            --raw-bidask-only

      - name: Upload immutable lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-goririn-${{ env.EXPERIMENT_ID }}-${{ matrix.mode }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}-${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: strategy-matrix
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all strategy lane artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: arcana-goririn-${{ env.EXPERIMENT_ID }}-*
          path: matrix-artifacts
          merge-multiple: false

      - name: Aggregate and rank lane KPIs
        shell: bash
        run: |
          mkdir -p "results/ae-bt/${EXPERIMENT_ID}-AGGREGATE"
          python research/aggregate_nautilus_matrix.py \
            --root matrix-artifacts \
            --out "results/ae-bt/${EXPERIMENT_ID}-AGGREGATE/ranking.json"
          cp research/nautilus_bt_standard_config.json "results/ae-bt/${EXPERIMENT_ID}-AGGREGATE/standard_config.json"

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: arcana-goririn-${{ env.EXPERIMENT_ID }}-AGGREGATE
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}-AGGREGATE/
          if-no-files-found: error
          retention-days: 90
