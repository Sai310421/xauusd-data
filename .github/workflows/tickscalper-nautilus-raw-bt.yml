name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline_core
            rescue_mode: none
            early_layer: 8
            early_fdd: 25
            hedge_frac: 0.00
            hard_fdd: 45
          - name: early_L8_fdd20_h25
            rescue_mode: early_partial
            early_layer: 8
            early_fdd: 20
            hedge_frac: 0.25
            hard_fdd: 45
          - name: early_L8_fdd25_h25
            rescue_mode: early_partial
            early_layer: 8
            early_fdd: 25
            hedge_frac: 0.25
            hard_fdd: 45
          - name: early_L8_fdd25_h40
            rescue_mode: early_partial
            early_layer: 8
            early_fdd: 25
            hedge_frac: 0.40
            hard_fdd: 45
          - name: early_L8_fdd25_h60
            rescue_mode: early_partial
            early_layer: 8
            early_fdd: 25
            hedge_frac: 0.60
            hard_fdd: 45
          - name: early_L9_fdd20_h25
            rescue_mode: early_partial
            early_layer: 9
            early_fdd: 20
            hedge_frac: 0.25
            hard_fdd: 45
          - name: early_L9_fdd25_h40
            rescue_mode: early_partial
            early_layer: 9
            early_fdd: 25
            hedge_frac: 0.40
            hard_fdd: 45
          - name: early_L9_fdd30_h60
            rescue_mode: early_partial
            early_layer: 9
            early_fdd: 30
            hedge_frac: 0.60
            hard_fdd: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: python research/tickscalper_nautilus_raw_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 10 --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode none --rescue-mode ${{ matrix.rescue_mode }} --early-start-layer ${{ matrix.early_layer }} --early-fdd-trigger ${{ matrix.early_fdd }} --early-hedge-fraction ${{ matrix.hedge_frac }} --zr-target-pnl 0 --zr-hard-fdd-pct ${{ matrix.hard_fdd }} --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
