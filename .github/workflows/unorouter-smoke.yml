name: UnoRouter AMOS Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: UnoRouter model ID
        required: false
        default: glm-5.3-flash:free
  push:
    branches: [main]
    paths:
      - 'agents/ahae/integrations/unorouter_client.py'
      - 'agents/ahae/integrations/unorouter_routes.json'
      - '.github/workflows/unorouter-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
      UNOROUTER_BASE_URL: https://api.unorouter.com/v1
      UNOROUTER_SMOKE_MODEL: ${{ inputs.model || '' }}
      UNOROUTER_TIMEOUT_SECONDS: '45'
      UNOROUTER_RETRIES: '1'
      UNOROUTER_SMOKE_MODELS: glm-5.3-flash:free,codestral-latest:free,glm-5.3-flash-thinking:free
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate secret
        shell: bash
        run: |
          if [ -z "$UNOROUTER_API_KEY" ]; then
            echo "UNOROUTER_API_KEY GitHub Actions secret is not configured."
            echo "Add it under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: UnoRouter health check with retry/failover
        run: python agents/ahae/integrations/unorouter_client.py
