name: GoldeBrave v4.20 Normal RawTick Main
on:
  push:
    paths:
      - 'research/goldebrave_v420_normal_rawtick_bt.py'
      - '.github/workflows/goldebrave-adaptive-rawtick-ab-main.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  NAUTILUS_VERSION: '1.230.0'
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - name: Restore Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Ensure Raw BidAsk catalog
        run: |
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Run normal BT
        run: |
          OUT="results/goldebrave-normal/${{ github.run_id }}"
          python research/goldebrave_v420_normal_rawtick_bt.py --catalog "$RAW_CATALOG" --out "$OUT"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldebrave-normal-${{ github.run_id }}
          path: results/goldebrave-normal/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
