name: HFT Boost BOT Tournament v2 Shared

on:
  push:
    branches: ['hft-boost-raw-bt-v04']
    paths:
      - '.github/workflows/hft-boost-bot-tournament-v2-shared.yml'
      - 'research/hft_boost_bot_tournament_v1.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  PROBE_START: '2026-07-27'
  PROBE_DAYS: '2'
  SHARED_CATALOG: catalog/bot_tournament_shared

jobs:
  build-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - name: Build single shared XAU Raw BidAsk v3
        run: |
          set -euo pipefail
          rm -rf "$SHARED_CATALOG"
          python -m research.build_raw_bidask_catalog_duka_v3 --start "$PROBE_START" --days "$PROBE_DAYS" --catalog "$SHARED_CATALOG" --workers 24 --symbols XAUUSD --fresh
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['SHARED_CATALOG'])
          m=json.loads((p/'catalog_manifest.json').read_text())
          st=m.get('stats',{}).get('XAUUSD',{})
          if int(st.get('written_days',0)) < int(os.environ['PROBE_DAYS']):
              raise SystemExit(f"INCOMPLETE_SHARED_CATALOG written_days={st.get('written_days')} expected={os.environ['PROBE_DAYS']}")
          if int(st.get('ticks',0)) <= 0:
              raise SystemExit('NO_SHARED_TICKS')
          print('SHARED_CATALOG_TICKS',st.get('ticks'))
          print('SHARED_CATALOG_SHA',m.get('catalog_sha256'))
          PY
      - name: Pack shared catalog
        run: tar -czf shared_catalog.tgz "$SHARED_CATALOG"
      - uses: actions/upload-artifact@v4
        with:
          name: bot-tournament-shared-catalog-${{ github.run_id }}
          path: shared_catalog.tgz
          retention-days: 7

  tournament:
    needs: build-catalog
    strategy:
      fail-fast: false
      matrix:
        bot: [gold, roy, testbot, midas]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BOT: ${{ matrix.bot }}
      EXPERIMENT_ID: bot-tournament-v2-${{ matrix.bot }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/download-artifact@v4
        with:
          name: bot-tournament-shared-catalog-${{ github.run_id }}
      - name: Restore shared catalog
        run: tar -xzf shared_catalog.tgz
      - name: Run source-faithful BOT on identical Raw QuoteTicks
        run: |
          set -euo pipefail
          python -m research.hft_boost_bot_tournament_v1 --catalog "$SHARED_CATALOG" --experiment-id "$EXPERIMENT_ID" --bot "$BOT" --raw-bidask-only --initial 1000 --trade-size 1
      - name: Capture evidence
        if: always()
        run: |
          OUT="results/ae-bt/$EXPERIMENT_ID"
          mkdir -p "$OUT/preflight"
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "git_sha=$GITHUB_SHA" "bot=$BOT" "nautilus=$NAUTILUS_VERSION" "shared_catalog=true" > "$OUT/preflight/github_run.txt"
          cp "$SHARED_CATALOG/catalog_manifest.json" "$OUT/preflight/catalog_manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-tournament-v2-${{ matrix.bot }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 30
