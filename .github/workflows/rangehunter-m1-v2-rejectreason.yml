name: RangeHunter M1 V2 Reject Reason
on:
  push:
    paths:
      - 'research/rangehunter_m1_v2_rejectreason.py'
      - '.github/workflows/rangehunter-m1-v2-rejectreason.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-07-27'
  RAW_DAYS: '30'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: rangehunter-m1-v2-reject-${{ github.run_id }}
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - run: |
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
      - run: python -m research.rangehunter_m1_v2_rejectreason --catalog "$RAW_CATALOG" --experiment-id "$EXPERIMENT_ID"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rangehunter-m1-v2-reject-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
