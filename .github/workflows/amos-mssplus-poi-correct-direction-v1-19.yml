name: AMOS MSSPlus POI Correct Direction v1.19
on:
  workflow_dispatch:
  push:
    branches: [feat/amos-checklist-parity-v1-2]
    paths: ['research/amos_mssplus_poi_correct_direction_v1_19.py','.github/workflows/amos-mssplus-poi-correct-direction-v1-19.yml']
permissions: {contents: read}
env: {NAUTILUS_VERSION: '1.230.0', RAW_CATALOG: 'catalog/raw_bidask', RAW_CACHE_KEY: 'raw-bidask-duka-6sym-2026-07-27-30d-v2'}
jobs:
  corrected:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {tf: [1, 15]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - uses: actions/cache/restore@v4
        with: {path: 'catalog/raw_bidask', key: '${{ env.RAW_CACHE_KEY }}', fail-on-cache-miss: true}
      - run: python research/amos_mssplus_poi_correct_direction_v1_19.py --catalog "$RAW_CATALOG" --tf ${{ matrix.tf }} --out results/amos-mssplus-poi-correct-direction-v1-19/M${{ matrix.tf }}
      - run: cat results/amos-mssplus-poi-correct-direction-v1-19/M${{ matrix.tf }}/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'amos-mssplus-poi-correct-direction-v1-19-M${{ matrix.tf }}', path: 'results/amos-mssplus-poi-correct-direction-v1-19/M${{ matrix.tf }}/'}
