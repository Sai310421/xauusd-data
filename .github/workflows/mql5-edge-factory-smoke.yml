name: MQL5 EDGE Factory Smoke

on:
  pull_request:
    paths:
      - 'research/mql5_edge_factory/**'
      - '.github/workflows/mql5-edge-factory-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q research/mql5_edge_factory
      - name: Unit smoke
        run: python -m pytest -q research/mql5_edge_factory
