name: AMOS Complete External Raw Tick Catalog

on:
  push:
    paths:
      - 'research/import_external_xauusd_raw_parquet_to_nautilus.py'
      - '.github/workflows/amos-complete-external-rawtick-catalog.yml'
      - 'bt_requests/amos_complete_external_rawtick.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amos-complete-external-rawtick-v1
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'
  INPUT_DIR: external_raw/xauusd
  CATALOG: catalog/amos_complete_external_raw
  START: '2026-02-25T00:00:00Z'
  END: '2026-05-26T23:59:59.999Z'
  CACHE_KEY: amos-complete-external-xauusd-20260225-20260526-v1
  EVIDENCE: results/amos-complete-external-raw/${{ github.run_id }}

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas pyarrow

      - name: Restore Nautilus catalog cache
        id: catalog-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CATALOG }}
          key: ${{ env.CACHE_KEY }}

      - name: Download upstream XAUUSD raw BidAsk parquet
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${INPUT_DIR}"
          base='https://raw.githubusercontent.com/simom1/XAUUSD-history/main/2026'
          for f in             xauusd_2026_02.parquet             xauusd_2026_03_early.parquet             xauusd_2026_03_mid.parquet             xauusd_2026_03_late.parquet             xauusd_2026_04.parquet             xauusd_2026_05.parquet
          do
            curl -fL --retry 5 --retry-delay 3 "${base}/${f}" -o "${INPUT_DIR}/${f}"
          done
          ls -lh "${INPUT_DIR}"

      - name: Build Nautilus QuoteTick catalog
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          python research/import_external_xauusd_raw_parquet_to_nautilus.py             --input-dir "${INPUT_DIR}"             --catalog "${CATALOG}"             --start "${START}"             --end "${END}"             --manifest "${EVIDENCE}/catalog_manifest.json"

      - name: Validate cached or newly built catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from nautilus_trader.persistence.catalog import ParquetDataCatalog
          cat = ParquetDataCatalog(os.environ['CATALOG'])
          inst = next((x for x in cat.instruments() if x.id.symbol.value == 'XAUUSD'), None)
          assert inst is not None, 'XAUUSD instrument missing'
          ticks = cat.query_quote_ticks(identifiers=[inst.id.value])
          assert len(ticks) > 0, 'no quote ticks'
          out = {
              'status':'PASS',
              'instrument':inst.id.value,
              'ticks':len(ticks),
              'first_ts_ns':int(ticks[0].ts_event),
              'last_ts_ns':int(ticks[-1].ts_event),
              'ohlc_resample_used':False,
              'execution_data':'QuoteTick Bid/Ask',
          }
          Path(os.environ['EVIDENCE']).mkdir(parents=True, exist_ok=True)
          Path(os.environ['EVIDENCE'],'catalog_validation.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY
          find "${CATALOG}" -type f -printf '%P %s bytes\n' | sort > "${EVIDENCE}/catalog_inventory.txt"
          du -sh "${CATALOG}" > "${EVIDENCE}/catalog_size.txt"

      - name: Save Nautilus catalog cache
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CATALOG }}
          key: ${{ env.CACHE_KEY }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-complete-external-raw-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
