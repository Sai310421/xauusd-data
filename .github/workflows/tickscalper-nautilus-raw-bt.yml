          - name: refine_c30_l25_m05
            cap: 30
            lam: 2.5
            start_layer: 8
            min_scale: 0.5
          - name: refine_c30_l3_m045
            cap: 30
            lam: 3
            start_layer: 8
            min_scale: 0.45
          - name: refine_c30_l3_m05
            cap: 30
            lam: 3
            start_layer: 8
            min_scale: 0.5
          - name: refine_c30_l35_m045
            cap: 30
            lam: 3.5
            start_layer: 8
