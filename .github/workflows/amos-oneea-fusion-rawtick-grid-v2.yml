name: AMOS OneEA Fusion RawTick Grid v2
on:
  push:
    paths:
      - 'research/amos_oneea_fusion_rawtick_grid_v2.py'
      - '.github/workflows/amos-oneea-fusion-rawtick-grid-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bt:
    runs-on: ubuntu-24.04
    env:
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install 'nautilus_trader==1.230.0'
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: python research/amos_oneea_fusion_rawtick_grid_v2.py --catalog "$RAW_CATALOG" --out results/amos_oneea_fusion_rawtick_grid_v2/result.json
      - name: Persist canonical result
        run: |
          mkdir -p bt_results/amos_oneea_fusion_rawtick_grid_v2
          cp results/amos_oneea_fusion_rawtick_grid_v2/result.json bt_results/amos_oneea_fusion_rawtick_grid_v2/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bt_results/amos_oneea_fusion_rawtick_grid_v2/latest.json
          git diff --cached --quiet || git commit -m "BT: AMOS OneEA Fusion RawTick Grid v2 result"
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-oneea-fusion-rawtick-grid-v2-${{ github.run_id }}
          path: results/amos_oneea_fusion_rawtick_grid_v2/result.json
          if-no-files-found: error
          retention-days: 90
