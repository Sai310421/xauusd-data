name: AMOS BigPlayer M1 Exit Geometry Screen v1

on:
  push:
    branches:
      - amos-bigplayer-native-mtf-screen-v1
    paths:
      - '.github/workflows/amos-bigplayer-m1-exit-grid-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run frozen BigPlayer entry formula across fixed exit geometry and cost grid
        shell: bash
        run: |
          set -euo pipefail
          DATA='csv/XAUUSD/XAUUSD_M1_2026Q1Q2.csv'
          for H in 1 3 5 10 15 30; do
            for COST in 0.0 0.1 0.2; do
              TAG=$(printf '%s' "$COST" | tr '.' 'p')
              OUT="results/amos_bigplayer_m1_exit_grid/h${H}/cost_${TAG}"
              python research/bigplayer_2edge_bt.py \
                --data "$DATA" \
                --out "$OUT" \
                --horizon "$H" \
                --initial-balance 1000 \
                --lot 0.01 \
                --contract-size 100 \
                --round-trip-cost-usd "$COST"
            done
          done
      - name: Build experiment manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          data=Path('csv/XAUUSD/XAUUSD_M1_2026Q1Q2.csv')
          root=Path('results/amos_bigplayer_m1_exit_grid')
          payload={
            'experiment_id':'AMOS_BIGPLAYER_M1_EXIT_GRID_V1',
            'git_sha':os.environ.get('GITHUB_SHA'),
            'dataset':str(data),
            'dataset_sha256':hashlib.sha256(data.read_bytes()).hexdigest(),
            'formula_source':'research/bigplayer_2edge_bt.py',
            'formula_blob_sha_frozen':'34fe920ad0b184f3c156814a6b504a35d87a2cc7',
            'horizon_grid_bars':[1,3,5,10,15,30],
            'cost_grid_usd_round_trip':[0.0,0.1,0.2],
            'selection_policy':'discovery only; no promotion from this grid without OOS/WFO and Raw BidAsk WR5',
            'ohlc_resample_used':False,
            'wr5':'INVALID'
          }
          (root/'experiment_manifest.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY
      - name: Upload screen artifact
        uses: actions/upload-artifact@v4
        with:
          name: amos-bigplayer-m1-exit-grid-v1
          path: results/amos_bigplayer_m1_exit_grid/
          if-no-files-found: error
          retention-days: 90
