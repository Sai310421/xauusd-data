name: AMOS Factory Fusion v1.21 Parity RawTick

on:
  push:
    branches:
      - 'bt/amos-factory-fusion-v1'
    paths:
      - 'research/amos_factory_fusion_v1_1_phase3_source_aligned_raw_bt.py'
      - '.github/workflows/amos-factory-fusion-v1-1-phase3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2

jobs:
  bt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [RECONSTRUCTED_PY, SET_CANDIDATE]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - name: Restore canonical Raw BidAsk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Guard
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run source-aligned A/B
        run: |
          EXPERIMENT_ID="amos-fusion-v121-${{ matrix.mode }}-${GITHUB_RUN_ID}"
          python research/amos_factory_fusion_v1_1_phase3_source_aligned_raw_bt.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --mode "${{ matrix.mode }}" \
            --raw-bidask-only
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-fusion-v110-${{ matrix.mode }}-${{ github.run_id }}
          path: results/amos_factory_fusion_v1_1/
          if-no-files-found: warn
          retention-days: 90
