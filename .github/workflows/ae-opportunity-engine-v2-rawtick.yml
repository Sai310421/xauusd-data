name: AE Opportunity Engine v2 Raw BidAsk
on:
  push:
    paths:
      - 'research/ae_opportunity_engine_v2_rawtick.py'
      - '.github/workflows/ae-opportunity-engine-v2-rawtick.yml'
  workflow_dispatch:
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt-cell:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [ALL, AUCTION]
        n: [25, 100, 250]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Nautilus runtime
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - name: Restore canonical Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Guard Raw BidAsk only
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run Opportunity Engine v2 cell
        run: |
          EXPERIMENT_ID="ae-opportunity-engine-v2-${GITHUB_RUN_ID}"
          python research/ae_opportunity_engine_v2_rawtick.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --mode "${{ matrix.mode }}" \
            --max-entries-per-day "${{ matrix.n }}" \
            --raw-bidask-only
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ae-opportunity-v2-${{ matrix.mode }}-N${{ matrix.n }}-${{ github.run_id }}
          path: results/ae-bt/ae-opportunity-engine-v2-${{ github.run_id }}/cells/${{ matrix.mode }}_N${{ matrix.n }}.json
          retention-days: 90
