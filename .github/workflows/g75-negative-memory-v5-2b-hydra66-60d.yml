name: G75 Negative Memory v5.2b Hydra66 60d Warmup

on:
  push:
    paths:
      - '.github/workflows/g75-negative-memory-v5-2b-hydra66-60d.yml'
      - 'research/g75_negative_memory_v5_2_hydra66.py'
      - 'research/build_raw_bidask_catalog_duka.py'
      - 'research/ensure_raw_bidask_catalog.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask_60d
  RAW_START: '2026-06-27'
  RAW_DAYS: '60'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-06-27-60d-hydra66-v1
  EXPERIMENT_ID: g75-negative-memory-v5-2b-${{ github.run_id }}

jobs:
  hydra66-60d:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        gate: [C1, C2, C3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy scikit-learn
      - name: Restore 60d Raw BidAsk cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Ensure 60d catalog for Hydra66 warmup
        shell: bash
        run: |
          set -euo pipefail
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          echo "RAW_CACHE_HIT=${{ steps.raw-cache.outputs.cache-hit }}"
      - name: Save 60d Raw BidAsk cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Guard Raw BidAsk catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run Hydra66 v5.2b walk-forward
        run: python research/g75_negative_memory_v5_2_hydra66.py --catalog "$RAW_CATALOG" --experiment-id "$EXPERIMENT_ID/${{ matrix.gate }}" --gate "${{ matrix.gate }}" --raw-bidask-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g75-v5-2b-${{ matrix.gate }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/${{ matrix.gate }}/
          if-no-files-found: warn
          retention-days: 90
