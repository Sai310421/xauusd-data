name: AMOS FibCircle MTF Raw BidAsk BT v1

on:
  push:
    branches:
      - amos-fibcircle-mtf-raw-bt-v1
    paths:
      - 'research/amos_fibcircle_mtf_raw_bt.py'
      - '.github/workflows/amos-fibcircle-mtf-raw-bt-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask_xau90
  RAW_START: '2026-05-31'
  RAW_DAYS: '90'
  EXPERIMENT_ID: 'amos-fibcircle-mtf-xau90-v1'
  RAW_CACHE_KEY: raw-bidask-duka-xauusd-2026-05-31-90d-v1

jobs:
  raw-mtf-bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
          python - <<'PY'
          import nautilus_trader
          print('nautilus_trader', nautilus_trader.__version__)
          PY

      - name: Restore XAUUSD 90D raw BidAsk cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Build XAUUSD 90D raw BidAsk catalog if needed
        if: steps.raw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RAW_CATALOG"
          python research/build_raw_bidask_catalog_duka.py \
            --start "$RAW_START" \
            --days "$RAW_DAYS" \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD \
            --workers 32 \
            --fresh

      - name: Fail-closed Raw BidAsk quality gate
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"

      - name: Save XAUUSD 90D raw BidAsk cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Run synchronized XAUUSD M1-M5-M15-H1-H4-D1 MTF BT
        shell: bash
        run: |
          set -euo pipefail
          python research/amos_fibcircle_mtf_raw_bt.py \
            --catalog "$RAW_CATALOG" \
            --symbol XAUUSD \
            --experiment-id "$EXPERIMENT_ID" \
            --raw-bidask-only

      - name: Upload immutable BT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-fibcircle-mtf-xau90-v1
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
