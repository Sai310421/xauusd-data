version: 2.1
jobs:
  abc-nautilus-rawtick:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build NautilusTrader container
          command: docker build -f ci/nautilus/Dockerfile -t amos-nautilus-abc .
      - run:
          name: Run genuine Bid Ask Raw Tick BT
          no_output_timeout: 30m
          command: |
            mkdir -p results/amos-abc
            docker run --rm -e BT_START=2026-10-19 -e BT_DAYS=1 -v "$PWD/results/amos-abc:/workspace/results/amos-abc" amos-nautilus-abc
      - run:
          name: Verify exported KPI and print A01 B01 C01 metrics
          when: always
          command: |
            if [ ! -s results/amos-abc/rawtick-kpi.json ]; then
              echo 'ERROR: KPI JSON missing; BT not proven complete'
              exit 1
            fi
            python3 - <<'PY'
            import json
            from pathlib import Path
            d=json.loads(Path('results/amos-abc/rawtick-kpi.json').read_text())
            assert d.get('verification') == 'NAUTILUS_RAW_QUOTETICK_VIRTUAL_EXECUTION'
            assert d.get('raw_ticks',0) >= 1000
            for k in ('A01','B01','C01'):
                e=d['edges'][k]
                assert e['N'] > 0 and e['PF'] is not None
                print(f"{k}: N={e['N']} PF={e['PF']} WR={e['WR_pct']:.2f}% net={e['net_usd']:.2f} MAE={e['mean_MAE_usd']:.2f} MFE={e['mean_MFE_usd']:.2f}")
            print(f"raw_ticks={d['raw_ticks']} combined_floating_DD={d['max_floating_dd_pct_combined']:.2f}%")
            PY
      - store_artifacts:
          path: results/amos-abc
          destination: abc-nautilus-rawtick
workflows:
  abc-nautilus-rawtick:
    jobs:
      - abc-nautilus-rawtick:
          filters:
            branches:
              only: research/amos-abc-nautilus-rawtick-20261023
