name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline_none
            risk_mode: none
            risk_start_layer: 1
            fp_threshold: 0.60
            fp_block: 0.78
            min_scale: 1.00
          - name: fp_L9_055_075
            risk_mode: firstpass
            risk_start_layer: 9
            fp_threshold: 0.55
            fp_block: 0.75
            min_scale: 0.85
          - name: fp_L9_060_078
            risk_mode: firstpass
            risk_start_layer: 9
            fp_threshold: 0.60
            fp_block: 0.78
            min_scale: 0.85
          - name: fp_L9_065_082
            risk_mode: firstpass
            risk_start_layer: 9
            fp_threshold: 0.65
            fp_block: 0.82
            min_scale: 0.90
          - name: fpbar_L9_060_078
            risk_mode: fp_barrier
            risk_start_layer: 9
            fp_threshold: 0.60
            fp_block: 0.78
            min_scale: 0.90
          - name: fp_L8_060_078
            risk_mode: firstpass
            risk_start_layer: 8
            fp_threshold: 0.60
            fp_block: 0.78
            min_scale: 0.90
          - name: fp_L8_065_082
            risk_mode: firstpass
            risk_start_layer: 8
            fp_threshold: 0.65
            fp_block: 0.82
            min_scale: 0.90
          - name: barrier_L9_reference
            risk_mode: barrier
            risk_start_layer: 9
            fp_threshold: 0.60
            fp_block: 0.78
            min_scale: 0.85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: python research/tickscalper_nautilus_raw_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 10 --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode ${{ matrix.risk_mode }} --risk-start-layer ${{ matrix.risk_start_layer }} --fp-threshold ${{ matrix.fp_threshold }} --fp-block-threshold ${{ matrix.fp_block }} --dd-soft-pct 20 --dd-barrier-k 1.2 --min-add-scale ${{ matrix.min_scale }} --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
