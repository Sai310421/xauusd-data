name: TickScalper Unified Math Controller Raw BidAsk
on:
  push:
    branches: [research/tickscalper-original-lineage-v1]
    paths:
      - 'research/tickscalper_unified_math_controller_bt.py'
      - '.github/workflows/tickscalper-unified-math-controller.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {name: c28_l30_fp60_78, cap: 28, lam: 3.0, fp_reduce: 0.60, fp_block: 0.78}
          - {name: c28_l30_fp65_82, cap: 28, lam: 3.0, fp_reduce: 0.65, fp_block: 0.82}
          - {name: c28_l30_fp70_85, cap: 28, lam: 3.0, fp_reduce: 0.70, fp_block: 0.85}
          - {name: c28_l35_fp60_78, cap: 28, lam: 3.5, fp_reduce: 0.60, fp_block: 0.78}
          - {name: c28_l35_fp65_82, cap: 28, lam: 3.5, fp_reduce: 0.65, fp_block: 0.82}
          - {name: c28_l35_fp70_85, cap: 28, lam: 3.5, fp_reduce: 0.70, fp_block: 0.85}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: >
          PYTHONPATH=. python research/tickscalper_unified_math_controller_bt.py
          --catalog "$RAW_CATALOG"
          --experiment-id "unified-${{ github.run_id }}-${{ matrix.name }}"
          --ddr-cap ${{ matrix.cap }}
          --ddr-lambda ${{ matrix.lam }}
          --ddr-start-layer 8
          --ddr-min-scale 0.50
          --fp-reduce ${{ matrix.fp_reduce }}
          --fp-block ${{ matrix.fp_block }}
          --fast-frac 0.06
          --hard-fdd 45
          --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \;
