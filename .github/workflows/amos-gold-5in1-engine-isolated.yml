name: AMOS GOLD 5IN1 Engine-Isolated RawTick Validation

on:
  workflow_dispatch:
  push:
    branches: [bt/amos-gold-5in1-v101]
    paths:
      - research/amos_gold_5in1_v101_rawtick_bt.py
      - research/amos_gold_5in1_math_edge.py
      - .github/workflows/amos-gold-5in1-engine-isolated.yml

jobs:
  validate-single-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy 'nautilus_trader==1.230.0'
      - name: Syntax gate
        run: python -m py_compile research/amos_gold_5in1_v101_rawtick_bt.py research/amos_gold_5in1_math_edge.py
      - name: Validate all retained engines on one identical Raw BidAsk dataset
        shell: bash
        run: |
          set -euo pipefail
          CACHE=/tmp/amos_gold_5in1_raw.pkl.gz
          for ENGINE in ALL GRAND AI FLASH LIMIT NINE; do
            OUT="results/amos_gold_5in1_v102/$ENGINE"
            python research/amos_gold_5in1_v101_rawtick_bt.py --start 2026-07-27 --days 21 --workers 8 --engine "$ENGINE" --cache "$CACHE" --out "$OUT"
            python research/amos_gold_5in1_math_edge.py --dir "$OUT" --capital 1000
          done
      - name: Verify identical tick counts
        run: |
          python - <<'PY'
          import json, pathlib
          files=list(pathlib.Path("results/amos_gold_5in1_v102").glob("*/summary.json"))
          counts={p.parent.name:json.loads(p.read_text())["raw_ticks"] for p in files}
          print(counts)
          if len(counts)!=6 or len(set(counts.values()))!=1:
              raise SystemExit("IDENTICAL_DATASET_GATE_FAIL")
          PY
      - name: Preserve 5EA plus Math EDGE KPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-gold-5in1-v102-single-dataset-math-edge
          path: results/amos_gold_5in1_v102/
          if-no-files-found: warn
          retention-days: 90
