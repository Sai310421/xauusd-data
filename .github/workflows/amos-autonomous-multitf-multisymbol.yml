name: AMOS Autonomous MultiTF MultiSymbol Selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amos-autonomous-multitf-multisymbol.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2

jobs:
  selection-6x3:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Raw BidAsk guard 6 symbols
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF
      - name: Run 6 symbols x 3 TF selection
        run: |
          ID="amos-auto-multitf-multisymbol-${GITHUB_RUN_ID}"
          python -m research.minimumspike_raw6x3_bt_isolated \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF \
            --timeframes M1 M5 M15 \
            --experiment-id "$ID" --raw-bidask-only
      - name: Rank cells without return-only bias
        run: |
          ID="amos-auto-multitf-multisymbol-${GITHUB_RUN_ID}"
          python research/select_top_cells.py \
            --summary "results/ae-bt/$ID/summary.json" \
            --out "results/ae-bt/$ID/selected_cells.json" \
            --top-k 12 --min-n 10 --min-pf 1.0 --max-dd 30 --max-per-symbol 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amos-auto-multitf-multisymbol-${{ github.run_id }}
          path: results/ae-bt/amos-auto-multitf-multisymbol-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
