name: AE Math Controller v5 Ownership Entry Gate

on:
  workflow_dispatch:
  push:
    branches: [ae-highn-2edge-math-bt]
    paths:
      - '.github/workflows/ae-math-controller-v5-ownership.yml'
      - 'research/ae_math_v5_ownership_patch.py'

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  BT_REV: 'math-controller-v5-ownership'

jobs:
  ownership:
    strategy:
      fail-fast: false
      matrix:
        tf: [M1, M5]
        entry_variant: [B_ONLY, A_TO_B, OWNED_EXIT, B_CONFIRM_A]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Raw gate
        run: |
          test "${{ steps.raw-cache.outputs.cache-hit }}" = 'true'
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Apply v4 + v5 patches
        run: |
          python research/ae_math_v4_patch.py
          python research/ae_math_v5_ownership_patch.py
      - name: Run Raw ownership cell
        env:
          TF: ${{ matrix.tf }}
          EXIT_MODE: B_EXIT
          ENTRY_VARIANT: ${{ matrix.entry_variant }}
          EXP: aemath5-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.entry_variant }}
        run: |
          python research/ae_highn_2edge_math_raw6x3_bt.py --catalog "$RAW_CATALOG" --symbols XAUUSD --timeframes "$TF" --experiment-id "$EXP" --raw-bidask-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aemath5-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.entry_variant }}
          path: results/ae-bt/aemath5-${{ github.run_id }}-${{ matrix.tf }}-${{ matrix.entry_variant }}/
          if-no-files-found: warn
          retention-days: 90
