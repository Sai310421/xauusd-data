name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ts5_exit0855
            basket_offset: 0.855
            session_start: 7
            session_end: 17
          - name: ts5_exit0858
            basket_offset: 0.858
            session_start: 7
            session_end: 17
          - name: ts5_exit0860
            basket_offset: 0.860
            session_start: 7
            session_end: 17
          - name: ts5_exit0862
            basket_offset: 0.862
            session_start: 7
            session_end: 17
          - name: ts5_exit0865
            basket_offset: 0.865
            session_start: 7
            session_end: 17
          - name: ts5_exit086_s8_16
            basket_offset: 0.860
            session_start: 8
            session_end: 16
          - name: ts5_exit086_s75_165
            basket_offset: 0.860
            session_start: 7
            session_end: 16
          - name: ts5_exit086_s7_16
            basket_offset: 0.860
            session_start: 7
            session_end: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: python research/tickscalper_nautilus_raw_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start ${{ matrix.session_start }} --session-end ${{ matrix.session_end }} --basket-offset ${{ matrix.basket_offset }} --max-layers 10 --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
