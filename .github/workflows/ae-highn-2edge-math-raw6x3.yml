name: AE HighN 2Edge Math Raw BidAsk BT

on:
  workflow_dispatch:
  push:
    branches:
      - ae-highn-2edge-math-bt
    paths:
      - 'research/ae_highn_2edge_math_raw6x3_bt.py'
      - '.github/workflows/ae-highn-2edge-math-raw6x3.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: ae-highn-2edge-${{ github.run_id }}

jobs:
  xau-first-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare evidence
        run: |
          mkdir -p "results/ae-bt/$EXPERIMENT_ID/preflight"
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "sha=$GITHUB_SHA" "experiment_id=$EXPERIMENT_ID" > "results/ae-bt/$EXPERIMENT_ID/preflight/run_identity.txt"
          sha256sum research/ae_highn_2edge_math_raw6x3_bt.py > "results/ae-bt/$EXPERIMENT_ID/preflight/strategy_sha256.txt"
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - name: Restore immutable Raw BidAsk catalog
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Raw catalog gate
        run: |
          if [ "${{ steps.raw-cache.outputs.cache-hit }}" != 'true' ]; then echo 'RAW_FACTORY_CACHE_MISS'; exit 22; fi
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
          cp "$RAW_CATALOG/catalog_manifest.json" "results/ae-bt/$EXPERIMENT_ID/preflight/catalog_manifest.json"
      - name: Run XAUUSD M1 M5 M15 A B AB AB100D
        run: |
          python research/ae_highn_2edge_math_raw6x3_bt.py \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD \
            --timeframes M1 M5 M15 \
            --experiment-id "$EXPERIMENT_ID" \
            --raw-bidask-only
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-highn-2edge-${{ env.EXPERIMENT_ID }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
