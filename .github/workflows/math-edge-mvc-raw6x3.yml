name: Math EDGE MVC Raw BidAsk A-B

on:
  workflow_run:
    workflows: ['Raw BidAsk Catalog Factory']
    types: [completed]
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Unique experiment id'
        required: true
        default: 'math-edge-mvc-manual'
  push:
    paths:
      - 'research/math_edge_mvc_raw6x3_bt.py'
      - 'research/math_edge_candidates.py'
      - 'research/math_edge_ab_gate.py'
      - 'research/ensure_raw_bidask_catalog.sh'
      - '.github/workflows/math-edge-mvc-raw6x3.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-07-27'
  RAW_DAYS: '30'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment_id || format('math-edge-mvc-{0}', github.run_id) }}

jobs:
  mvc-ab:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "results/ae-bt/$EXPERIMENT_ID/preflight"
          printf '%s\n' \
            "run_id=${GITHUB_RUN_ID}" \
            "git_sha=${GITHUB_SHA}" \
            "source_sha=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" \
            "raw_cache_key=${RAW_CACHE_KEY}" > "results/ae-bt/$EXPERIMENT_ID/preflight/run_identity.txt"
          sha256sum research/math_edge_mvc_raw6x3_bt.py research/math_edge_candidates.py research/math_edge_ab_gate.py > "results/ae-bt/$EXPERIMENT_ID/preflight/strategy_sha256.txt"

      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"

      - name: Restore shared immutable Raw BidAsk catalog cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Ensure Raw BidAsk catalog (restore or bootstrap)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
          cp "$RAW_CATALOG/catalog_manifest.json" "results/ae-bt/$EXPERIMENT_ID/preflight/catalog_manifest.json"
          find "$RAW_CATALOG" -type f -printf '%P %s bytes\n' | sort > "results/ae-bt/$EXPERIMENT_ID/preflight/catalog_inventory.txt"

      - name: Save catalog cache after bootstrap
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Run BASE vs MVC proxy on identical raw quotes
        shell: bash
        run: |
          set -euo pipefail
          python -m research.math_edge_mvc_raw6x3_bt \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF \
            --timeframes M1 M5 M15 \
            --experiment-id "$EXPERIMENT_ID" \
            --raw-bidask-only

      - name: Build A-B gate inputs and decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('results/ae-bt')/os.environ['EXPERIMENT_ID']
          s=json.loads((root/'summary.json').read_text())
          common={
              'verification_level': s.get('verification_level'),
              'data_kind':'RAW_BIDASK QuoteTick',
              'ohlc_resample_used':False,
              'dataset_sha256':s.get('dataset_sha256'),
          }
          (root/'base_gate.json').write_text(json.dumps({**common,'metrics':s['baseline']},indent=2))
          (root/'edge_gate.json').write_text(json.dumps({**common,'metrics':s['edge']},indent=2))
          PY
          python research/math_edge_ab_gate.py \
            --base "results/ae-bt/$EXPERIMENT_ID/base_gate.json" \
            --edge "results/ae-bt/$EXPERIMENT_ID/edge_gate.json" \
            --out "results/ae-bt/$EXPERIMENT_ID/ab_gate.json" \
            --max-n-drop-pct 20 \
            --max-dd-worsen-pct 3

      - name: Upload immutable A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-edge-mvc-${{ env.EXPERIMENT_ID }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
