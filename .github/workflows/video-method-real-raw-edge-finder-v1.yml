name: Video Method Real Raw EDGE Finder v1

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        required: true
        default: video-edge-real-v1
  push:
    branches: ['feature/video-edge-finder-real-raw-v1-20260921']
    paths:
      - 'research/video_method_edge_finder_v1.py'
      - 'tests/test_video_method_edge_finder_v1.py'
      - '.github/workflows/video-method-real-raw-edge-finder-v1.yml'

permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: '2026-07-27'
  RAW_DAYS: '30'
  RAW_WORKERS: '12'
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment_id || format('video-edge-real-v1-{0}', github.run_id) }}

jobs:
  edge-finder:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pytest
      - name: Unit gate
        run: pytest -q tests/test_video_method_edge_finder_v1.py
      - name: Restore Raw BidAsk catalog
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Ensure Raw BidAsk
        run: |
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Search EDGE
        run: |
          python -m research.video_method_edge_finder_v1             --catalog "$RAW_CATALOG"             --symbols XAUUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF             --experiment-id "$EXPERIMENT_ID"             --paths 2000             --path-trades 400             --raw-bidask-only
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-method-edge-${{ env.EXPERIMENT_ID }}
          path: results/edge-finder/${{ env.EXPERIMENT_ID }}/
          if-no-files-found: error
          retention-days: 90
