name: GoldeBrave G75 Chase Raw
on:
  push:
    paths:
      - 'research/goldebrave_c_g75_chase_raw.py'
      - '.github/workflows/goldebrave-g75-chase-raw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bt:
    strategy:
      fail-fast: false
      matrix:
        layers: [0, 3, 5, 10]
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: gb-g75-chase-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run G75 chase comparison
        run: python research/goldebrave_c_g75_chase_raw.py --catalog "$RAW_CATALOG" --max-layers "${{ matrix.layers }}" --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: gb-g75-chase-${{ github.run_id }}-layers${{ matrix.layers }}
          path: results/goldebrave-g75-chase/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
