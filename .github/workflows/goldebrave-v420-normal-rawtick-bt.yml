name: GoldeBrave v4.20 Normal RawTick BT
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/goldebrave_v420_normal_rawtick_bt.py'
      - '.github/workflows/goldebrave-v420-normal-rawtick-bt.yml'
jobs:
  bt:
    runs-on: ubuntu-24.04
    env:
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      NAUTILUS_VERSION: '1.230.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - name: Restore Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Guard Raw BidAsk
        run: |
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Run normal BT
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/goldebrave_v420_normal_rawtick_bt.py')
          s=p.read_text()
          s=s.replace("    vol=1.; regime=0; av=4.; day_hi=-1e99; day_lo=1e99; prev_hour=-1; hour_key=-1; hour_hi=-1e99; hour_lo=1e99", "    vol=1.; regime=0; av=4.; day_hi=-1e99; day_lo=1e99; prev_hour=-1; hour_key=-1; hour_hi=-1e99; hour_lo=1e99; curr_bid=0.; curr_ask=0.")
          s=s.replace("    def add_pending(s,px,layer,now_ns):\n        if count_side(s)>=MAX_PENDING_SIDE:return", "    def add_pending(s,px,layer,now_ns):\n        if s>0 and px<=curr_ask:return\n        if s<0 and px>=curr_bid:return\n        if count_side(s)>=MAX_PENDING_SIDE:return")
          s=s.replace("        ns=int(tns[k]); b=float(bid[k]); aa=float(ask[k]); mid=(b+aa)*0.5;", "        ns=int(tns[k]); b=float(bid[k]); aa=float(ask[k]); curr_bid=b; curr_ask=aa; mid=(b+aa)*0.5;")
          s=s.replace("'entry_layers':dict(pd.Series([t.layer for t in trades]).value_counts()) if trades else {}", "'entry_layers':{str(k):int(v) for k,v in pd.Series([t.layer for t in trades]).value_counts().items()} if trades else {}")
          p.write_text(s)
          PY
          OUT="results/goldebrave-normal/${{ github.run_id }}"
          python research/goldebrave_v420_normal_rawtick_bt.py --catalog "$RAW_CATALOG" --out "$OUT"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldebrave-normal-${{ github.run_id }}
          path: results/goldebrave-normal/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
