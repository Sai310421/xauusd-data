name: Raw BidAsk Catalog Factory

on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC start date (inclusive)
        required: true
        default: '2026-07-27'
      days:
        description: Calendar days to materialize from public history
        required: true
        default: '90'
      symbols:
        description: XAUUSD only for the public historical archive
        required: true
        default: 'XAUUSD'
      allow_unlicensed_public_archive:
        description: Explicitly acknowledge that source permission has been independently confirmed
        type: boolean
        required: true
        default: false
  push:
    paths:
      - 'research/build_xauusd_github_bidask_catalog.py'
      - '.github/workflows/raw-bidask-catalog-factory.yml'

permissions:
  contents: read

concurrency:
  group: raw-bidask-github-duka-tail-${{ inputs.start || '2026-07-27' }}-${{ inputs.days || '90' }}-v4
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_START: ${{ inputs.start || '2026-07-27' }}
  RAW_DAYS: ${{ inputs.days || '90' }}
  RAW_CACHE_KEY: raw-bidask-github-duka-tail-${{ inputs.start || '2026-07-27' }}-${{ inputs.days || '90' }}-XAUUSD-v4
  FACTORY_EVIDENCE: results/raw-factory/${{ github.run_id }}

jobs:
  raw-factory:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: License preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FACTORY_EVIDENCE"
          printf '%s\n' \
            "factory_run_id=${GITHUB_RUN_ID}" \
            "git_sha=${GITHUB_SHA}" \
            "source=public_github_archive" \
            "license_status=BLOCKED_UNVERIFIED" > "$FACTORY_EVIDENCE/run_identity.txt"
          if [ "${{ inputs.allow_unlicensed_public_archive }}" != "true" ]; then
            echo "BLOCKED: public archive has no repository license; confirm source permissions before use."
            exit 78
          fi

      - uses: actions/setup-python@v5
        if: ${{ inputs.allow_unlicensed_public_archive == true }}
        with:
          python-version: '3.12'

      - name: Build from public GitHub history plus Dukascopy tail
        if: ${{ inputs.allow_unlicensed_public_archive == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.symbols || 'XAUUSD' }}" = "XAUUSD"
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
          python research/build_xauusd_github_bidask_catalog.py \
            --start "$RAW_START" --days "$RAW_DAYS" --catalog "$RAW_CATALOG"
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD

      - name: Capture evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$FACTORY_EVIDENCE"
          if [ -f "$RAW_CATALOG/catalog_manifest.json" ]; then
            cp "$RAW_CATALOG/catalog_manifest.json" "$FACTORY_EVIDENCE/catalog_manifest.json"
          else
            printf '%s\n' '{"status":"BLOCKED_UNVERIFIED_LICENSE","ohlc_resample_used":false}' > "$FACTORY_EVIDENCE/catalog_manifest.json"
          fi
          find "$RAW_CATALOG" -type f -printf '%P %s bytes\n' 2>/dev/null | sort > "$FACTORY_EVIDENCE/catalog_inventory.txt" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-bidask-factory-${{ github.run_id }}
          path: results/raw-factory/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
