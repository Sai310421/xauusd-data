name: TickScalper StopLoss Ablation
on:
  push:
    branches:
      - research/tickscalper-original-lineage-v1
    paths:
      - .github/workflows/tickscalper-stoploss-ablation.yml
permissions:
  contents: read
env:
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        emergency: [0.5,1.0,1.5,2.0,2.5,3.0,3.8,4.5,5.5,7.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nautilus_trader==1.230.0' numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: python research/tickscalper_stoploss_ablation.py --catalog "$RAW_CATALOG" --experiment-id "stop-${{ matrix.emergency }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.8575 --max-layers 10 --emergency-distance ${{ matrix.emergency }} --entry-mode ticksmoother --ts-ticks-per-bar 5 --ts-fast 3 --ts-slow 5 --ts-conf1 8 --ts-conf2 13 --ts-cross-only --risk-mode none --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stoploss-${{ matrix.emergency }}
          path: results/tickscalper-nautilus/
          if-no-files-found: warn
          retention-days: 30
