name: M1-M5 Opposite Overlap Trace BT v20

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/m1_linepoi_m5_g75_overlap_v20.py'
      - '.github/workflows/m1-m5-opposite-trace-v20.yml'

permissions:
  contents: read

env:
  NAUTILUS_VERSION: '1.230.0'
  EXPERIMENT_ID: opposite-trace-v20-${{ github.run_id }}
  EVIDENCE: results/m1-linepoi-m5-g75-overlap-v20/opposite-trace-v20-${{ github.run_id }}

jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - name: Syntax check
        run: python -m py_compile research/m1_linepoi_m5_g75_overlap_v20.py
      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p1, key: elliott-duka-xau-2026-02-25-30d-v3, fail-on-cache-miss: true}
      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p2, key: elliott-duka-xau-2026-03-27-30d-v3, fail-on-cache-miss: true}
      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with: {path: catalog/elliott_duka_p3, key: elliott-duka-xau-2026-04-26-31d-v3, fail-on-cache-miss: true}
      - name: Run trace
        run: |
          python research/m1_linepoi_m5_g75_overlap_v20.py             --catalog catalog/elliott_duka_p1 --catalog catalog/elliott_duka_p2 --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}" --mode g75 --g75-reversal 0.05
      - name: Print overlap contexts
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open(os.path.join(os.environ['EVIDENCE'],'result.json')))
          print('M1=',r['m1_metrics'])
          print('M5=',r['base_metrics'])
          print('SAME=',json.dumps(r['direction_overlap']['same_direction'],indent=2))
          print('OPPOSITE=',json.dumps(r['direction_overlap']['opposite_direction'],indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-m5-opposite-trace-v20-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
