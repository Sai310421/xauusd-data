name: TickScalper Optimal Stop Raw BidAsk
on:
  workflow_dispatch:
  push:
    branches:
      - research/tickscalper-original-lineage-v1
    paths:
      - research/tickscalper_optimal_stop_bt.py
      - .github/workflows/tickscalper-optimal-stop.yml
permissions:
  contents: read
env:
  RAW_CATALOG: catalog/raw_bidask
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "nautilus_trader==1.230.0" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: raw-bidask-duka-6sym-2026-07-27-30d-v2
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run stop ablation
        shell: bash
        run: |
          set -euo pipefail
          run(){ PYTHONPATH=. python research/tickscalper_optimal_stop_bt.py --catalog "$RAW_CATALOG" --raw-bidask-only "$@"; }
          run --experiment-id STOP-none --mode none
          run --experiment-id STOP-fixed20 --mode fixed --loss-stop 20 --min-layer 8
          run --experiment-id STOP-fixed30 --mode fixed --loss-stop 30 --min-layer 8
          run --experiment-id STOP-fixed40 --mode fixed --loss-stop 40 --min-layer 8
          run --experiment-id STOP-fp82 --mode fp --fp-thr .82 --min-layer 8
          run --experiment-id STOP-fp88 --mode fp --fp-thr .88 --min-layer 8
          run --experiment-id STOP-fdd25fp82 --mode fdd_fp --fdd-thr 25 --fp-thr .82 --min-layer 8
          run --experiment-id STOP-fdd30fp82 --mode fdd_fp --fdd-thr 30 --fp-thr .82 --min-layer 8
          run --experiment-id STOP-fdd30fp88 --mode fdd_fp --fdd-thr 30 --fp-thr .88 --min-layer 8
      - if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \;
