name: AMOS M1 Inverse EDGE Factory v1.29
on:
  workflow_dispatch:
  push:
    branches: [feat/amos-checklist-parity-v1-2]
    paths:
      - 'research/amos_m1_inverse_edge_factory_v1_29.py'
      - 'research/amos_m1_inverse_edge_merge_v1_29.py'
      - '.github/workflows/amos-m1-inverse-edge-factory-v1-29.yml'
permissions: {contents: read}
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: 'catalog/raw_bidask'
  RAW_CACHE_KEY: 'raw-bidask-duka-6sym-2026-07-27-30d-v2'

jobs:
  real_raw:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - uses: actions/cache/restore@v4
        with:
          path: 'catalog/raw_bidask'
          key: '${{ env.RAW_CACHE_KEY }}'
          fail-on-cache-miss: true
      - run: python research/amos_m1_inverse_edge_factory_v1_29.py --lane real --catalog "$RAW_CATALOG" --out results/v129/real
      - uses: actions/upload-artifact@v4
        with:
          name: v129-real
          path: results/v129/real/

  random_stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 20261005, vol: 0.70}
          - {seed: 20261005, vol: 1.00}
          - {seed: 20261005, vol: 1.30}
          - {seed: 20261006, vol: 0.70}
          - {seed: 20261006, vol: 1.00}
          - {seed: 20261006, vol: 1.30}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - run: python research/amos_m1_inverse_edge_factory_v1_29.py --lane random --seed ${{ matrix.seed }} --vol-mult ${{ matrix.vol }} --days 7 --ticks-per-minute 20 --out results/v129/random_${{ matrix.seed }}_${{ matrix.vol }}
      - uses: actions/upload-artifact@v4
        with:
          name: v129-random-${{ matrix.seed }}-${{ matrix.vol }}
          path: results/v129/random_${{ matrix.seed }}_${{ matrix.vol }}/

  merge_scoreboard:
    needs: [real_raw, random_stress]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: v129-*
          path: downloaded
      - run: python research/amos_m1_inverse_edge_merge_v1_29.py --root downloaded --out results/v129/scoreboard
      - run: cat results/v129/scoreboard/scoreboard.json
      - uses: actions/upload-artifact@v4
        with:
          name: v129-scoreboard
          path: results/v129/scoreboard/
