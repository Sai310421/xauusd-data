name: Nautilus Lane MODULE RECOVERY v1

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Unique experiment id'
        required: true
        default: 'module-recovery-manual'
      runner:
        description: 'Strategy runner module'
        required: true
        default: 'research.minimumspike_raw6x3_bt'

jobs:
  run:
    uses: ./.github/workflows/nautilus-raw-bidask-reusable-v1.yml
    with:
      lane_class: MODULE_RECOVERY
      experiment_id: ${{ inputs.experiment_id }}
      runner: ${{ inputs.runner }}
