name: BigPlayer Synergy Supervisor 21D BT

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/bigplayer_synergy_supervisor_21d.py'
      - '.github/workflows/bigplayer-synergy-supervisor-21d.yml'

permissions:
  contents: write

concurrency:
  group: bigplayer-synergy-supervisor-21d
  cancel-in-progress: false

jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Run common-horizon synergy screen
        run: python research/bigplayer_synergy_supervisor_21d.py --start 2026-07-27
      - name: Persist results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/bigplayer_synergy_supervisor_21d
          git diff --cached --quiet || git commit -m 'bt: persist BigPlayer synergy supervisor 21d results'
          git pull --rebase
          git push
