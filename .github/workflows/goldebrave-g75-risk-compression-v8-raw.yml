name: GoldeBrave G75 Risk Compression V8 Raw

on:
  push:
    branches: [ main ]
    paths:
      - 'research/goldebrave_c_g75_risk_compression_v8_raw.py'
      - '.github/workflows/goldebrave-g75-risk-compression-v8-raw.yml'
  workflow_dispatch:

jobs:
  bt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [a, b, c]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: gb-g75-risk-compression-v8-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run V8 parent risk compression sweep
        run: |
          python research/goldebrave_c_g75_risk_compression_v8_raw.py \
            --catalog "$RAW_CATALOG" \
            --profile "${{ matrix.profile }}" \
            --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: gb-g75-risk-compression-v8-${{ github.run_id }}-${{ matrix.profile }}
          path: results/goldebrave-g75-risk-compression-v8/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
