name: AE Recovery DR-MPC Raw A/B

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/ae_allweather_nautilus_raw_ab_v9_drmpc.py'
      - 'research/ae_dr_mpc_recovery.py'
      - '.github/workflows/ae-recovery-drmpc-raw-ab.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  NAUTILUS_VERSION: '1.230.0'

jobs:
  raw-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow
      - name: Restore Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Ensure Raw BidAsk catalog
        run: |
          chmod +x research/ensure_raw_bidask_catalog.sh
          research/ensure_raw_bidask_catalog.sh
          python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"
      - name: Run recovery DR-MPC A/B
        run: |
          EXP="recovery-drmpc-${{ github.run_id }}"
          python -m research.ae_allweather_nautilus_raw_ab_v9_drmpc --catalog "$RAW_CATALOG" --experiment-id "$EXP" --tf 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-drmpc-${{ github.run_id }}
          path: results/math-edge-v2/recovery-drmpc-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
