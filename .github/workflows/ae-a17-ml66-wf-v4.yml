name: AE A17 ML66 WalkForward v4
on:
  push:
    branches: ["amos/a17-ml66-oos-v1"]
    paths:
      - "scripts/ae_a17_ml66_wf_v4.py"
      - ".github/workflows/ae-a17-ml66-wf-v4.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amos/a17-ml66-oos-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pandas lightgbm scikit-learn joblib
      - name: Run causal walk-forward
        run: python scripts/ae_a17_ml66_wf_v4.py
      - name: Show report
        run: cat bt_results/ae_a17_ml66_wf_v4/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ae-a17-ml66-wf-v4
          path: bt_results/ae_a17_ml66_wf_v4/
          retention-days: 30
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bt_results/ae_a17_ml66_wf_v4/report.json
          if ! git diff --cached --quiet; then git commit -m "Add ML66 walk-forward v4 results"; git push; fi
