name: Elliott ICT M5 G75 Reversal Sweep Raw BT v18

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/elliott_ict_m5_g75_reversal_v18.py'
      - '.github/workflows/elliott-ict-m5-g75-reversal-v18.yml'

permissions:
  contents: read

concurrency:
  group: elliott-ict-m5-g75-reversal-v18
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'

jobs:
  bt:
    name: rev-${{ matrix.rev }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        rev: [0.05, 0.075, 0.10, 0.125, 0.15, 0.20]

    env:
      EXPERIMENT_ID: m5-g75-rev-${{ matrix.rev }}-v18-${{ github.run_id }}
      EVIDENCE: results/elliott-ict-m5-g75-reversal-v18/m5-g75-rev-${{ matrix.rev }}-v18-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p1
          key: elliott-duka-xau-2026-02-25-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p2
          key: elliott-duka-xau-2026-03-27-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p3
          key: elliott-duka-xau-2026-04-26-31d-v3
          fail-on-cache-miss: true

      - name: Run G75 reversal sweep
        run: |
          python research/elliott_ict_m5_g75_reversal_v18.py             --catalog catalog/elliott_duka_p1             --catalog catalog/elliott_duka_p2             --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}"             --mode g75             --g75-reversal "${{ matrix.rev }}"

      - name: Sanity gate
        run: |
          python - <<'PY'
          import json, os, sys
          p=os.path.join(os.environ['EVIDENCE'],'result.json')
          r=json.load(open(p))
          if r['base_metrics']['N'] != 136:
              print('FAIL base N changed:',r['base_metrics']['N'])
              sys.exit(1)
          if r['g75_stats']['triggered_bases'] <= 0:
              print('FAIL no G75 triggers')
              sys.exit(1)
          print('PASS rev=',r['g75_reversal_tested'],
                'PF=',r['PF'],'Net=',r['Net_USD'],
                'DD=',r['MaxFloatingDD_pct_initial'],
                'G75PF=',r['g75_layer_metrics']['PF'],
                'G75Net=',r['g75_layer_metrics']['Net_USD'],
                'layers=',r['g75_stats']['layers_opened'])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-g75-rev-${{ matrix.rev }}-v18-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
