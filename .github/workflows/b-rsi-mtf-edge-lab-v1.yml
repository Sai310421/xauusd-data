name: B RSI MTF Edge Lab v1
on:
  push:
    paths:
      - 'scripts/b_rsi_mtf_edge_lab_v1.py'
      - '.github/workflows/b-rsi-mtf-edge-lab-v1.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Duka MTF books
        uses: actions/checkout@v4
        with:
          repository: Sai310421/xauusd-duka-feed
          path: duka
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python scripts/b_rsi_mtf_edge_lab_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: b-rsi-mtf-edge-lab-v1
          path: bt_results/b_rsi_mtf_edge_lab_v1/
