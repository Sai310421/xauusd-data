name: DexG AMD15 First Passage v1

on:
  push:
    branches:
      - research/dexg-price-state-lab-v1
    paths:
      - 'research/dexg_price_state/amd15_first_passage_v1.py'
      - '.github/workflows/dexg-amd15-first-passage-v1.yml'
  workflow_dispatch:

jobs:
  amd15:
    strategy:
      fail-fast: false
      matrix:
        variant: [BASE15, AMD_MD, AMD_A, AMD_CISD, AMD_TICK]
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: dexg-amd15-v1-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
      - name: Restore Raw BidAsk catalog cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Guard Raw XAUUSD catalog
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run AMD15 first-passage diagnostic
        run: |
          python research/dexg_price_state/amd15_first_passage_v1.py \
            --catalog "$RAW_CATALOG" \
            --experiment-id "$EXPERIMENT_ID" \
            --variant "${{ matrix.variant }}" \
            --max-ticks 3000000
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: dexg-amd15-${{ matrix.variant }}-${{ github.run_id }}
          path: results/dexg-amd15/${{ env.EXPERIMENT_ID }}/${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 90
