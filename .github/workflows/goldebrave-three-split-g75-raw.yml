name: GoldeBrave Three Split G75 Raw
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/goldebrave_c_three_split_g75_raw.py'
      - '.github/workflows/goldebrave-three-split-g75-raw.yml'
jobs:
  bt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [shared10, independent30]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: gb-three-split-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: |
          python research/goldebrave_c_three_split_g75_raw.py \
            --catalog "$RAW_CATALOG" \
            --profile "${{ matrix.profile }}" \
            --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: gb-three-split-${{ matrix.profile }}-${{ github.run_id }}
          path: results/goldebrave-three-split-g75/${{ env.EXPERIMENT_ID }}/${{ matrix.profile }}.json
          retention-days: 90
