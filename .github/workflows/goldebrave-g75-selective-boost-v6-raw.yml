name: GoldeBrave G75 Selective Boost V6 Raw

on:
  push:
    paths:
      - 'research/goldebrave_c_g75_selective_boost_v6_raw.py'
      - '.github/workflows/goldebrave-g75-selective-boost-v6-raw.yml'
  workflow_dispatch:

env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
  EXPERIMENT_ID: gb-g75-selective-boost-v6-${{ github.run_id }}

jobs:
  bt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [a, b, c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_CATALOG }}
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Run V6 expanded selective boost matrix
        run: |
          python research/goldebrave_c_g75_selective_boost_v6_raw.py \
            --catalog "$RAW_CATALOG" \
            --profile "${{ matrix.profile }}" \
            --experiment-id "$EXPERIMENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: gb-g75-selective-v6-${{ github.run_id }}-${{ matrix.profile }}
          path: results/goldebrave-g75-selective-boost-v6/${{ env.EXPERIMENT_ID }}/*.json
          retention-days: 90
