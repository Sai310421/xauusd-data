name: TickScalper Candidate Nautilus Raw BidAsk BT
on:
  push:
    branches: [research/tickscalper-nautilus-v1, research/tickscalper-edge-revalidation-v1, research/tickscalper-original-lineage-v1]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy_exit080
            entry_mode: proxy
            ticks_per_bar: 5
            fast: 3
            slow: 5
            conf1: 8
            conf2: 13
            cross_only: false
            use_macd: false
            no_conf: false
          - name: ts_4t_cross_mode9
            entry_mode: ticksmoother
            ticks_per_bar: 4
            fast: 3
            slow: 5
            conf1: 8
            conf2: 13
            cross_only: true
            use_macd: false
            no_conf: false
          - name: ts_5t_cross_mode9
            entry_mode: ticksmoother
            ticks_per_bar: 5
            fast: 3
            slow: 5
            conf1: 8
            conf2: 13
            cross_only: true
            use_macd: false
            no_conf: false
          - name: ts_6t_cross_mode9
            entry_mode: ticksmoother
            ticks_per_bar: 6
            fast: 3
            slow: 5
            conf1: 8
            conf2: 13
            cross_only: true
            use_macd: false
            no_conf: false
          - name: ts_5t_cross_mode8_macd
            entry_mode: ticksmoother
            ticks_per_bar: 5
            fast: 3
            slow: 5
            conf1: 8
            conf2: 13
            cross_only: true
            use_macd: true
            no_conf: true
          - name: ts_5t_cross_mode9_macd
            entry_mode: ticksmoother
            ticks_per_bar: 5
            fast: 3
            slow: 5
            conf1: 8
            conf2: 13
            cross_only: true
            use_macd: true
            no_conf: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" numpy
      - uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - run: PYTHONPATH=research python research/nautilus_catalog_compat_probe.py --catalog "$RAW_CATALOG" --symbol XAUUSD --output results/nautilus-compat/tickscalper.json
      - run: python research/tickscalper_nautilus_raw_bt.py --catalog "$RAW_CATALOG" --experiment-id "tickscalper-${{ github.run_id }}-${{ matrix.name }}" --base-lot 0.30 --direction-sign 1 --session-start 7 --session-end 17 --basket-offset 0.80 --max-layers 10 --entry-mode ${{ matrix.entry_mode }} --ts-ticks-per-bar ${{ matrix.ticks_per_bar }} --ts-fast ${{ matrix.fast }} --ts-slow ${{ matrix.slow }} --ts-conf1 ${{ matrix.conf1 }} --ts-conf2 ${{ matrix.conf2 }} ${{ matrix.cross_only && '--ts-cross-only' || '' }} ${{ matrix.use_macd && '--ts-use-macd' || '' }} ${{ matrix.no_conf && '--ts-no-conf' || '' }} --raw-bidask-only
      - name: Print KPI
        if: always()
        run: find results/tickscalper-nautilus -name kpi.json -print -exec cat {} \; || true
 
