name: AE Opportunity Saturation Raw BidAsk v1

on:
  push:
    paths:
      - 'research/ae_opportunity_saturation_rawtick_v1.py'
      - '.github/workflows/ae-opportunity-saturation-rawtick-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bt-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        n: [25, 50, 100, 250, 500]
    env:
      NAUTILUS_VERSION: '1.230.0'
      RAW_CATALOG: catalog/raw_bidask
      RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2
      EXPERIMENT_ID: ae-opportunity-saturation-v1-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Nautilus runtime
        run: python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy
      - name: Restore canonical Raw BidAsk catalog
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}
      - name: Guard Raw BidAsk only
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG" --symbols XAUUSD
      - name: Run Opportunity Saturation cell
        run: python research/ae_opportunity_saturation_rawtick_v1.py --catalog "$RAW_CATALOG" --experiment-id "$EXPERIMENT_ID" --max-entries-per-day "${{ matrix.n }}" --raw-bidask-only
      - name: Upload cell evidence
        uses: actions/upload-artifact@v4
        with:
          name: ae-opportunity-N${{ matrix.n }}-${{ github.run_id }}
          path: results/ae-bt/${{ env.EXPERIMENT_ID }}/cells/N${{ matrix.n }}.json
          retention-days: 90
