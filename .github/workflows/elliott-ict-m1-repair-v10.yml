name: Elliott ICT M1 Repair Raw Matrix v10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/elliott_ict_m1_repair_raw_v10.py'
      - '.github/workflows/elliott-ict-m1-repair-v10.yml'

permissions:
  contents: read

concurrency:
  group: elliott-ict-m1-repair-v10
  cancel-in-progress: false

env:
  NAUTILUS_VERSION: '1.230.0'

jobs:
  repair:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: candle-1p6-0p9
            confirm: candle
            body: '1.6'
            range: '0.9'
          - name: line3-1p6-0p9
            confirm: line3
            body: '1.6'
            range: '0.9'
          - name: line5-1p6-0p9
            confirm: line5
            body: '1.6'
            range: '0.9'
          - name: line3-2p0-1p1
            confirm: line3
            body: '2.0'
            range: '1.1'
          - name: line5-2p0-1p1
            confirm: line5
            body: '2.0'
            range: '1.1'

    env:
      EXPERIMENT_ID: m1-repair-v10-${{ matrix.name }}-${{ github.run_id }}
      EVIDENCE: results/elliott-ict-m1-repair-v10/m1-repair-v10-${{ matrix.name }}-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}" pandas numpy pyarrow

      - name: Restore Dukascopy p1
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p1
          key: elliott-duka-xau-2026-02-25-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p2
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p2
          key: elliott-duka-xau-2026-03-27-30d-v3
          fail-on-cache-miss: true

      - name: Restore Dukascopy p3
        uses: actions/cache/restore@v4
        with:
          path: catalog/elliott_duka_p3
          key: elliott-duka-xau-2026-04-26-31d-v3
          fail-on-cache-miss: true

      - name: Run M1 repair candidate
        run: |
          python research/elliott_ict_m1_repair_raw_v10.py             --catalog catalog/elliott_duka_p1             --catalog catalog/elliott_duka_p2             --catalog catalog/elliott_duka_p3             --experiment-id "${EXPERIMENT_ID}"             --confirm-mode "${{ matrix.confirm }}"             --body-mult "${{ matrix.body }}"             --range-atr-mult "${{ matrix.range }}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-repair-v10-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
