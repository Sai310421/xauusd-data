name: CHOCHOMARU Parts Harvest BT v3

on:
  workflow_dispatch:
  push:
    branches:
      - chochomaru-cleanroom-discovery-v1
    paths:
      - 'research/chochomaru_parts_harvest_bt_v3.py'
      - '.github/workflows/chochomaru-parts-harvest-bt-v3.yml'
      - 'research/chochomaru_cleanroom_discovery_bt_v1.py'
      - 'csv/XAUUSD/XAUUSD_M1_2026Q1Q2.csv'

permissions:
  contents: read

jobs:
  parts-harvest-bt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nautilus_trader==1.230.0' pandas numpy
      - name: Run CHOCHOMARU parts-harvest matrix
        run: python research/chochomaru_parts_harvest_bt_v3.py
      - name: Upload v3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chochomaru-parts-harvest-bt-v3
          path: results/chochomaru-parts-harvest-v3/
          if-no-files-found: error
          retention-days: 30
