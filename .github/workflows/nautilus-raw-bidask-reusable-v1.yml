name: Reusable Raw BidAsk Nautilus BT v1

on:
  workflow_call:
    inputs:
      lane_class:
        required: true
        type: string
      experiment_id:
        required: true
        type: string
      runner:
        required: true
        type: string
      raw_start:
        required: false
        default: '2026-07-27'
        type: string
      raw_days:
        required: false
        default: '30'
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  NAUTILUS_VERSION: '1.230.0'
  RAW_CATALOG: catalog/raw_bidask
  RAW_CACHE_KEY: raw-bidask-duka-6sym-2026-07-27-30d-v2

jobs:
  bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare immutable evidence directory
        shell: bash
        run: |
          set -euo pipefail
          OUT="results/ae-bt/${{ inputs.experiment_id }}"
          mkdir -p "$OUT/preflight"
          printf '%s\n' \
            "run_id=${GITHUB_RUN_ID}" \
            "git_sha=${GITHUB_SHA}" \
            "lane_class=${{ inputs.lane_class }}" \
            "experiment_id=${{ inputs.experiment_id }}" \
            "runner=${{ inputs.runner }}" \
            > "$OUT/preflight/github_run.txt"

      - name: Install pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautilus_trader==${NAUTILUS_VERSION}"
          python - <<'PY'
          import nautilus_trader
          print('nautilus_trader', nautilus_trader.__version__)
          PY

      - name: Restore immutable Raw BidAsk catalog cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Self-healing Raw BidAsk catalog bootstrap
        if: steps.raw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "RAW_CATALOG_BOOTSTRAP_ATTEMPT=$attempt"
            if python research/build_raw_bidask_catalog_duka.py \
              --start "${{ inputs.raw_start }}" \
              --days "${{ inputs.raw_days }}" \
              --catalog "$RAW_CATALOG" \
              --workers 32; then
              ok=1
              break
            fi
            rm -rf "$RAW_CATALOG"
            mkdir -p "$RAW_CATALOG"
            sleep $((attempt * 10))
          done
          test "$ok" -eq 1

      - name: Capture Raw Catalog preflight evidence
        if: always()
        shell: bash
        run: |
          set -u
          OUT="results/ae-bt/${{ inputs.experiment_id }}/preflight"
          mkdir -p "$OUT"
          if [ -f "$RAW_CATALOG/catalog_manifest.json" ]; then
            cp "$RAW_CATALOG/catalog_manifest.json" "$OUT/catalog_manifest.json"
          else
            printf '%s\n' '{"status":"MISSING","reason":"catalog_manifest.json unavailable","ohlc_resample_used":false}' > "$OUT/catalog_manifest.json"
          fi
          find "$RAW_CATALOG" -maxdepth 4 -type f -printf '%p %s bytes\n' 2>/dev/null | sort > "$OUT/catalog_inventory.txt" || true

      - name: Fail-closed Raw BidAsk quality gate
        run: python research/raw_bidask_catalog_guard.py --catalog "$RAW_CATALOG"

      - name: Save verified Raw BidAsk catalog cache
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: catalog/raw_bidask
          key: ${{ env.RAW_CACHE_KEY }}

      - name: Run Nautilus BacktestEngine
        shell: bash
        run: |
          set -euo pipefail
          python -m "${{ inputs.runner }}" \
            --catalog "$RAW_CATALOG" \
            --symbols XAUUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF \
            --timeframes M1 M5 M15 \
            --experiment-id "${{ inputs.experiment_id }}" \
            --raw-bidask-only

      - name: Assemble AMOS machine-readable evidence
        if: always()
        shell: bash
        run: |
          set -u
          OUT="results/ae-bt/${{ inputs.experiment_id }}"
          python research/amos_evidence_assembler.py "$OUT" --output "$OUT/amos_evidence.json"

      - name: Evaluate AMOS Evidence + WR5 gate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT="results/ae-bt/${{ inputs.experiment_id }}"
          python research/amos_evidence_gate.py "$OUT/amos_evidence.json" --output "$OUT/amos_evidence_gate.json"

      - name: Evaluate robustness evidence when present
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT="results/ae-bt/${{ inputs.experiment_id }}"
          if [ -f "$OUT/robustness.json" ]; then
            python research/amos_robustness_gate.py "$OUT/robustness.json" --output "$OUT/amos_robustness_gate.json"
          else
            printf '%s\n' '{"schema":"amos-robustness-gate-v1","status":"INVALID","missing":["wfo","monte_carlo","parameter_stability","regime_segmentation","master_checker"]}' > "$OUT/amos_robustness_gate.json"
          fi

      - name: Evaluate shadow/live parity when present
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT="results/ae-bt/${{ inputs.experiment_id }}"
          if [ -f "$OUT/live_parity.json" ]; then
            python research/amos_live_parity.py "$OUT/live_parity.json" --output "$OUT/amos_live_parity_gate.json"
          else
            printf '%s\n' '{"schema":"amos-live-parity-v1","status":"INVALID","missing":["return","pf","drawdown","slippage","fill_rate","exposure","unresolved_inventory","basket_age"]}' > "$OUT/amos_live_parity_gate.json"
          fi

      - name: Evaluate portfolio governance when present
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT="results/ae-bt/${{ inputs.experiment_id }}"
          if [ -f "$OUT/portfolio.json" ]; then
            python research/amos_portfolio_gate.py "$OUT/portfolio.json" --output "$OUT/amos_portfolio_gate.json"
          else
            printf '%s\n' '{"schema":"amos-portfolio-gate-v1","status":"INVALID","missing":["engine_contribution","cross_engine_dependence","aggregate_exposure","event_budget","margin_stress","concentration"]}' > "$OUT/amos_portfolio_gate.json"
          fi

      - name: Finalize AMOS governance verdict
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT="results/ae-bt/${{ inputs.experiment_id }}"
          python research/amos_governance_finalize.py "$OUT" --output "$OUT/amos_governance_final.json"

      - name: Upload immutable BT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-${{ inputs.lane_class }}-${{ inputs.experiment_id }}
          path: results/ae-bt/${{ inputs.experiment_id }}/
          if-no-files-found: error
          retention-days: 90
